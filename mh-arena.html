<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>حلبة الشخصية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: one-column night arena. A boxing ring (الهو vs الأنا الأعلى, الأنا as referee) frames every level; a sticky HUD carries level, score and sound. Single dark look by choice. */
:root{
  color-scheme:dark;
  --ink:#0c1322; --panel:#141e36; --raise:#1d2a4a; --line:#2d3d68;
  --text:#eef2ff; --muted:#a9b5d9;
  --id:#4a7bff; --id-d:#2f5be0; --id-t:#a5bcff;
  --ego:#f2c75c; --ego-d:#d9a92f; --ego-ink:#1b1405;
  --sup:#ff6a4d; --sup-d:#c73b22; --sup-t:#ff9f8c;
  --good:#3ed6a0; --bad:#ff5d73;
  --font-display:'Lalezar','Readex Pro',Tahoma,system-ui,sans-serif;
  --font-body:'Readex Pro',Tahoma,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--ink)}
body{
  margin:0;color:var(--text);font:400 16px/1.8 var(--font-body);
  padding-block:0 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#root{max-width:560px;margin-inline:auto}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--ego);outline-offset:3px;border-radius:10px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}

/* HUD */
.hud{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;gap:12px;padding:10px 0 12px;
  background:linear-gradient(var(--ink) 78%,rgba(12,19,34,0));
}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lvl span{font:500 .82rem/1.2 var(--font-body);color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{flex:1;max-width:44px;height:7px;border-radius:4px;background:var(--raise)}
.dots i.done{background:var(--ego)}
.dots i.cur{background:transparent;box-shadow:inset 0 0 0 2px var(--ego)}
.score{display:flex;align-items:baseline;gap:5px;font-variant-numeric:tabular-nums}
.score b{font:400 1.7rem/1 var(--font-display);color:var(--ego)}
.score small{font-size:.75rem;color:var(--muted)}
.score.bump b{animation:bump .4s ease-out}
.combo{display:inline-flex;align-items:center;gap:3px;margin-inline-end:6px;padding:2px 9px 2px 7px;border-radius:999px;background:var(--sup-d);color:#fff;font:400 1rem/1.5 var(--font-display);animation:pulse 1s ease-in-out infinite}
.combo svg{width:15px;height:15px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.icon-btn svg{width:22px;height:22px}

/* screens */
.screen{display:flex;flex-direction:column;gap:16px;animation:rise .35s ease-out both}
.eyebrow{font:500 .85rem/1.4 var(--font-body);color:var(--ego)}
h1{font:400 clamp(2.9rem,15vw,4.2rem)/1.1 var(--font-display);color:var(--ego);text-shadow:0 3px 0 #7a5a12,0 0 28px rgba(242,199,92,.25)}
h2{font:400 2rem/1.2 var(--font-display);text-wrap:balance}
h3{font:400 1.45rem/1.3 var(--font-display)}
.sub,.rule{color:var(--muted);font-size:1.02rem;max-width:34em}
.tiny{font-size:.82rem;color:var(--muted);text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}

/* buttons */
.btn{min-height:54px;padding:8px 22px;border-radius:16px;font:400 1.3rem/1.3 var(--font-display);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.primary{background:var(--ego);color:var(--ego-ink)}
.btn.big{min-height:62px;font-size:1.55rem;width:100%}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn svg{width:22px;height:22px}

/* ring */
.ring{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);padding-top:14px;
  background:radial-gradient(110% 70% at 50% -8%,rgba(242,199,92,.30),rgba(242,199,92,0) 62%),linear-gradient(#18244a,#0e1730)}
.ring::before{content:"";position:absolute;inset:-20% 10% auto;height:70%;background:conic-gradient(from 160deg at 50% 0,rgba(255,255,255,0),rgba(255,255,255,.10) 8%,rgba(255,255,255,0) 16%);transform-origin:50% 0;animation:sweep 7s ease-in-out infinite alternate;pointer-events:none}
.ropes{position:absolute;inset:0;pointer-events:none}
.rope{position:absolute;inset-inline:0;height:5px;border-radius:3px;opacity:.9}
.r1{top:46%;background:var(--sup)}
.r2{top:60%;background:#e9eeff}
.r3{top:74%;background:var(--id)}
.floor{height:26px;background:linear-gradient(#2c3e70,#1b2850);border-top:3px solid #3d5189;position:relative}
.cast{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-inline:6px;align-items:end}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;min-width:0}
.char{display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
.char svg{width:min(100%,128px);height:auto;display:block;overflow:visible;animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
.char .nm{margin-top:-4px;margin-bottom:10px;padding:1px 12px 3px;border-radius:999px;background:rgba(7,12,24,.65);font:400 1.1rem/1.4 var(--font-display);white-space:nowrap}
.char.id .nm{color:var(--id-t)} .char.ego .nm{color:var(--ego)} .char.sup .nm{color:var(--sup-t)}
button.char{transition:transform .15s,filter .2s}
button.char:active{transform:scale(.96)}
button.char.on svg{filter:drop-shadow(0 0 12px var(--glow))}
button.char.id{--glow:var(--id)} button.char.ego{--glow:var(--ego)} button.char.sup{--glow:var(--sup)}
button.char.on .nm{background:var(--glow);color:#fff}
button.char.ego.on .nm{color:var(--ego-ink)}
.char.cheer svg{animation:cheer .7s ease-out}
.char.hurt svg{animation:shake .45s ease-out}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
.scale{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.6s ease-in-out infinite alternate}
.halo{animation:glow 2s ease-in-out infinite alternate}
.sbub{position:relative;padding:6px 10px;border-radius:12px;font:500 .84rem/1.5 var(--font-body);text-align:center;color:#fff;max-width:100%}
.sbub::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:0}
.sbub.id{background:var(--id-d)} .sbub.id::after{border-top-color:var(--id-d)}
.sbub.sup{background:var(--sup-d)} .sbub.sup::after{border-top-color:var(--sup-d)}
.sbub.ego{background:var(--ego);color:var(--ego-ink)} .sbub.ego::after{border-top-color:var(--ego)}
.ring.mini .char svg{width:min(100%,84px)}
.ring.mini .nm{font-size:.95rem}

/* learn */
.info{border-top:4px solid var(--c,var(--line));min-height:210px;display:flex;flex-direction:column;gap:10px}
.info-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}
.info[style*="--ego"] .badge{color:var(--ego-ink)}
.badge svg{width:24px;height:24px}
.chip{padding:0 12px;border-radius:999px;font-size:.8rem;font-weight:500;border:1px solid var(--c);color:var(--text)}
.says{font:400 1.25rem/1.5 var(--font-display);color:var(--c)}
.facts{display:flex;flex-direction:column;gap:6px}
.facts li{position:relative;padding-inline-start:20px;font-size:.98rem}
.facts li::before{content:"";position:absolute;inset-inline-start:2px;top:.75em;width:8px;height:8px;border-radius:2px;background:var(--c);transform:rotate(45deg)}
.learn-foot{display:flex;align-items:center;gap:14px}
.learn-foot .btn{flex:1}
.seen{display:flex;gap:6px}
.seen i{width:14px;height:14px;border-radius:50%;background:var(--raise);border:2px solid var(--line)}
.seen i.on{background:var(--ego);border-color:var(--ego)}

/* quiz shared */
.prog{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted)}
.prog span{white-space:nowrap}
.bar{flex:1;height:8px;border-radius:5px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ego-d),var(--ego));border-radius:5px;transition:width .4s}
.who-stage{display:flex;align-items:flex-end;gap:14px}
.speaker{width:88px;flex:none}
.speaker svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:relative;flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font:500 1.12rem/1.8 var(--font-body);text-wrap:pretty}
.bubble::after{content:"";position:absolute;right:-9px;bottom:22px;border-left:9px solid var(--raise);border-top:9px solid transparent;border-bottom:9px solid transparent}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:12px;min-height:60px;padding:6px 14px;border-radius:16px;text-align:start;box-shadow:0 5px 0 rgba(0,0,0,.4);color:#fff;transition:transform .08s,box-shadow .08s,opacity .2s}
.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.ans.id{background:var(--id-d)} .ans.ego{background:var(--ego);color:var(--ego-ink)} .ans.sup{background:var(--sup-d)}
.ans .ico{width:38px;height:38px;border-radius:11px;background:rgba(0,0,0,.22);display:grid;place-items:center;flex:none}
.ans .ico svg{width:22px;height:22px}
.ans .nm{font:400 1.35rem/1.2 var(--font-display);flex:1}
.ans .sub{font-size:.8rem;opacity:.85}
.ans:disabled{cursor:default}
.ans.dim{opacity:.35}
.ans.right{outline:4px solid var(--good);outline-offset:2px;animation:pulse .8s ease-in-out 2}
.ans.wrong{outline:4px solid var(--bad);outline-offset:2px}
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--good);background:rgba(62,214,160,.10);animation:rise .3s ease-out both}
.fb.no{border-color:var(--bad);background:rgba(255,93,115,.10)}
.fb b{font:400 1.35rem/1.3 var(--font-display);display:flex;align-items:center;gap:8px}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb b svg{width:24px;height:24px}
.fb p{font-size:.98rem}

/* referee */
.scene{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.scene .lab{font:500 .8rem/1.3 var(--font-body);color:var(--ego)}
.scene p{font:500 1.1rem/1.8 var(--font-body)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{min-height:72px;padding:8px 6px;border-radius:16px;background:var(--raise);border:2px solid var(--line);box-shadow:0 5px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .08s,box-shadow .08s,opacity .2s}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.opt b{font:400 1.35rem/1.3 var(--font-display);color:var(--ego)}
.opt small{font-size:.76rem;color:var(--muted)}
.opt.right{border-color:var(--good);background:rgba(62,214,160,.16)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,115,.16)}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}

/* sequence */
.meter{display:flex;flex-direction:column;gap:8px}
.meter-top{display:flex;justify-content:space-between;font:400 1.05rem/1.2 var(--font-display)}
.meter-top span:first-child{color:var(--sup-t)} .meter-top span:last-child{color:var(--good)}
.track{position:relative;height:18px;border-radius:10px;background:var(--raise);overflow:hidden}
.track i{position:absolute;inset:0;border-radius:10px;background:linear-gradient(270deg,var(--sup),var(--ego) 55%,var(--good));transform:scaleX(.06);transform-origin:100% 50%;transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.slots{display:flex;flex-direction:column;gap:8px}
.sl{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px;border-radius:14px;border:2px dashed var(--line);color:var(--muted);font-size:.95rem;transition:background .3s,border-color .3s}
.sl .n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font:400 1.1rem/1 var(--font-display);background:var(--raise);font-variant-numeric:tabular-nums}
.sl .txt{min-width:0}
.sl.filled{border-style:solid;border-color:var(--good);background:rgba(62,214,160,.10);color:var(--text);animation:pop .4s ease-out}
.sl.filled .n{background:var(--good);color:#06281d}
.chips{display:flex;flex-direction:column;gap:8px}
.chip-b{padding:10px 14px;min-height:54px;border-radius:14px;background:var(--raise);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.4);text-align:start;font-size:.98rem;line-height:1.6;transition:transform .08s,box-shadow .08s}
.chip-b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.chip-b.used{display:none}

/* true / false */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .btn{min-height:68px;font-size:1.5rem}
.tf .t{background:var(--good);color:#06281d}
.tf .f{background:var(--bad);color:#2b0710}
.tf .btn.dim{opacity:.35}
.tf .btn.right{outline:4px solid #fff;outline-offset:2px}
.statement{padding:22px 18px;border-radius:20px;background:var(--raise);border:1px solid var(--line);font:500 1.2rem/1.9 var(--font-body);text-wrap:pretty;min-height:150px;display:flex;align-items:center}

/* result */
.stars{display:flex;justify-content:center;gap:10px}
.stars svg{width:62px;height:62px;color:var(--raise);fill:var(--raise);stroke:var(--line);stroke-width:1}
.stars svg.on{color:var(--ego);fill:var(--ego);stroke:#a67b12;animation:starpop .6s cubic-bezier(.2,1.6,.4,1) both}
.rank{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.rank h2{color:var(--ego)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 6px;text-align:center;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font:400 1.8rem/1.2 var(--font-display);color:var(--ego);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.sum{display:flex;flex-direction:column;gap:10px}
.sum h3{color:var(--ego)}
.sumrow{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--raise);border-inline-start:5px solid var(--c)}
.sumrow .badge{width:34px;height:34px;flex:none;border-radius:10px}
.sumrow .badge svg{width:20px;height:20px}
.sumrow h4{margin:0;font:400 1.2rem/1.4 var(--font-display);color:var(--c)}
.sumrow p{font-size:.93rem;line-height:1.75}
.key{padding:14px 16px;border-radius:16px;background:rgba(242,199,92,.12);border:1px solid var(--ego);font-weight:500}
.think li{position:relative;padding-inline-start:20px;font-size:.95rem}
.think li::before{content:"";position:absolute;inset-inline-start:2px;top:.8em;width:8px;height:8px;border-radius:50%;background:var(--ego)}

/* fx */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.pop{position:fixed;z-index:70;transform:translate(-50%,0);font:400 1.7rem/1 var(--font-display);pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.6);animation:floatup .95s ease-out forwards}
.shake{animation:shake .4s ease-out}
.flash{animation:flash .5s ease-out}

@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:none}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes cheer{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.06)}70%{transform:translateY(0) scale(.98)}100%{transform:none}}
@keyframes breathe{50%{transform:scaleY(1.025)}}
@keyframes flick{from{transform:scale(1,.9) rotate(-3deg)}to{transform:scale(1.08,1.12) rotate(3deg)}}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes glow{from{opacity:.45}to{opacity:1}}
@keyframes sweep{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(242,199,92,.7)}100%{box-shadow:0 0 0 22px rgba(242,199,92,0)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

</div>

/* ---------- audio (synthesized, starts after first tap) ---------- */
var AC=null,master=null,musicTimer=null,mStep=0;
function ensureAudio(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.85;master.connect(AC.destination)}catch(e){AC=null}
  }
  if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}
}
function tone(f,d,type,v,delay,slide){
  if(!AC||!S.sound)return;
  d=d||.15;v=v||.15;delay=delay||0;
  var t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
var SFX={
  tap:function(){tone(520,.07,'triangle',.12)},
  ok:function(){tone(660,.12,'triangle',.2);tone(990,.2,'triangle',.2,.09)},
  bad:function(){tone(220,.28,'sawtooth',.12,0,110)},
  step:function(n){tone(330*Math.pow(1.122,n*2),.16,'triangle',.2);tone(660*Math.pow(1.122,n*2),.12,'sine',.1,.05)},
  bell:function(){[880,1320,1760,2640].forEach(function(f,i){tone(f,1.3,'sine',.11/(i+1)*1.6)})},
  up:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.22,'triangle',.18,i*.09)})},
  star:function(i){tone(700+i*180,.3,'triangle',.2);tone(1400+i*360,.25,'sine',.08,.06)},
  win:function(){[523,659,784,1047,1319,1568].forEach(function(f,i){tone(f,.3,'triangle',.18,i*.1)})}
};
var PAT=[0,2,4,2,5,4,2,1],SC=[261.63,293.66,329.63,392,440,523.25];
function startMusic(){
  stopMusic();if(!AC||!S.sound)return;
  musicTimer=setInterval(function(){
    var n=PAT[mStep%PAT.length];
    tone(SC[n],.55,'sine',.035);
    if(mStep%8===0)tone(SC[0]/2,1.6,'triangle',.05);
    if(mStep%4===2)tone(SC[(n+2)%6]*2,.3,'sine',.018);
    mStep++;
  },430);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

var cv=$('#fx'),cx=cv.getContext('2d'),parts=[],raf=0;
function sizeCv(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
function burst(x,y,n){
  if(RM)return;sizeCv();
  var cols=['#4a7bff','#f2c75c','#ff6a4d','#eef2ff','#3ed6a0'];
  for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,g:.32,s:Math.random()*6+3,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1});
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.l>0&&p.y<innerHeight+30});
  parts.forEach(function(p){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l-=.008;
    cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore();
  });
  raf=parts.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}
function burstAt(el,n){var r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n||36)}
function popAt(el,text,color){
  var r=el.getBoundingClientRect(),p=document.createElement('span');
  p.className='pop';p.textContent=text;p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+4)+'px';p.style.color=color;
  document.body.appendChild(p);setTimeout(function(){p.remove()},1000);
}
function retrig(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function mood(k,m){var el=$('.char.'+k);if(el){el.classList.remove('cheer','hurt');void el.offsetWidth;el.classList.add(m)}}

function hud(bump){
  var t=S.lvl<0?'جاهز للمباراة؟':S.lvl>=5?'النتيجة النهائية':'المرحلة '+(S.lvl+1)+' من 5';

   '<div class="score'+(bump?' bump':'')+'">'+(S.streak>=2?'<span class="combo">'+icon('id')+'×'+S.streak+'</span>':'')+'<b>'+S.score+'</b><small>نقطة</small></div>'+

}
function award(base,el){
  S.streak++;S.top=Math.max(S.top,S.streak);S.right++;
  var pts=base+Math.min(S.streak-1,5)*20;S.score+=pts;hud(true);
  popAt(el,'+'+pts,'var(--good)');SFX.ok();burstAt(el,S.streak>=3?30:14);
}
function miss(el){S.streak=0;S.wrong++;hud();SFX.bad();retrig(el,'shake')}

      b.classList.add('on');mood(k,'cheer');

        '<p class="says">«'+R.says+'»</p><ul class="facts">'+R.pts.map(function(p){return '<li>'+p+'</li>'}).join('')+'</ul>';
      retrig(info,'flash');
      if(!seen[k]){
        seen[k]=1;n++;S.score+=30;hud(true);popAt(b,'+30','var(--ego)');SFX.star(n-1);
        document.querySelectorAll('.seen i').forEach(function(d,i){if(i<n)d.classList.add('on')});
        if(n===3){$('#ln').disabled=false;burstAt($('#ln'),30);SFX.up()}

/* L2 — who speaks */
function runWho(){
  var qs=shuffle(WHO),i=0,lock=false;
  function draw(){
    lock=false;var q=qs[i],h='';
    ['id','ego','sup'].forEach(function(k){
      h+='<button class="ans '+k+'" data-act="pick" data-k="'+k+'"><span class="ico">'+icon(k)+'</span><span class="nm">'+ROLE[k].name+'</span><span class="sub">'+ROLE[k].short+'</span></button>';
    });
    view('<section class="screen"><div class="prog"><span>العبارة '+(i+1)+' من '+qs.length+'</span><div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div></div>'+
      '<div class="who-stage"><div class="speaker" id="spk">'+SIL+'</div><div class="bubble"><p>«'+q.t+'»</p></div></div>'+
      '<div class="answers" id="ans">'+h+'</div></section>');
  }
  cur={
    pick:function(b){
      if(lock)return;lock=true;
      var q=qs[i],k=b.dataset.k,ok=k===q.a;
      document.querySelectorAll('.ans').forEach(function(x){
        x.disabled=true;
        if(x.dataset.k===q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong');else x.classList.add('dim');
      });
      $('#spk').innerHTML='<div class="char '+q.a+' cheer" style="width:100%">'+SVG[q.a]+'</div>';
      if(ok)award(100,b);else miss(b);
      showFb(ok,(ok?'':'المتكلم هو '+ROLE[q.a].name+'. ')+q.r,i===qs.length-1?'إنهاء المرحلة':'التالي');
    },
    next:function(){SFX.tap();i++;if(i<qs.length)draw();else nextLevel()}
  };
  draw();
}

/* L3 — be the referee */
function runRef(){
  var qs=shuffle(REF),i=0,lock=false;
  function draw(){
    lock=false;var q=qs[i];
    view('<section class="screen"><div class="prog"><span>الموقف '+(i+1)+' من '+qs.length+'</span><div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div></div>'+
      '<div class="panel scene"><span class="lab">الموقف</span><p>'+q.s+'</p></div>'+
      ring({bub:{id:q.id,ego:'أنت الحكم',sup:q.sup}})+
      '<div class="opts" id="opts">'+OPT.map(function(o,n){return '<button class="opt" data-act="pick" data-n="'+(n+1)+'"><b>'+o.b+'</b><small>'+o.s+'</small></button>'}).join('')+'</div></section>');
  }
  cur={
    pick:function(b){
      if(lock)return;lock=true;
      var q=qs[i],n=+b.dataset.n,ok=n===q.a;
      document.querySelectorAll('.opt').forEach(function(x){
        x.disabled=true;var m=+x.dataset.n;
        if(m===q.a)x.classList.add('right');else if(x===b)x.classList.add('wrong');else x.classList.add('dim');
      });
      if(ok){
        award(120,b);mood('ego','cheer');
        if(q.a===1)mood('id','cheer');
        if(q.a===3){mood('sup','cheer');mood('id','hurt')}
      }else{miss(b);mood('ego','hurt')}
      showFb(ok,(ok?'':'الأفضل: '+OPT[q.a-1].b+'. ')+q.r,i===qs.length-1?'إنهاء المرحلة':'التالي');
    },
    next:function(){SFX.tap();i++;if(i<qs.length)draw();else nextLevel()}
  };
  draw();
}

/* L4 — sequence */
function runSeq(){
  var order=shuffle(SEQ.map(function(t,n){return {t:t,n:n}})),next=0,done=false;
  var slots='',chips='';
  SEQ.forEach(function(_,n){slots+='<li class="sl" id="sl'+n+'"><span class="n">'+(n+1)+'</span><span class="txt">؟</span></li>'});
  order.forEach(function(c){chips+='<button class="chip-b" data-act="chip" data-n="'+c.n+'">'+c.t+'</button>'});
  view('<section class="screen"><div class="panel meter"><div class="meter-top"><span>توتر</span><span>اتزان</span></div><div class="track"><i id="fill"></i></div></div>'+
    '<ol class="slots">'+slots+'</ol><div class="chips" id="chips">'+chips+'</div></section>');
  cur={
    chip:function(b){
      if(done||b.classList.contains('used'))return;
      var n=+b.dataset.n;
      if(n===next){
        var s=$('#sl'+next);s.classList.add('filled');s.querySelector('.txt').textContent=SEQ[n];
        b.classList.add('used');award(100,s);SFX.step(next);next++;
        $('#fill').style.transform='scaleX('+Math.max(.06,next/SEQ.length)+')';
        if(next===SEQ.length){
          done=true;SFX.bell();burstAt($('#fill'),60);
          showFb(true,'هذه هي الدورة كاملة. وتتم العملية عبر قوى الشخصية الثلاث: الهو والأنا والأنا الأعلى.','إلى النزال الأخير');
        }
      }else{miss(b)}
    },
    next:function(){SFX.tap();nextLevel()}
  };
}

/* L5 — true / false */
function runTF(){
  var qs=shuffle(TF),i=0,lock=false;
  function draw(){
    lock=false;var q=qs[i];
    view('<section class="screen"><div class="prog"><span>العبارة '+(i+1)+' من '+qs.length+'</span><div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div></div>'+

  };
  draw();
}

/* result */
function result(){
  cur=null;stopMusic();hud();
  var tot=S.right+S.wrong,acc=tot?Math.round(S.right/tot*100):0;
  var stars=acc>=85?3:acc>=65?2:1;
  var rank=stars===3?'بطل الاتزان':stars===2?'حكم ماهر':'حكم صاعد';
  var best=loadBest(),isBest=S.score>best;if(isBest){saveBest(S.score);best=S.score}
  var st='';for(var i=0;i<3;i++)st+=STAR.replace('<svg','<svg data-s="'+i+'"');
  var rows=[
    ['id','الهو','قوة لاشعورية غريزية، أساس الشخصية. يبحث عن اللذة والإشباع دون حدود.'],
    ['ego','الأنا','قوة شعورية تتعامل مع الواقع. توفق بين الدوافع والمتطلبات: تلبي أو تؤجل أو تمنع.'],
    ['sup','الأنا الأعلى','قوة لاشعورية من القيم والتقاليد. صوت المجتمع والضمير، يكف رغبات الهو.']
  ].map(function(r){return '<div class="sumrow" style="--c:var('+ROLE[r[0]].c+')"><span class="badge" style="color:'+(r[0]==='ego'?'var(--ego-ink)':'#fff')+'">'+icon(r[0])+'</span><div><h4>'+r[1]+'</h4><p>'+r[2]+'</p></div></div>'}).join('');
  view('<section class="screen">'+
    '<p class="eyebrow" style="text-align:center">انتهت المباراة</p>'+
    '<div class="stars" id="stars">'+st+'</div>'+
    '<div class="rank"><h2>'+rank+'</h2><p class="sub">'+(isBest?'رقم قياسي جديد على هذا الجهاز.':'أعلى نتيجة لك على هذا الجهاز: '+best)+'</p></div>'+
    '<div class="stats"><div class="stat"><b>'+S.score+'</b><span>النقاط</span></div><div class="stat"><b>'+acc+'٪</b><span>الدقة</span></div><div class="stat"><b>×'+S.top+'</b><span>أطول متتالية</span></div></div>'+
    '<div class="panel sum"><h3>ملخص الدرس</h3>'+
      '<p>الإنسان جهاز طاقة؛ حين يتعرض لمثير يتوتر، ثم يتحرك ليعود إلى الاتزان واللذة. وتتم هذه العملية عبر ثلاث قوى:</p>'+rows+
      '<p>ويبدأ الأنا الأعلى بسلطة الأب: ينهى الطفل ويوجهه، فيقلدها، ثم تصير ضميراً يؤنبه ويراقبه.</p>'+
      '<div class="key">العلاقة بين الهو والأنا والأنا الأعلى هي التي تحدد نوع سلوك الإنسان.</div></div>'+
    '<div class="panel sum"><h3>ناقش زملاءك</h3><ul class="think">'+
      '<li>بعض الأحداث يكذبون أو يسرقون أو يهربون أو يعتدون لغير سبب واضح. كيف يفسر التحليل النفسي ذلك؟</li>'+
      '<li>أحياناً ينسى الطالب أسماء زملائه في المراحل الأولى من الدراسة. ما علاقة ذلك بالصراع بين عناصر الشخصية؟</li></ul></div>'+
    '<button class="btn primary big" data-act="again">العب من جديد</button></section>');
  SFX.bell();
  setTimeout(function(){burst(innerWidth/2,innerHeight*.3,70)},300);
  for(var s=0;s<stars;s++){(function(s){setTimeout(function(){
    var el=$('#stars svg[data-s="'+s+'"]');if(el){el.classList.add('on');SFX.star(s)}
    if(s===stars-1){SFX.win();burst(innerWidth/2,innerHeight*.28,60)}
  },700+s*450)})(s)}
}

/* ---------- global actions ---------- */
var G={
  start:function(){S.lvl=0;S.score=0;S.streak=0;S.top=0;S.right=0;S.wrong=0;startMusic();briefing()},
  go:function(){SFX.tap();LEVELS[S.lvl].run()},

    S.sound=!S.sound;
    if(!S.sound)stopMusic();else{ensureAudio();SFX.tap();if(S.lvl>=0&&S.lvl<5)startMusic()}
    hud();
  }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  ensureAudio();
  var a=b.dataset.act,f=(cur&&cur[a])||G[a];if(f)f(b,e);
});

/* ---------- intro ---------- */
function intro(){

    '<p class="eyebrow">الصحة النفسية · التحليل النفسي</p>'+

    ring({bub:{id:'أريد الآن!',ego:'مهلاً، لنفكر',sup:'عيب! لا تفعل'}})+

    '<p class="tiny">5 مراحل، نحو 6 دقائق. شغّل الصوت لتحصل على التجربة كاملة.</p></section>');
}
intro();
})();

  root.classList.toggle("dza-dys",S.dys);root.classList.toggle("dza-cur",S.cursor);root.classList.toggle("dza-read",S.read);
  if(fab)fab.classList.toggle("dza-on",S.deaf||S.size||S.hc||S.calm||S.read||S.dys||S.cursor);
}

/* ---------- بديل مرئي للأصوات ---------- */
const KINDS={
  bad:{t:"صوت: إجابة غير صحيحة",i:"✖",c:"#ef4444",v:[90,60,90]},
  win:{t:"صوت: احتفال وتصفيق",i:"🎉",c:"#f5b301",v:[220]},
  ok:{t:"صوت: إجابة صحيحة",i:"✔",c:"#22c55e",v:[120]},
  tick:{t:"صوت: تكتكة",i:"⏱",c:"#60a5fa",v:null,small:1},
  gen:{t:"مؤثر صوتي",i:"🔊",c:"#a78bfa",v:null}
};
const PR={gen:0,tick:1,ok:2,win:3,bad:4,label:5};
let pend=null,pendLabel=null,grp={tri:0,saw:0,sq:0,n:0},gt=0,cap,edge,capT=0;
function sig(k,label){
  if(!S.deaf)return;
  if(k==="label"){pendLabel=label}
  if(!pend||PR[k]>PR[pend])pend=k;
  clearTimeout(gt);gt=setTimeout(flush,110);
}
function flush(){
  let k=pend;const L=pendLabel;
  if(k!=="label"&&k!=="bad"){if(grp.saw)k="bad";else if(grp.tri>=6)k="win";else if(grp.tri>=3)k="ok";else if(grp.sq&&grp.n===grp.sq)k="tick"}
  pend=null;pendLabel=null;grp={tri:0,saw:0,sq:0,n:0};
  show(k==="label"?{t:L.t,i:L.i,c:L.c||"#a78bfa",v:null}:KINDS[k]||KINDS.gen);
}
function show(K){
  if(!cap){cap=document.createElement("div");cap.className="dza-cap";cap.setAttribute("role","status");cap.setAttribute("aria-live","polite");
    edge=document.createElement("div");edge.className="dza-edge";document.body.append(edge,cap)}
  cap.style.setProperty("--dzc",K.c);edge.style.setProperty("--dzc",K.c);
  cap.innerHTML=`<i aria-hidden="true">${K.i}</i><span>${K.t}</span>`;
  cap.hidden=false;cap.style.fontSize=K.small?"18px":"";
  cap.classList.remove("dza-in");void cap.offsetWidth;cap.classList.add("dza-in");
  if(!K.small){edge.classList.add("dza-in");setTimeout(()=>edge.classList.remove("dza-in"),220)}
  if(fab){fab.classList.remove("dza-ping");void fab.offsetWidth;fab.classList.add("dza-ping")}
  if(S.vib&&K.v&&navigator.vibrate)try{navigator.vibrate(K.v)}catch(e){}
  clearTimeout(capT);capT=setTimeout(()=>{cap.hidden=true},K.small?700:1800);
}
/* ربط الأصوات */
function hookTone(){
  if(typeof window.tone!=="function"||window.tone.__dza)return;
  const orig=window.tone;
  const w=function(f,d,v,type,t0){
    type=type||"sine";
    grp.n++;if(type==="triangle")grp.tri++;else if(type==="sawtooth"&&f<420)grp.saw++;else if(type==="square"&&f>=1000&&(d||.1)<=.05)grp.sq++;
    sig("gen");
    if(S.calm&&v!=null)v=v*.35;else if(S.calm)v=.03;
    return orig.call(this,f,d,v,type,t0);
  };w.__dza=1;window.tone=w;
}
function hookFX(){
  let fx;try{fx=WSFX}catch(e){return}
  if(!fx||fx.__dza)return;fx.__dza=1;
  const L={drumroll:["🥁","قرع طبول… ترقّب"],crank:["⚙️","صوت دوران الآلة"],balls:["🔵","صوت خلط الكرات"],roll:["🎲","صوت دحرجة"],wood:["🪵","صوت أعواد خشبية"],pull:["✋","صوت سحب"],pencils:["✏️","صوت أقلام"],rustle:["📄","صوت أوراق"],unfold:["📜","صوت فتح الورقة"],fanfare:["🎺","احتفال! النتيجة ظهرت"],sparkle:["✨","صوت لمعة"],whoosh:["💨","صوت حركة"],boing:["🟢","صوت قفزة"],pop:["🫧","صوت فقاعة"],scribble:["🖍️","صوت كتابة"]};
  Object.keys(fx).forEach(k=>{if(typeof fx[k]!=="function"||!L[k])return;const o=fx[k];fx[k]=function(){sig("label",{i:L[k][0],t:L[k][1]});return o.apply(this,arguments)}});
}
try{const P=(window.AudioScheduledSourceNode||{}).prototype;if(P&&P.start&&!P.start.__dza){const o=P.start;P.start=function(){sig("gen");return o.apply(this,arguments)};P.start.__dza=1}}catch(e){}
/* الاحتفال الكبير */
function hookCelebrate(){
  if(typeof window.celebrate!=="function"||window.celebrate.__dza)return;
  const o=window.celebrate;const w=function(text){sig("label",{i:"🎉",t:"احتفال: "+String(text||"أحسنتم").replace(/<[^>]+>/g,"").slice(0,40),c:"#f5b301"});return o.apply(this,arguments)};w.__dza=1;window.celebrate=w;
}

/* ---------- القراءة الصوتية ---------- */
let arVoice=null;
function voices(){try{const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){voices();try{speechSynthesis.onvoiceschanged=voices}catch(e){}}
function speak(t){if(!("speechSynthesis" in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=arVoice?arVoice.lang:"ar-SA";if(arVoice)u.voice=arVoice;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{
  if(!S.read||e.target.closest(".dza-ov,.dza-fab,.dza-sign"))return;
  const el=e.target.closest("p,h1,h2,h3,h4,li,label,button,[role=button],td,th,.q,.card")||e.target;
  let t=(el.innerText||el.getAttribute("aria-label")||"").replace(/\s+/g," ").trim();
  if(!t&&el.getAttribute)t=el.getAttribute("aria-label")||"";
  if(t)speak(t.slice(0,400));
},true);

/* ---------- فيديو لغة الإشارة (يحفظ على هذا الجهاز) ---------- */
const PAGE=(location.pathname.split("/").pop()||"index.html");
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("dz-sign",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function vget(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("v").objectStore("v").get(PAGE);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function vput(b){const db=await idb();return new Promise((r,j)=>{const tx=db.transaction("v","readwrite");b?tx.objectStore("v").put(b,PAGE):tx.objectStore("v").delete(PAGE);tx.oncomplete=()=>r();tx.onerror=()=>j(tx.error)})}
let signBox=null,signURL=null;
async function openSign(){
  const b=await vget();if(!b){openPanel();return}
  if(signBox)signBox.remove();if(signURL)URL.revokeObjectURL(signURL);
  signURL=URL.createObjectURL(b);
  signBox=document.createElement("div");signBox.className="dza-sign";signBox.setAttribute("role","region");signBox.setAttribute("aria-label","فيديو لغة الإشارة");
  signBox.innerHTML=`<div class="dza-sbar"><span>🤟 لغة الإشارة</span><button type="button" data-a="big" aria-label="تكبير أو تصغير">⤢</button><button type="button" data-a="x" aria-label="إغلاق">✕</button></div><video controls playsinline src="${signURL}"></video>`;
  document.body.appendChild(signBox);
  signBox.querySelector('[data-a="x"]').onclick=()=>{signBox.remove();signBox=null};
  signBox.querySelector('[data-a="big"]').onclick=()=>signBox.classList.toggle("dza-big");
  const bar=signBox.querySelector(".dza-sbar");let sx,sy,ox,oy,drag=false;
  bar.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag=true;bar.setPointerCapture(e.pointerId);const r=signBox.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top});
  bar.addEventListener("pointermove",e=>{if(!drag)return;signBox.style.left=Math.max(0,Math.min(innerWidth-60,ox+e.clientX-sx))+"px";signBox.style.top=Math.max(0,Math.min(innerHeight-40,oy+e.clientY-sy))+"px";signBox.style.right="auto";signBox.style.bottom="auto"});
  bar.addEventListener("pointerup",()=>drag=false);
  try{signBox.querySelector("video").play().catch(()=>{})}catch(e){}
}

/* ---------- الواجهة ---------- */
const ICON='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="12" cy="4" r="2.2"/><path d="M4 7.5c0-.6.5-1 1.1-.9 2.3.4 4.6.6 6.9.6s4.6-.2 6.9-.6c.6-.1 1.1.3 1.1.9 0 .5-.3.9-.8 1-1.8.4-3.6.6-5.2.7v3.6l2 7.6c.2.6-.2 1.2-.8 1.3-.5.1-1-.2-1.2-.7L12 15.6 9.9 21c-.2.5-.7.8-1.2.7-.6-.1-1-.7-.8-1.3l2-7.6V9.2c-1.6-.1-3.4-.3-5.2-.7-.5-.1-.8-.5-.7-1z"/></svg>';
let fab,ov;
function toggleCard(k,ic,title,desc){return `<button type="button" class="dza-t" data-k="${k}" aria-pressed="${!!S[k]}"><span class="dza-ic" aria-hidden="true">${ic}</span><span><b>${title}</b><small>${desc}</small></span><span class="dza-sw" aria-hidden="true"></span></button>`}
function build(){
  fab=document.createElement("button");fab.type="button";fab.className="dza-fab";fab.setAttribute("aria-label","إمكانية الوصول");fab.title="إمكانية الوصول";fab.innerHTML=ICON;
  fab.onclick=openPanel;
  ov=document.createElement("div");ov.className="dza-ov";ov.hidden=true;ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-labelledby","dza-h");
  ov.addEventListener("click",e=>{if(e.target===ov)closePanel()});
  document.body.append(fab,ov);
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden)closePanel();if(e.altKey&&(e.key==="a"||e.key==="ش")){e.preventDefault();ov.hidden?openPanel():closePanel()}});
  apply();
}
async function drawPanel(){
  const has=!!(await vget());
  ov.innerHTML=`<div class="dza-box">
  <div class="dza-hd"><h2 id="dza-h">♿ إمكانية الوصول</h2><button type="button" class="dza-x" aria-label="إغلاق">✕</button></div>
  <p class="dza-sub">اختر ما يناسب المتعلمين في صفك. الإعدادات تُحفظ على هذا الجهاز وتعمل في كل ألعاب دروازة.</p>
  <div class="dza-sec">السمع</div>
  <div class="dza-grid">
   ${toggleCard("deaf","🧏","وضع الصم وضعاف السمع","كل صوت يظهر كتابةً بأيقونة ولون، مع وميض حول الشاشة")}
   ${toggleCard("vib","📳","اهتزاز مع الأصوات","في الجوال والتابلت: اهتزاز للإجابة الصحيحة والخاطئة")}
  </div>
  <div class="dza-t" style="cursor:default;margin-top:10px;flex-wrap:wrap"><span class="dza-ic" aria-hidden="true">🤟</span><span style="flex:1;min-width:180px"><b>فيديو لغة الإشارة لهذه الصفحة</b><small>${has?"تم رفع فيديو لهذه الصفحة. يظهر في نافذة صغيرة تقدر تحركها.":"المعلم يرفع فيديو شرح بلغة الإشارة لهذه اللعبة (يُحفظ على هذا الجهاز فقط)."}</small></span>
   <span style="display:flex;gap:6px;flex-wrap:wrap">${has?'<button type="button" class="dza-b" data-a="play">▶ عرض</button><button type="button" class="dza-b dza-g" data-a="del">حذف</button>':""}<button type="button" class="dza-b ${has?"dza-g":""}" data-a="up">${has?"تغيير":"⬆ رفع فيديو"}</button></span>
   <input type="file" accept="video/*" hidden data-a="file"></div>
  <div class="dza-sec">البصر</div>
  <div style="font-weight:700;margin:0 2px 6px">🔠 حجم النص والعناصر</div>
  <div class="dza-seg" role="group" aria-label="حجم النص">${["عادي","كبير","كبير جدًا"].map((n,i)=>`<button type="button" data-z="${i}" aria-pressed="${S.size===i}">${n}</button>`).join("")}</div>
  <div class="dza-grid" style="margin-top:10px">
   ${toggleCard("hc","◐","تباين عالٍ","ألوان أوضح وحدود قوية حول الزر المحدد")}
   ${toggleCard("cursor","🖱️","مؤشر كبير","سهم فأرة كبير وواضح على الشاشة الذكية")}
   ${toggleCard("read","🔊","اقرأ لي","اضغط على أي سؤال أو زر ليُقرأ بصوت عالٍ")}
  </div>
  <div class="dza-sec">التركيز والتعلّم</div>
  <div class="dza-grid">
   ${toggleCard("calm","🌙","وضع هادئ","حركة أقل، أصوات أخفض، بدون قصاصات احتفال. مناسب لطيف التوحد وتشتت الانتباه")}
   ${toggleCard("dys","📖","قراءة مريحة","مسافات أوسع بين الأسطر والكلمات لصعوبات القراءة")}
  </div>
  ${S.read&&!arVoice?'<div class="dza-note">💡 جهازك ما فيه صوت عربي للقراءة. من إعدادات الجهاز: اللغة ← تحويل النص إلى كلام ← نزّل الصوت العربي.</div>':""}
  <div class="dza-row"><button type="button" class="dza-b" data-a="done">تم</button><button type="button" class="dza-b dza-g" data-a="reset">إرجاع الإعدادات الأصلية</button><button type="button" class="dza-b dza-g" data-a="test">جرّب الصوت المرئي</button></div>
  <p class="dza-sub" style="margin:12px 0 0;font-size:12px">اختصار لوحة المفاتيح: Alt + A</p>
  </div>`;
  ov.querySelector(".dza-x").onclick=closePanel;
  ov.querySelectorAll(".dza-t[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S[k]=!S[k];save();apply();b.setAttribute("aria-pressed",S[k]);
    if(k==="deaf"&&S.deaf)show({i:"🧏",t:"وضع الصم مفعّل",c:"#2f6fe0"});if(k==="read"){if(S.read)speak("تم تفعيل القراءة الصوتية");drawPanel()}});
  ov.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{S.size=+b.dataset.z;save();apply();ov.querySelectorAll("[data-z]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const fi=ov.querySelector('[data-a="file"]');
  ov.querySelector('[data-a="up"]').onclick=()=>fi.click();
  fi.onchange=async()=>{const f=fi.files[0];if(!f)return;if(f.size>200*1024*1024){alertBox("الفيديو أكبر من ٢٠٠ ميغابايت. اختر فيديو أقصر.");return}try{await vput(f);await drawPanel();closePanel();openSign()}catch(e){alertBox("ما قدرنا نحفظ الفيديو على هذا الجهاز.")}};
  const p=ov.querySelector('[data-a="play"]');if(p)p.onclick=()=>{closePanel();openSign()};
  const d=ov.querySelector('[data-a="del"]');if(d)d.onclick=async()=>{if(!d.dataset.c){d.dataset.c=1;d.textContent="اضغط مرة ثانية للحذف";return}await vput(null);if(signBox){signBox.remove();signBox=null}drawPanel()};
  ov.querySelector('[data-a="done"]').onclick=closePanel;
  ov.querySelector('[data-a="test"]').onclick=()=>{const was=S.deaf;S.deaf=true;show(KINDS.ok);setTimeout(()=>show(KINDS.bad),1300);setTimeout(()=>{show(KINDS.win);S.deaf=was},2600)};
  ov.querySelector('[data-a="reset"]').onclick=()=>{S=Object.assign({},DEF);save();apply();drawPanel()};
}
function alertBox(m){const n=document.createElement("div");n.className="dza-note";n.textContent=m;ov.querySelector(".dza-box").appendChild(n)}
let lastFocus=null;
async function openPanel(){lastFocus=document.activeElement;await drawPanel();ov.hidden=false;ov.querySelector(".dza-x").focus()}
function closePanel(){ov.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

function lift(){const s=document.querySelector(".strip");const h=s&&!s.hidden&&getComputedStyle(s).position==="fixed"?s.offsetHeight:0;
  fab.style.bottom=`calc(${h+12}px + ${h?"0px":"env(safe-area-inset-bottom,0px)"})`;root.style.setProperty("--dzaLift",h+"px")}
function init(){build();hookTone();hookFX();hookCelebrate();lift();addEventListener("resize",lift);try{const s=document.querySelector(".strip");s&&new ResizeObserver(lift).observe(s)}catch(e){}
  vget().then(b=>{if(b&&S.deaf)openSign()});
}
apply();
if(document.body)init();else addEventListener("DOMContentLoaded",init);
addEventListener("storage",e=>{if(e.key===KEY){try{S=Object.assign({},DEF,JSON.parse(e.newValue||"{}"))}catch(_){}apply()}});
window.DZA={sig,show,open:openPanel,get state(){return Object.assign({},S)}};
})();

</script><!--/dza-->
