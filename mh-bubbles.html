<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>فقاعات التوافق</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a bright arcade. Pastel candy sky with drifting background bubbles, five quick levels (pop, baskets, scramble, memory, summary) with hearts and combo, and a smiling bubble mascot who talks in a speech bubble. */
:root {
  --bg1: #FFD3E6;
  --bg2: #FFEBB8;
  --bg3: #C8F1FF;
  --card: #FFFFFF;
  --ink: #1B1744;
  --ink-soft: #5A5683;
  --line: #E3E0F3;
  --brand: #7B4DFF;
  --brand-d: #4F28CC;
  --good: #0E9F6E;
  --bad: #E0384B;
  --c1: #2D9CFF;
  --c2: #FF4F8B;
  --c3: #FF9F1C;
  --c4: #12C2B0;
  --c5: #8B5CF6;
  --sun: #FFD23F;
  --f-display: "Lalezar", "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --f-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg2) linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%) fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 12px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
#app { max-width: 640px; margin-inline: auto; position: relative; z-index: 1; }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
.ic { flex: none; }

/* drifting background bubbles */
.bgb { position: fixed; bottom: -120px; border-radius: 50%; border: 3px solid rgba(255,255,255,.8); background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.9) 0 14%, rgba(255,255,255,.25) 40%, rgba(255,255,255,.1) 100%); z-index: 0; pointer-events: none; animation: drift linear infinite; }
@keyframes drift { from { transform: translateY(0) translateX(0); } 50% { transform: translateY(-60vh) translateX(18px); } to { transform: translateY(-125vh) translateX(-12px); } }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 12px; }
.logo { font-family: var(--f-display); font-size: 1.5rem; background: none; border: 0; cursor: pointer; color: var(--brand-d); padding: 0; }
.back { display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--brand-d); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 999px; min-height: 46px; padding: 2px 16px; font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: transform .08s; }
.back:active { transform: translateY(3px); border-bottom-width: 2px; }
.pills { display: flex; gap: 8px; align-items: center; margin-inline-start: auto; }
.pill { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 2px 14px; font-weight: 800; font-variant-numeric: tabular-nums; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
.pill b { color: var(--brand); }
.mute { cursor: pointer; font-weight: 700; font-size: .9rem; }
.mute[aria-pressed="true"] { color: var(--ink-soft); text-decoration: line-through; }

/* level HUD */
.hud { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 10px 14px 8px; margin-bottom: 12px; }
.hudrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dots { display: flex; gap: 8px; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 4px solid var(--line); }
.dot.on { background: var(--c); border-color: var(--c); }
.dot.now { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); animation: pingStep 1.6s ease-in-out infinite; }
.hearts { display: flex; gap: 4px; min-height: 28px; }
.heart { width: 28px; height: 28px; fill: #FF3B6B; }
.heart.lost { fill: #D8D6E6; animation: crack .5s ease; }
.steplab { margin-top: 4px; text-align: center; font-weight: 800; font-size: .95rem; color: var(--ink-soft); }
.combo { display: inline-block; background: var(--sun); color: var(--ink); border-radius: 999px; padding: 0 10px; margin-inline-start: 6px; animation: pop .25s ease both; }

/* mascot guide */
.guide { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
.guide .mas { flex: none; animation: bob 3s ease-in-out infinite; }
.bubble { position: relative; flex: 1; min-width: 0; background: #FFF6CC; border: 2px solid var(--sun); border-radius: 18px; padding: 8px 14px; font-weight: 700; font-size: 1.02rem; line-height: 1.55; margin-bottom: 12px; }
.bubble::after { content: ""; position: absolute; right: -9px; bottom: 14px; width: 14px; height: 14px; background: #FFF6CC; border-right: 2px solid var(--sun); border-top: 2px solid var(--sun); transform: rotate(45deg); }
.bubble.ok { background: #DDF7EC; border-color: var(--good); color: #075E41; }
.bubble.ok::after { background: #DDF7EC; border-color: var(--good); }
.bubble.no { background: #FFE6E9; border-color: var(--bad); color: #8E1526; }
.bubble.no::after { background: #FFE6E9; border-color: var(--bad); }

/* home */
.hero { text-align: center; padding-top: 4px; }
.hero .mas { animation: bob 3s ease-in-out infinite; }
.tag { display: inline-block; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 0 14px; font-weight: 800; font-size: .9rem; color: var(--ink-soft); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.8rem, 12vw, 4rem); line-height: 1.1; margin: 4px 0; text-wrap: balance; color: var(--brand-d); text-shadow: 0 3px 0 #fff; }
.lead { color: var(--ink-soft); font-size: 1.08rem; margin: 0 auto 14px; max-width: 30ch; text-wrap: balance; font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 18px 0 6px; padding: 0; list-style: none; text-align: right; }
.tile { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 2px solid var(--line); border-bottom: 6px solid var(--c); border-radius: 20px; padding: 10px 12px; cursor: pointer; text-align: right; transition: transform .08s; }
.tile:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 3px; }
.tile .ico { width: 46px; height: 46px; border-radius: 50%; background: color-mix(in srgb, var(--c) 18%, white); color: var(--c); display: grid; place-items: center; flex: none; }
.tile strong { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.12rem; line-height: 1.25; }
.tile small { display: block; font-weight: 700; color: var(--ink-soft); font-size: .84rem; }
.tile .mini { display: flex; gap: 2px; direction: ltr; justify-content: flex-end; }
.tile .mini svg { width: 15px; height: 15px; }
.tile .mini .on path { fill: var(--c3); stroke: #C27F00; stroke-width: 1.5; }
.tile .mini .off path { fill: var(--line); }
.tile:disabled { cursor: default; opacity: .6; }
.tile:last-child { grid-column: 1 / -1; }
.listwrap { text-align: right; }

.btn { font-family: var(--f-display); font-size: 1.4rem; background: var(--brand); color: #fff; border: 0; border-bottom: 6px solid var(--brand-d); border-radius: 18px; padding: 10px 30px; cursor: pointer; min-height: 56px; transition: transform .08s; }
.btn:active { transform: translateY(4px); border-bottom-width: 2px; }
.btn.alt { background: var(--card); color: var(--brand-d); border: 2px solid var(--line); border-bottom: 6px solid var(--line); font-size: 1.1rem; }
.btn.small { font-size: 1rem; padding: 4px 18px; min-height: 44px; border-bottom-width: 4px; }
.btn.xl { font-size: 1.7rem; padding: 12px 44px; min-height: 64px; animation: pulse 1.8s ease-in-out infinite; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* game card */
.card { background: var(--card); border: 2px solid var(--line); border-radius: 26px; padding: 16px 14px 18px; animation: pop .35s cubic-bezier(.2,1.4,.4,1) both; }
.badge { display: inline-block; font-weight: 800; font-size: .95rem; padding: 2px 14px; border-radius: 999px; color: var(--ink); background: color-mix(in srgb, var(--c) 22%, white); border: 2px solid var(--c); }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 8px 0 10px; line-height: 1.3; text-wrap: balance; }

/* level 1: arena */
.arena { position: relative; height: 440px; border-radius: 22px; overflow: hidden; border: 3px solid #9ADBF7; background: linear-gradient(180deg, #E9F9FF 0%, #BFEAFF 100%); touch-action: manipulation; }
.arena.shake { animation: shake .4s both; }
.left { position: absolute; top: 8px; inset-inline-start: 8px; z-index: 3; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 0 12px; font-weight: 800; font-size: .92rem; }
.bub { position: absolute; left: 0; top: 0; border-radius: 50%; border: 4px solid var(--c); background: radial-gradient(circle at 30% 26%, #fff 0 12%, color-mix(in srgb, var(--c) 18%, white) 45%, color-mix(in srgb, var(--c) 42%, white) 100%); color: var(--ink); font-weight: 800; font-size: .88rem; line-height: 1.2; padding: 6px; cursor: pointer; display: grid; place-items: center; text-align: center; will-change: transform; }
.bub.static { position: relative; }
.bub > span { pointer-events: none; }
.bub.pop { animation: burst .28s ease-out forwards; pointer-events: none; }
.floatx { position: fixed; z-index: 60; font-family: var(--f-display); font-size: 1.5rem; pointer-events: none; animation: floatUp .9s ease-out forwards; text-shadow: 0 2px 0 #fff, 0 0 6px #fff; }

/* level 2: baskets */
.stack { position: relative; min-height: 130px; margin-bottom: 12px; }
.sit { background: #FFF9E0; border: 3px solid var(--sun); border-radius: 20px; padding: 16px 14px; font-size: 1.25rem; font-weight: 800; line-height: 1.55; text-align: center; text-wrap: balance; animation: pop .3s ease both; }
.sit.fly { animation: fly .5s ease-in forwards; }
.baskets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: color-mix(in srgb, var(--c) 14%, white); border: 3px solid var(--c); border-bottom-width: 8px; border-radius: 6px 6px 22px 22px; padding: 10px 4px 8px; font-weight: 800; font-size: 1rem; line-height: 1.25; cursor: pointer; min-height: 96px; transition: transform .08s; }
.bk .ic { color: var(--c); }
.bk:active { transform: translateY(3px); }
.bk.bounce { animation: bounce .4s ease; }
.bk.bad { animation: shake .45s both; background: #FFE3E6; border-color: var(--bad); }
.bk em { position: absolute; top: -12px; inset-inline-end: -4px; min-width: 26px; height: 26px; border-radius: 999px; background: var(--c); color: #fff; font-style: normal; font-weight: 800; font-size: .9rem; display: grid; place-items: center; padding: 0 6px; }

/* level 3: scramble */
.answer { min-height: 76px; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-radius: 18px; background: color-mix(in srgb, var(--c) 10%, white); border: 2px dashed var(--c); margin-bottom: 14px; align-content: flex-start; }
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 14px; min-height: 60px; }
.slot { width: 52px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--c) 18%, white); }
.chip { font-weight: 800; font-size: 1.1rem; padding: 6px 16px; min-height: 46px; background: #fff; border: 2px solid var(--line); border-bottom: 5px solid var(--c); border-radius: 14px; cursor: pointer; transition: transform .08s; animation: pop .25s ease both; }
.chip:active { transform: translateY(3px); border-bottom-width: 2px; }
.chip.bad { background: #FFE3E6; border-color: var(--bad); border-bottom-color: var(--bad); animation: shake .5s both; }
.chip.win { background: color-mix(in srgb, var(--c) 18%, white); border-color: var(--c); }
.chip:disabled { cursor: default; }

/* level 4: memory */
.mem { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
.mc { position: relative; height: 96px; perspective: 600px; background: none; border: 0; padding: 0; cursor: pointer; }
.mc .in { position: absolute; inset: 0; transition: transform .45s; transform-style: preserve-3d; }
.mc.up .in, .mc.ok .in { transform: rotateY(180deg); }
.mc .f, .mc .b { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 8px; text-align: center; }
.mc .b { background: radial-gradient(circle at 30% 26%, #fff 0 10%, #D9C9FF 45%, #A585FF 100%); border: 3px solid var(--brand); color: #fff; font-family: var(--f-display); font-size: 2rem; }
.mc .f { transform: rotateY(180deg); background: color-mix(in srgb, var(--c) 16%, white); border: 3px solid var(--c); font-weight: 800; font-size: .96rem; line-height: 1.3; }
.mc .f .ic { color: var(--c); }
.mc.ok .f { background: color-mix(in srgb, var(--c) 34%, white); }
.mc.ok { animation: bounce .45s ease; }

/* level 5: summary builder */
.stm { display: grid; gap: 8px; margin-bottom: 14px; }
.sb { display: flex; align-items: center; gap: 10px; text-align: right; background: #fff; border: 2px solid var(--line); border-bottom: 5px solid var(--c); border-radius: 16px; padding: 10px 14px; font-weight: 700; font-size: 1.02rem; line-height: 1.5; cursor: pointer; transition: transform .08s; }
.sb:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
.sb.bad { background: #FFE6E9; border-color: var(--bad); border-bottom-color: var(--bad); animation: shake .45s both; opacity: .6; }
.sb.got { background: #DDF7EC; border-color: var(--good); border-bottom-color: var(--good); animation: pop .3s ease both; }
.sb:disabled { cursor: default; }
.sb .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--good); color: #fff; font-family: var(--f-display); display: grid; place-items: center; }
.board { background: color-mix(in srgb, var(--c) 10%, white); border: 2px dashed var(--c); border-radius: 18px; padding: 10px 14px; }
.board h3 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; }
.board ol { margin: 0; padding-inline-start: 22px; }
.board li { line-height: 1.5; margin-bottom: 2px; }
.board .empty { color: var(--ink-soft); font-weight: 700; }

/* results */
.result { text-align: center; }
.stars { display: flex; justify-content: center; gap: 8px; margin: 4px 0; direction: ltr; }
.stars svg { width: 58px; height: 58px; }
.stars .off path { fill: var(--line); }
.stars .on path { fill: var(--c3); stroke: #C27F00; stroke-width: 1.5; }
.stars .on { animation: star .6s cubic-bezier(.2,1.6,.4,1) both; }
.stars .on:nth-child(2) { animation-delay: .25s; }
.stars .on:nth-child(3) { animation-delay: .5s; }
.big { font-family: var(--f-display); font-size: 3.2rem; line-height: 1.1; color: var(--brand); font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0 16px; }
.stat { background: #EEF2FA; border-radius: 14px; padding: 6px 14px; font-weight: 700; }
.sumh { text-align: right; margin-bottom: 8px; }
.final-sum { text-align: right; margin: 0 0 14px; }
.five { list-style: none; margin: 0 0 16px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; text-align: right; }
.five li { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--c) 12%, white); border-radius: 16px; border-right: 8px solid var(--c); padding: 8px 12px; }
.five .ic { color: var(--c); }
.five strong { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.12rem; line-height: 1.3; }
.five span { font-size: .95rem; line-height: 1.45; display: block; }
.lv { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.lv span { display: inline-flex; align-items: center; gap: 4px; background: #EEF2FA; border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: .88rem; }
.lv .stars-m { direction: ltr; display: inline-flex; }
.lv svg { width: 14px; height: 14px; }
.lv .on path { fill: var(--c3); }
.lv .off path { fill: var(--line); }

.rights { margin-top: 26px; padding-top: 14px; border-top: 2px dashed rgba(123,77,255,.35); text-align: center; color: var(--ink-soft); font-weight: 700; font-size: .95rem; line-height: 1.6; text-wrap: balance; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes star { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes pingStep { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@keyframes burst { to { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; } }
@keyframes floatUp { from { transform: translateY(0) scale(.7); opacity: 1; } to { transform: translateY(-60px) scale(1.2); opacity: 0; } }
@keyframes fly { to { transform: translate(var(--dx), 150px) scale(.2); opacity: 0; } }
@keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-8px) scale(1.06); } }
@keyframes crack { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 520px) { .mem { grid-template-columns: repeat(5, minmax(0, 1fr)); } .five { grid-template-columns: repeat(2, minmax(0, 1fr)); } .five li:last-child { grid-column: 1 / -1; } }
</style>

    setTimeout(function () { b.el.remove(); }, 300);
    if (it[1]) {
      ST.popped++; COMBO++; sfx.pop(COMBO); burst(c.x, c.y, color, 22, 8);
      floatText(COMBO > 2 ? 'كومبو ×' + COMBO : PRAISE[ST.popped % PRAISE.length], c.x, c.y - 20, color);
      var left = ST.need - ST.popped; $('#left').textContent = left ? 'المتبقي ' + left : 'أحسنت!'; hud();
      setGuide(it[0] + ': أسلوب مباشر يواجه المشكلة.', 'ok');
      if (!left) {
        var wr = ST.wrong;
        setTimeout(function () { finishLevel(pts100(wr, 20), '<span class="stat">أخطاء ' + wr + '</span>'); }, 450);
      }
    } else {
      ST.wrong++; burst(c.x, c.y, '#E0384B', 14, 6);
      var ar = $('#arena'); ar.classList.remove('shake'); void ar.offsetWidth; ar.classList.add('shake');
      if (wrongFeedback(it[0] + ' حيلة دفاعية، وليست أسلوباً مباشراً.')) return fail();
    }
  }

  /* ---------- level 2: baskets ---------- */
  function startBaskets() {
    ST = { items: shuffle(CARDS), i: 0, wrong: 0, lock: false, counts: { just: 0, proj: 0, dream: 0 } };
    drawBaskets('اقرأ الموقف ثم اضغط السلة المناسبة. التبرير: أعذار، الإسقاط: لوم الآخرين، أحلام اليقظة: خيال.', '');
  }
  function drawBaskets(msg, mood) {
    var it = ST.items[ST.i];
    hud('الموقف ' + (ST.i + 1) + ' من ' + ST.items.length);
    var bks = BKT.map(function (b) {
      return '<button class="bk" id="bk-' + b.k + '" style="--c:var(--c2)" data-k="' + b.k + '" type="button">' + ic(b.icon, 30) + '<span>' + b.label + '</span><em>' + ST.counts[b.k] + '</em></button>';
    }).join('');
    stage.innerHTML = guide(msg, mood) +
      '<section class="card" style="--c:var(--c2)"><span class="badge">الموقف ' + (ST.i + 1) + ' من ' + ST.items.length + '</span><h2>أي حيلة دفاعية هذه؟</h2>' +
      '<div class="stack"><div class="sit" id="sit">' + it.t + '</div></div><div class="baskets">' + bks + '</div></section>';
  }
  function basketPick(k) {
    if (ST.lock) return;
    var it = ST.items[ST.i], btn = $('#bk-' + k);
    if (k === it.a) {
      ST.lock = true; COMBO++; ST.counts[k]++; sfx.pop(COMBO);
      var c = centerOf(btn); burst(c.x, c.y, COL[1], 24, 8); floatText(COMBO > 2 ? 'كومبو ×' + COMBO : PRAISE[ST.i % PRAISE.length], c.x, c.y - 30, COL[1]);
      var idx = BKT.map(function (b) { return b.k; }).indexOf(k), sit = $('#sit');
      sit.style.setProperty('--dx', ((1 - idx) * 33) + '%'); sit.classList.add('fly');
      btn.classList.add('bounce'); btn.querySelector('em').textContent = ST.counts[k]; hud('الموقف ' + (ST.i + 1) + ' من ' + ST.items.length);
      setGuide(it.why, 'ok');
      var tok = TOK;
      setTimeout(function () {
        if (tok !== TOK) return;
        ST.i++; ST.lock = false;
        if (ST.i >= ST.items.length) return finishLevel(pts100(ST.wrong, 15), '<span class="stat">أخطاء ' + ST.wrong + '</span>');
        drawBaskets(it.why, 'ok');
      }, 650);
    } else {
      ST.wrong++; btn.classList.add('bad'); setTimeout(function () { btn.classList.remove('bad'); }, 500);
      if (wrongFeedback('ليست هذه السلة. فكّر: هل هو عذر، أم لوم للآخرين، أم خيال؟')) return fail();
    }
  }

  /* ---------- level 3: scramble ---------- */
  function startScramble() { ST = { n: 0, slips: 0, hints: 0 }; hud('الجملة 1 من ' + SENTS.length); sentence(0); }
  function sentence(i) {
    var L = SENTS[i], ids = L.words.map(function (_, k) { return k; }), pool;
    do { pool = shuffle(ids); } while (pool.map(function (k) { return L.words[k]; }).join(' ') === L.text);
    ST.n = i; ST.pool = pool; ST.placed = []; ST.bad = null; ST.done = false; ST.lock = false;
    hud('الجملة ' + (i + 1) + ' من ' + SENTS.length); drawScramble();
  }
  function drawScramble() {
    var L = SENTS[ST.n], g, tail;
    var placed = ST.placed.map(function (id, k) {
      var cls = ST.bad && ST.bad[k] ? ' bad' : ST.done ? ' win' : '';
      return '<button class="chip' + cls + '" data-un="' + k + '" type="button"' + (ST.done ? ' disabled' : '') + '>' + L.words[id] + '</button>';
    }).join('');
    var empties = ''; for (var e = ST.placed.length; e < L.words.length; e++) empties += '<span class="slot"></span>';
    var pool = ST.pool.map(function (id) { return '<button class="chip" data-add="' + id + '" type="button">' + L.words[id] + '</button>'; }).join('');
    if (ST.done) {
      g = guide('أحسنت! الجملة صحيحة.', 'ok');
      tail = '<div class="row"><button class="btn" data-act="snext" type="button">' + (ST.n < SENTS.length - 1 ? 'الجملة التالية' : 'النتيجة') + '</button></div>';
    } else {
      g = guide(ST.bad ? 'قريب! تبقى الكلمات الصحيحة، وأعد الباقي.' : 'اضغط الكلمات بالترتيب حتى تكتمل الجملة.', ST.bad ? 'no' : '');
      tail = '<div class="row"><button class="btn alt small" data-act="hint" type="button">تلميح</button><button class="btn alt small" data-act="reset" type="button">إعادة</button></div>';
    }
    stage.innerHTML = g + '<section class="card" style="--c:var(--c3)"><span class="badge">الجملة ' + (ST.n + 1) + ' من ' + SENTS.length + '</span><h2>رتّب الكلمات لتكوّن الجملة</h2>' +
      '<div class="answer" aria-label="إجابتك">' + placed + empties + '</div>' + (ST.done ? '' : '<div class="pool">' + pool + '</div>') + tail + '</section>';
  }
  function checkScramble() {
    var L = SENTS[ST.n], first = -1;
    for (var k = 0; k < L.words.length; k++) { if (L.words[ST.placed[k]] !== L.words[k]) { first = k; break; } }
    if (first === -1) { ST.done = true; sfx.ok(); drawScramble(); rain(50, .35); }
    else {
      ST.slips++; ST.lock = true; ST.bad = {};
      for (var j = first; j < ST.placed.length; j++) ST.bad[j] = true;
      sfx.bad(); drawScramble();
      var tok = TOK;
      setTimeout(function () { if (tok !== TOK) return; ST.pool = ST.pool.concat(ST.placed.splice(first)); ST.bad = null; ST.lock = false; drawScramble(); }, 800);
    }
  }
  function scrambleAdd(id) { if (ST.lock || ST.done) return; ST.pool.splice(ST.pool.indexOf(id), 1); ST.placed.push(id); sfx.tap(); if (ST.placed.length === SENTS[ST.n].words.length) checkScramble(); else drawScramble(); }
  function scrambleUndo(k) { if (ST.lock || ST.done) return; ST.pool = ST.pool.concat(ST.placed.splice(k)); sfx.undo(); drawScramble(); }
  function scrambleHint() {
    if (ST.lock || ST.done) return;
    var L = SENTS[ST.n], k;
    for (k = 0; k < ST.placed.length; k++) { if (L.words[ST.placed[k]] !== L.words[k]) break; }
    if (k < ST.placed.length) ST.pool = ST.pool.concat(ST.placed.splice(k));
    var want = L.words[ST.placed.length], pick = -1;
    for (var p = 0; p < ST.pool.length; p++) { if (L.words[ST.pool[p]] === want) { pick = ST.pool[p]; break; } }
    if (pick < 0) return;
    ST.hints++; ST.pool.splice(ST.pool.indexOf(pick), 1); ST.placed.push(pick); sfx.hint();
    if (ST.placed.length === L.words.length) checkScramble(); else drawScramble();
  }

  /* ---------- level 4: memory ---------- */
  function startMemory() {
    var cards = [];
    PAIRS.forEach(function (p, i) {
      cards.push({ pair: i, name: true, text: p[0], icon: p[2], c: p[3] });
      cards.push({ pair: i, name: false, text: p[1], icon: null, c: p[3] });
    });
    ST = { cards: shuffle(cards), up: [], found: 0, moves: 0, lock: false, matched: {} };
    drawMemory('اقلب بطاقتين: اسم الطريقة ووصفها. ابحث عن كل زوج!', '');
  }
  function drawMemory(msg, mood) {
    hud('الأزواج ' + ST.found + ' من ' + PAIRS.length + ' · الحركات ' + ST.moves);
    var cs = ST.cards.map(function (c, i) {
      var cls = ST.matched[i] ? 'ok' : ST.up.indexOf(i) > -1 ? 'up' : '';
      return '<button class="mc ' + cls + '" id="mc' + i + '" style="--c:' + c.c + '" data-m="' + i + '" type="button" aria-label="بطاقة ' + (i + 1) + '"><span class="in"><span class="b">؟</span><span class="f">' + (c.icon ? ic(c.icon, 28) : '') + '<span>' + c.text + '</span></span></span></button>';
    }).join('');
    stage.innerHTML = guide(msg, mood) + '<section class="card" style="--c:var(--c4)"><span class="badge">اقلب وطابق</span><h2>طابق الطريقة مع وصفها</h2><div class="mem" id="mem">' + cs + '</div></section>';
  }
  function memFlip(i) {
    if (ST.lock || ST.matched[i] || ST.up.indexOf(i) > -1) return;
    ST.up.push(i); sfx.flip(); $('#mc' + i).classList.add('up');
    if (ST.up.length < 2) return;
    ST.moves++; ST.lock = true;
    var a = ST.up[0], b = ST.up[1], tok = TOK;
    if (ST.cards[a].pair === ST.cards[b].pair) {
      ST.matched[a] = ST.matched[b] = true; ST.found++; COMBO++;
      setTimeout(function () {
        if (tok !== TOK) return;
        sfx.match(); var c = centerOf($('#mc' + b)); burst(c.x, c.y, null, 26, 8); floatText(PRAISE[ST.found % PRAISE.length], c.x, c.y - 20, '#12C2B0');
        $('#mc' + a).classList.add('ok'); $('#mc' + b).classList.add('ok');
        ST.up = []; ST.lock = false; hud('الأزواج ' + ST.found + ' من ' + PAIRS.length + ' · الحركات ' + ST.moves);
        setGuide(PAIRS[ST.cards[a].pair][0] + ': ' + PAIRS[ST.cards[a].pair][1] + '.', 'ok');
        if (ST.found === PAIRS.length) { var m = ST.moves; setTimeout(function () { if (tok === TOK) finishLevel(pts100(Math.max(0, m - 7), 8), '<span class="stat">الحركات ' + m + '</span>'); }, 700); }
      }, 450);
    } else {
      COMBO = 0; setTimeout(function () {
        if (tok !== TOK) return;
        sfx.bad(); var ea = $('#mc' + a), eb = $('#mc' + b); ea.classList.remove('up'); eb.classList.remove('up');
        ST.up = []; ST.lock = false; hud('الأزواج ' + ST.found + ' من ' + PAIRS.length + ' · الحركات ' + ST.moves);
      }, 950);
    }
  }

  /* ---------- level 5: build the summary ---------- */
  function startBuild() { ST = { items: shuffle(STMS), got: [], wrong: 0, bad: {} }; drawBuild('اختر الجمل الخمس الصحيحة لتبني ملخص الدرس. انتبه، بينها جمل خاطئة!', ''); }
  function drawBuild(msg, mood) {
    hud('اخترت ' + ST.got.length + ' من 5');
    var list = ST.items.map(function (s, i) {
      var gi = ST.got.indexOf(i), cls = gi > -1 ? ' got' : ST.bad[i] ? ' bad' : '';
      return '<button class="sb' + cls + '" style="--c:var(--c5)" data-s="' + i + '" type="button"' + (gi > -1 || ST.bad[i] ? ' disabled' : '') + '>' + (gi > -1 ? '<span class="num">' + (gi + 1) + '</span>' : '') + '<span>' + s[0] + '</span></button>';
    }).join('');
    var bd = ST.got.length ? '<ol>' + ST.got.map(function (i) { return '<li>' + ST.items[i][0] + '</li>'; }).join('') + '</ol>' : '<p class="empty" style="margin:0">ستظهر هنا الجمل التي تختارها.</p>';
    stage.innerHTML = guide(msg, mood) + '<section class="card" style="--c:var(--c5)"><span class="badge">ابنِ ملخصك</span><h2>أي الجمل تلخص الدرس؟</h2><div class="stm">' + list + '</div><div class="board" style="--c:var(--c5)"><h3>ملخصي</h3>' + bd + '</div></section>';
  }
  function buildPick(i) {
    var s = ST.items[i], el = document.querySelector('[data-s="' + i + '"]'), c = centerOf(el);
    if (s[1]) {
      ST.got.push(i); COMBO++; sfx.pop(COMBO); burst(c.x, c.y, COL[4], 24, 8); floatText(PRAISE[ST.got.length % PRAISE.length], c.x, c.y - 20, COL[4]);
      if (ST.got.length === 5) {
        var w = ST.wrong; P.sum = ST.got.map(function (k) { return ST.items[k][0]; });
        drawBuild('رائع! بنيت ملخصاً كاملاً للدرس.', 'ok');
        var tok = TOK; return setTimeout(function () { if (tok === TOK) finishLevel(pts100(w, 20), '<span class="stat">أخطاء ' + w + '</span>'); }, 900);
      }
      drawBuild('جملة صحيحة! تبقّى ' + (5 - ST.got.length) + '.', 'ok');
    } else {
      ST.wrong++; ST.bad[i] = true; burst(c.x, c.y, '#E0384B', 14, 6);
      if (wrongFeedback('هذه الجملة خاطئة. الدرس يقول عكس ذلك.')) return fail();
      drawBuild('هذه الجملة خاطئة. الدرس يقول عكس ذلك.', 'no');
    }
  }

  /* ---------- final ---------- */
  var FIVE = PAIRS;
  function final() {
    stopLoop(); LV = -1; progEl.hidden = true; setBack(true);
    var t = total(), n = t >= 425 ? 3 : t >= 300 ? 2 : 1;
    var lv = LEVELS.map(function (L, i) { return '<span style="--c:' + CV[i] + '">' + L.short + ' ' + miniStars(P.pts[i]) + '</span>'; }).join('');
    var sum = P.sum.length ? '<h2 class="sumh">ملخصك</h2><ol class="final-sum">' + P.sum.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>' : '';
    var five = FIVE.map(function (f) { return '<li style="--c:' + f[3] + '">' + ic(f[2], 32) + '<div><strong>' + f[0] + '</strong><span>' + f[1] + '</span></div></li>'; }).join('');
    stage.innerHTML = guide('أنت بطل التوافق! هذا ملخص الدرس كاملاً.', 'ok') +
      '<section class="card result" style="--c:var(--brand)">' + starsHTML(n) + '<div class="big">' + t + '</div><p style="margin:0 0 10px;color:var(--ink-soft);font-weight:700">نقطة من 500</p>' +
      '<div class="lv">' + lv + '</div>' + sum + '<h2 class="sumh">خمس طرق لمواجهة التوتر</h2><ul class="five">' + five + '</ul>' +
      '<div class="row"><button class="btn" data-act="home" type="button">المستويات</button><button class="btn alt" data-act="restart" type="button">العب من جديد</button></div></section>';
    sfx.win(); rain(150, .3); setTimeout(function () { rain(80, .35); }, 500);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-add],[data-un],[data-k],[data-b],[data-m],[data-s]');
    if (!t || t.disabled) return;
    ac();
    if (t.hasAttribute('data-b')) return popBubble(+t.getAttribute('data-b'));
    if (t.hasAttribute('data-k')) return basketPick(t.getAttribute('data-k'));
    if (t.hasAttribute('data-m')) return memFlip(+t.getAttribute('data-m'));
    if (t.hasAttribute('data-s')) return buildPick(+t.getAttribute('data-s'));
    if (t.hasAttribute('data-add')) return scrambleAdd(+t.getAttribute('data-add'));
    if (t.hasAttribute('data-un')) return scrambleUndo(+t.getAttribute('data-un'));
    var a = t.getAttribute('data-act');
    if (a === 'mute') { muted = !muted; t.setAttribute('aria-pressed', muted); t.textContent = muted ? 'الصوت متوقف' : 'الصوت'; if (!muted) sfx.tap(); return; }
    if (a === 'home') { sfx.tap(); return home(); }
    if (a === 'restart') { sfx.tap(); resetAll(); return home(); }
    if (a === 'play') { sfx.ok(); var nx = P.done.indexOf(false); return startLevel(nx === -1 ? 0 : nx); }
    if (a === 'level') { sfx.tap(); return startLevel(+t.getAttribute('data-i')); }
    if (a === 'final') { return final(); }
    if (a === 'hint') return scrambleHint();
    if (a === 'reset') { if (ST.lock || ST.done) return; ST.pool = ST.pool.concat(ST.placed); ST.placed = []; sfx.undo(); return drawScramble(); }
    if (a === 'snext') {
      sfx.tap();
      if (ST.n < SENTS.length - 1) return sentence(ST.n + 1);
      return finishLevel(pts100(ST.slips * 8 + ST.hints * 10, 1), '<span class="stat">محاولات خاطئة ' + ST.slips + '</span><span class="stat">تلميحات ' + ST.hints + '</span>');
    }
  });

  resetAll();
  home();
})();
</script>

.dza-t{display:flex;gap:12px;align-items:center;text-align:right;border:2px solid #e2e7f3;background:#f8faff;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;width:100%}
.dza-t:focus-visible{outline:4px solid #ffd400;outline-offset:2px}
.dza-t .dza-ic{font-size:28px;flex:none;width:40px;text-align:center}
.dza-t b{display:block;font-size:16px}.dza-t small{display:block;color:#56607a;font-size:12.5px;line-height:1.6;margin-top:2px}
.dza-t .dza-sw{margin-inline-start:auto;flex:none;width:46px;height:26px;border-radius:13px;background:#c9d1e3;position:relative;transition:background .2s}
.dza-t .dza-sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:right .2s}
.dza-t[aria-pressed=true]{border-color:#2f6fe0;background:#eaf1ff}
.dza-t[aria-pressed=true] .dza-sw{background:#2f6fe0}.dza-t[aria-pressed=true] .dza-sw::after{right:23px}
.dza-seg{display:flex;gap:6px;background:#eef2fb;border-radius:14px;padding:5px}

.dza-seg button[aria-pressed=true]{background:#2f6fe0;color:#fff}
.dza-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.dza-b{border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:#2f6fe0;color:#fff}
.dza-b.dza-g{background:#eef2fb;color:#16203a}
.dza-note{font-size:12.5px;color:#56607a;background:#fff8e6;border-radius:12px;padding:10px 12px;line-height:1.7;margin-top:10px}
.dza-cap{position:fixed;left:50%;bottom:calc(84px + var(--dzaLift,0px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147482999;display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:#111827f2;color:#fff;font:700 clamp(18px,2.6vw,30px) "Readex Pro",Tahoma,sans-serif;direction:rtl;border:4px solid var(--dzc,#fff);box-shadow:0 10px 30px #0006;pointer-events:none;max-width:calc(100vw - 32px);white-space:nowrap}
.dza-cap i{font-style:normal;font-size:1.3em}
.dza-cap.dza-in{animation:dzaCap .25s ease-out}
@keyframes dzaCap{from{transform:translate(-50%,20px);opacity:0}}
.dza-edge{position:fixed;inset:0;z-index:2147482998;pointer-events:none;box-shadow:inset 0 0 0 10px var(--dzc,#fff);opacity:0;transition:opacity .4s}
.dza-edge.dza-in{opacity:.85;transition:none}
.dza-sign{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(80px + var(--dzaLift,0px) + env(safe-area-inset-bottom,0px));z-index:2147482997;width:min(300px,46vw);background:#111;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #0006;border:3px solid #fff;touch-action:none}

.dza-sign .dza-sbar{display:flex;gap:4px;align-items:center;padding:4px 6px;background:#1f2937;color:#fff;font:600 13px "Readex Pro",Tahoma,sans-serif;cursor:move;direction:rtl}
.dza-sign .dza-sbar span{flex:1}
.dza-sign .dza-sbar button{border:0;background:#374151;color:#fff;border-radius:8px;width:30px;height:28px;cursor:pointer;font-size:14px}
`;
const st=document.createElement("style");st.id="dza-css";st.textContent=css;document.head.appendChild(st);

function apply(){
  root.classList.toggle("dza-z1",S.size===1);root.classList.toggle("dza-z2",S.size===2);
  root.classList.toggle("dza-hc",S.hc);root.classList.toggle("dza-calm",S.calm);
  root.classList.toggle("dza-dys",S.dys);root.classList.toggle("dza-cur",S.cursor);root.classList.toggle("dza-read",S.read);
  if(fab)fab.classList.toggle("dza-on",S.deaf||S.size||S.hc||S.calm||S.read||S.dys||S.cursor);
}

/* ---------- بديل مرئي للأصوات ---------- */
const KINDS={
  bad:{t:"صوت: إجابة غير صحيحة",i:"✖",c:"#ef4444",v:[90,60,90]},
  win:{t:"صوت: احتفال وتصفيق",i:"🎉",c:"#f5b301",v:[220]},
  ok:{t:"صوت: إجابة صحيحة",i:"✔",c:"#22c55e",v:[120]},
  tick:{t:"صوت: تكتكة",i:"⏱",c:"#60a5fa",v:null,small:1},
  gen:{t:"مؤثر صوتي",i:"🔊",c:"#a78bfa",v:null}
};
const PR={gen:0,tick:1,ok:2,win:3,bad:4,label:5};
let pend=null,pendLabel=null,grp={tri:0,saw:0,sq:0,n:0},gt=0,cap,edge,capT=0;
function sig(k,label){
  if(!S.deaf)return;
  if(k==="label"){pendLabel=label}
  if(!pend||PR[k]>PR[pend])pend=k;
  clearTimeout(gt);gt=setTimeout(flush,110);
}
function flush(){
  let k=pend;const L=pendLabel;
  if(k!=="label"&&k!=="bad"){if(grp.saw)k="bad";else if(grp.tri>=6)k="win";else if(grp.tri>=3)k="ok";else if(grp.sq&&grp.n===grp.sq)k="tick"}
  pend=null;pendLabel=null;grp={tri:0,saw:0,sq:0,n:0};
  show(k==="label"?{t:L.t,i:L.i,c:L.c||"#a78bfa",v:null}:KINDS[k]||KINDS.gen);
}
function show(K){
  if(!cap){cap=document.createElement("div");cap.className="dza-cap";cap.setAttribute("role","status");cap.setAttribute("aria-live","polite");
    edge=document.createElement("div");edge.className="dza-edge";document.body.append(edge,cap)}
  cap.style.setProperty("--dzc",K.c);edge.style.setProperty("--dzc",K.c);
  cap.innerHTML=`<i aria-hidden="true">${K.i}</i><span>${K.t}</span>`;
  cap.hidden=false;cap.style.fontSize=K.small?"18px":"";
  cap.classList.remove("dza-in");void cap.offsetWidth;cap.classList.add("dza-in");
  if(!K.small){edge.classList.add("dza-in");setTimeout(()=>edge.classList.remove("dza-in"),220)}
  if(fab){fab.classList.remove("dza-ping");void fab.offsetWidth;fab.classList.add("dza-ping")}
  if(S.vib&&K.v&&navigator.vibrate)try{navigator.vibrate(K.v)}catch(e){}
  clearTimeout(capT);capT=setTimeout(()=>{cap.hidden=true},K.small?700:1800);
}
/* ربط الأصوات */
function hookTone(){
  if(typeof window.tone!=="function"||window.tone.__dza)return;
  const orig=window.tone;
  const w=function(f,d,v,type,t0){
    type=type||"sine";
    grp.n++;if(type==="triangle")grp.tri++;else if(type==="sawtooth"&&f<420)grp.saw++;else if(type==="square"&&f>=1000&&(d||.1)<=.05)grp.sq++;
    sig("gen");
    if(S.calm&&v!=null)v=v*.35;else if(S.calm)v=.03;
    return orig.call(this,f,d,v,type,t0);
  };w.__dza=1;window.tone=w;
}
function hookFX(){
  let fx;try{fx=WSFX}catch(e){return}
  if(!fx||fx.__dza)return;fx.__dza=1;
  const L={drumroll:["🥁","قرع طبول… ترقّب"],crank:["⚙️","صوت دوران الآلة"],balls:["🔵","صوت خلط الكرات"],roll:["🎲","صوت دحرجة"],wood:["🪵","صوت أعواد خشبية"],pull:["✋","صوت سحب"],pencils:["✏️","صوت أقلام"],rustle:["📄","صوت أوراق"],unfold:["📜","صوت فتح الورقة"],fanfare:["🎺","احتفال! النتيجة ظهرت"],sparkle:["✨","صوت لمعة"],whoosh:["💨","صوت حركة"],boing:["🟢","صوت قفزة"],pop:["🫧","صوت فقاعة"],scribble:["🖍️","صوت كتابة"]};
  Object.keys(fx).forEach(k=>{if(typeof fx[k]!=="function"||!L[k])return;const o=fx[k];fx[k]=function(){sig("label",{i:L[k][0],t:L[k][1]});return o.apply(this,arguments)}});
}
try{const P=(window.AudioScheduledSourceNode||{}).prototype;if(P&&P.start&&!P.start.__dza){const o=P.start;P.start=function(){sig("gen");return o.apply(this,arguments)};P.start.__dza=1}}catch(e){}
/* الاحتفال الكبير */
function hookCelebrate(){
  if(typeof window.celebrate!=="function"||window.celebrate.__dza)return;
  const o=window.celebrate;const w=function(text){sig("label",{i:"🎉",t:"احتفال: "+String(text||"أحسنتم").replace(/<[^>]+>/g,"").slice(0,40),c:"#f5b301"});return o.apply(this,arguments)};w.__dza=1;window.celebrate=w;
}

/* ---------- القراءة الصوتية ---------- */
let arVoice=null;
function voices(){try{const v=speechSynthesis.getVoices();arVoice=v.find(x=>/^ar/i.test(x.lang))||null}catch(e){}}
if("speechSynthesis" in window){voices();try{speechSynthesis.onvoiceschanged=voices}catch(e){}}
function speak(t){if(!("speechSynthesis" in window)||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=arVoice?arVoice.lang:"ar-SA";if(arVoice)u.voice=arVoice;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener("click",e=>{
  if(!S.read||e.target.closest(".dza-ov,.dza-fab,.dza-sign"))return;
  const el=e.target.closest("p,h1,h2,h3,h4,li,label,button,[role=button],td,th,.q,.card")||e.target;
  let t=(el.innerText||el.getAttribute("aria-label")||"").replace(/\s+/g," ").trim();
  if(!t&&el.getAttribute)t=el.getAttribute("aria-label")||"";
  if(t)speak(t.slice(0,400));
},true);

/* ---------- فيديو لغة الإشارة (يحفظ على هذا الجهاز) ---------- */
const PAGE=(location.pathname.split("/").pop()||"index.html");
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("dz-sign",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function vget(){try{const db=await idb();return await new Promise(r=>{const q=db.transaction("v").objectStore("v").get(PAGE);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function vput(b){const db=await idb();return new Promise((r,j)=>{const tx=db.transaction("v","readwrite");b?tx.objectStore("v").put(b,PAGE):tx.objectStore("v").delete(PAGE);tx.oncomplete=()=>r();tx.onerror=()=>j(tx.error)})}
let signBox=null,signURL=null;
async function openSign(){
  const b=await vget();if(!b){openPanel();return}
  if(signBox)signBox.remove();if(signURL)URL.revokeObjectURL(signURL);
  signURL=URL.createObjectURL(b);
  signBox=document.createElement("div");signBox.className="dza-sign";signBox.setAttribute("role","region");signBox.setAttribute("aria-label","فيديو لغة الإشارة");
  signBox.innerHTML=`<div class="dza-sbar"><span>🤟 لغة الإشارة</span><button type="button" data-a="big" aria-label="تكبير أو تصغير">⤢</button><button type="button" data-a="x" aria-label="إغلاق">✕</button></div><video controls playsinline src="${signURL}"></video>`;
  document.body.appendChild(signBox);
  signBox.querySelector('[data-a="x"]').onclick=()=>{signBox.remove();signBox=null};
  signBox.querySelector('[data-a="big"]').onclick=()=>signBox.classList.toggle("dza-big");
  const bar=signBox.querySelector(".dza-sbar");let sx,sy,ox,oy,drag=false;
  bar.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;drag=true;bar.setPointerCapture(e.pointerId);const r=signBox.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top});
  bar.addEventListener("pointermove",e=>{if(!drag)return;signBox.style.left=Math.max(0,Math.min(innerWidth-60,ox+e.clientX-sx))+"px";signBox.style.top=Math.max(0,Math.min(innerHeight-40,oy+e.clientY-sy))+"px";signBox.style.right="auto";signBox.style.bottom="auto"});
  bar.addEventListener("pointerup",()=>drag=false);
  try{signBox.querySelector("video").play().catch(()=>{})}catch(e){}
}

/* ---------- الواجهة ---------- */
const ICON='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="12" cy="4" r="2.2"/><path d="M4 7.5c0-.6.5-1 1.1-.9 2.3.4 4.6.6 6.9.6s4.6-.2 6.9-.6c.6-.1 1.1.3 1.1.9 0 .5-.3.9-.8 1-1.8.4-3.6.6-5.2.7v3.6l2 7.6c.2.6-.2 1.2-.8 1.3-.5.1-1-.2-1.2-.7L12 15.6 9.9 21c-.2.5-.7.8-1.2.7-.6-.1-1-.7-.8-1.3l2-7.6V9.2c-1.6-.1-3.4-.3-5.2-.7-.5-.1-.8-.5-.7-1z"/></svg>';
let fab,ov;
function toggleCard(k,ic,title,desc){return `<button type="button" class="dza-t" data-k="${k}" aria-pressed="${!!S[k]}"><span class="dza-ic" aria-hidden="true">${ic}</span><span><b>${title}</b><small>${desc}</small></span><span class="dza-sw" aria-hidden="true"></span></button>`}
function build(){
  fab=document.createElement("button");fab.type="button";fab.className="dza-fab";fab.setAttribute("aria-label","إمكانية الوصول");fab.title="إمكانية الوصول";fab.innerHTML=ICON;
  fab.onclick=openPanel;
  ov=document.createElement("div");ov.className="dza-ov";ov.hidden=true;ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-labelledby","dza-h");
  ov.addEventListener("click",e=>{if(e.target===ov)closePanel()});
  document.body.append(fab,ov);
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!ov.hidden)closePanel();if(e.altKey&&(e.key==="a"||e.key==="ش")){e.preventDefault();ov.hidden?openPanel():closePanel()}});
  apply();
}
async function drawPanel(){
  const has=!!(await vget());
  ov.innerHTML=`<div class="dza-box">
  <div class="dza-hd"><h2 id="dza-h">♿ إمكانية الوصول</h2><button type="button" class="dza-x" aria-label="إغلاق">✕</button></div>
  <p class="dza-sub">اختر ما يناسب المتعلمين في صفك. الإعدادات تُحفظ على هذا الجهاز وتعمل في كل ألعاب دروازة.</p>
  <div class="dza-sec">السمع</div>
  <div class="dza-grid">
   ${toggleCard("deaf","🧏","وضع الصم وضعاف السمع","كل صوت يظهر كتابةً بأيقونة ولون، مع وميض حول الشاشة")}
   ${toggleCard("vib","📳","اهتزاز مع الأصوات","في الجوال والتابلت: اهتزاز للإجابة الصحيحة والخاطئة")}
  </div>
  <div class="dza-t" style="cursor:default;margin-top:10px;flex-wrap:wrap"><span class="dza-ic" aria-hidden="true">🤟</span><span style="flex:1;min-width:180px"><b>فيديو لغة الإشارة لهذه الصفحة</b><small>${has?"تم رفع فيديو لهذه الصفحة. يظهر في نافذة صغيرة تقدر تحركها.":"المعلم يرفع فيديو شرح بلغة الإشارة لهذه اللعبة (يُحفظ على هذا الجهاز فقط)."}</small></span>
   <span style="display:flex;gap:6px;flex-wrap:wrap">${has?'<button type="button" class="dza-b" data-a="play">▶ عرض</button><button type="button" class="dza-b dza-g" data-a="del">حذف</button>':""}<button type="button" class="dza-b ${has?"dza-g":""}" data-a="up">${has?"تغيير":"⬆ رفع فيديو"}</button></span>
   <input type="file" accept="video/*" hidden data-a="file"></div>
  <div class="dza-sec">البصر</div>
  <div style="font-weight:700;margin:0 2px 6px">🔠 حجم النص والعناصر</div>
  <div class="dza-seg" role="group" aria-label="حجم النص">${["عادي","كبير","كبير جدًا"].map((n,i)=>`<button type="button" data-z="${i}" aria-pressed="${S.size===i}">${n}</button>`).join("")}</div>
  <div class="dza-grid" style="margin-top:10px">
   ${toggleCard("hc","◐","تباين عالٍ","ألوان أوضح وحدود قوية حول الزر المحدد")}
   ${toggleCard("cursor","🖱️","مؤشر كبير","سهم فأرة كبير وواضح على الشاشة الذكية")}
   ${toggleCard("read","🔊","اقرأ لي","اضغط على أي سؤال أو زر ليُقرأ بصوت عالٍ")}
  </div>
  <div class="dza-sec">التركيز والتعلّم</div>
  <div class="dza-grid">
   ${toggleCard("calm","🌙","وضع هادئ","حركة أقل، أصوات أخفض، بدون قصاصات احتفال. مناسب لطيف التوحد وتشتت الانتباه")}
   ${toggleCard("dys","📖","قراءة مريحة","مسافات أوسع بين الأسطر والكلمات لصعوبات القراءة")}
  </div>
  ${S.read&&!arVoice?'<div class="dza-note">💡 جهازك ما فيه صوت عربي للقراءة. من إعدادات الجهاز: اللغة ← تحويل النص إلى كلام ← نزّل الصوت العربي.</div>':""}
  <div class="dza-row"><button type="button" class="dza-b" data-a="done">تم</button><button type="button" class="dza-b dza-g" data-a="reset">إرجاع الإعدادات الأصلية</button><button type="button" class="dza-b dza-g" data-a="test">جرّب الصوت المرئي</button></div>
  <p class="dza-sub" style="margin:12px 0 0;font-size:12px">اختصار لوحة المفاتيح: Alt + A</p>
  </div>`;
  ov.querySelector(".dza-x").onclick=closePanel;
  ov.querySelectorAll(".dza-t[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S[k]=!S[k];save();apply();b.setAttribute("aria-pressed",S[k]);
    if(k==="deaf"&&S.deaf)show({i:"🧏",t:"وضع الصم مفعّل",c:"#2f6fe0"});if(k==="read"){if(S.read)speak("تم تفعيل القراءة الصوتية");drawPanel()}});
  ov.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{S.size=+b.dataset.z;save();apply();ov.querySelectorAll("[data-z]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const fi=ov.querySelector('[data-a="file"]');
  ov.querySelector('[data-a="up"]').onclick=()=>fi.click();

  const d=ov.querySelector('[data-a="del"]');if(d)d.onclick=async()=>{if(!d.dataset.c){d.dataset.c=1;d.textContent="اضغط مرة ثانية للحذف";return}await vput(null);if(signBox){signBox.remove();signBox=null}drawPanel()};

function alertBox(m){const n=document.createElement("div");n.className="dza-note";n.textContent=m;ov.querySelector(".dza-box").appendChild(n)}
let lastFocus=null;
async function openPanel(){lastFocus=document.activeElement;await drawPanel();ov.hidden=false;ov.querySelector(".dza-x").focus()}
function closePanel(){ov.hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

function lift(){const s=document.querySelector(".strip");const h=s&&!s.hidden&&getComputedStyle(s).position==="fixed"?s.offsetHeight:0;
  fab.style.bottom=`calc(${h+12}px + ${h?"0px":"env(safe-area-inset-bottom,0px)"})`;root.style.setProperty("--dzaLift",h+"px")}
function init(){build();hookTone();hookFX();hookCelebrate();lift();addEventListener("resize",lift);try{const s=document.querySelector(".strip");s&&new ResizeObserver(lift).observe(s)}catch(e){}
  vget().then(b=>{if(b&&S.deaf)openSign()});
}
apply();
if(document.body)init();else addEventListener("DOMContentLoaded",init);
addEventListener("storage",e=>{if(e.key===KEY){try{S=Object.assign({},DEF,JSON.parse(e.newValue||"{}"))}catch(_){}apply()}});
window.DZA={sig,show,open:openPanel,get state(){return Object.assign({},S)}};
})();
