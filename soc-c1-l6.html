/* BOWLING (order rounds): knock the pins down in the right order — strike for no mistakes */
function runBowling(G){
  let ri,okN;
  function start(){ri=0;okN=0;show()}
  function show(){
    const r=G.rounds[ri],n=r.steps.length;let step=0,mist=0,done=false;const cards=shuffle(r.steps.map((t,i)=>({t,i})));
    ST().innerHTML=`<div class="row"><span class="count">الرمية ${AR(ri+1)} من ${AR(G.rounds.length)}</span>${turnChip()}</div>
      <div class="hint">${esc(r.title)}</div>
      <div class="bwlane" id="bwl"><div class="bwpins">${cards.map(c=>`<button class="bwpin" type="button" data-i="${c.i}"><span class="bwcap"></span><span class="bwt">${esc(c.t)}</span></button>`).join("")}</div>
        <div class="bwboards"></div><span class="bwball" id="bwb"></span><span class="bwgut l"></span><span class="bwgut r"></span></div>
      <div class="bwframe" id="bwf">${r.steps.map((_,k)=>`<div class="bwslot"><em>${AR(k+1)}</em><span>…</span></div>`).join("")}</div>
      <div class="msg" id="msg" aria-live="polite">🎳 أسقطوا القوارير بالترتيب الصحيح، من الأولى إلى الأخيرة</div><div class="ex" id="ex" hidden></div>
      <div class="row"><button class="pill" id="osol" type="button">👁 الحل</button><button class="btn" id="nx" type="button" hidden>${ri+1<G.rounds.length?"الرمية التالية ←":"النتيجة 🏆"}</button></div>`;
    const slots=[...ST().querySelectorAll(".bwslot")];
    const roll=(pin,hit)=>{const b=$("#bwb"),l=$("#bwl");if(!b||!l)return;const L=l.getBoundingClientRect(),P=pin.getBoundingClientRect();
      b.style.transition="none";b.style.left="50%";b.style.bottom="8px";b.classList.remove("roll");void b.offsetWidth;b.style.transition="";b.classList.add("roll");
      b.style.left=(hit?P.left-L.left+P.width/2:(P.left-L.left<L.width/2?14:L.width-14))+"px";b.style.bottom=(L.bottom-P.bottom+P.height*.4)+"px";
      tone(90,.5,.07,"triangle");};
    const fill=(k,pin)=>{slots[k].classList.add("on");slots[k].querySelector("span").textContent=r.steps[k];if(pin){roll(pin,true);setTimeout(()=>pin.classList.add("down"),380)}
      setTimeout(()=>{[0,.05,.1].forEach(t=>tone(260+Math.random()*120,.08,.06,"square",t))},380)};
    const finish=rev=>{done=true;$("#osol").disabled=true;
      if(!rev){const pts=mist===0?3:mist<=2?2:1;okN++;award(turn,pts);$("#msg").className="msg good";$("#msg").innerHTML=mist?`🎳 سبير! ${AR(pts)} ${pts===2?"نقطتان":"نقطة"} لـ ${esc(tname(turn))}`:`💥 سترايك! ٣ نقاط لـ ${esc(tname(turn))}`;celebrate(mist?praise():"سترايك! 🎳💥",!mist)}
      else{$("#msg").className="msg";$("#msg").textContent="هذا هو الترتيب الصحيح"}
      if(r.ex){$("#ex").hidden=false;$("#ex").innerHTML=`<small>💡 من الكتاب${r.p?` · ص ${AR(r.p)}`:""}</small>${esc(r.ex)}`}showNx()};
    ST().querySelectorAll(".bwpin").forEach(b=>b.onclick=()=>{if(done||b.classList.contains("down"))return;const k=+b.dataset.i;
      if(k===step){fill(step,b);step++;if(step===n)setTimeout(()=>finish(false),500);else{$("#msg").className="msg good";$("#msg").textContent=`صحيح! الآن القارورة رقم ${AR(step+1)}`}}
      else{mist++;roll(b,false);buzz();shakeEl(b);badMsg(`ذهبت الكرة إلى القناة! ليست هذه القارورة رقم ${AR(step+1)}`)}});
    $("#osol").onclick=()=>{if(done)return;for(let k=step;k<n;k++){const p=ST().querySelector(`.bwpin[data-i="${k}"]`);slots[k].classList.add("on");slots[k].querySelector("span").textContent=r.steps[k];if(p)p.classList.add("down")}finish(true)};
    $("#nx").onclick=()=>{nextTurn();ri++;tone(660,.05);if(ri<G.rounds.length){show();scrollStage()}else results(G,okN,G.rounds.length,start)};
  }
  intro(G,start);
}

const SS={g(k){try{return sessionStorage.getItem("darwaza:fb:"+k)}catch(e){return null}},s(k){try{sessionStorage.setItem("darwaza:fb:"+k,"1")}catch(e){}}};
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const FILE=(location.pathname.split("/").pop()||"index.html");
const GID=FILE.replace(/\.html$/,"")||"index";
const IS_HUB=GID==="index"||!!document.querySelector("#pWs");

/* ---------- تسجيل دخول مجهول ---------- */
let auth=LS.g("auth",null);
async function token(){
  const now=Date.now();
  if(auth&&auth.exp>now+60000)return auth.tok;
  try{
    let r;
    if(auth&&auth.ref){
      r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(auth.ref)});
      if(r.ok){const j=await r.json();auth={tok:j.id_token,ref:j.refresh_token,uid:j.user_id,exp:now+(+j.expires_in)*1000};LS.s("auth",auth);return auth.tok}
    }
    r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok)return null;
    const j=await r.json();auth={tok:j.idToken,ref:j.refreshToken,uid:j.localId,exp:now+(+j.expiresIn)*1000};LS.s("auth",auth);return auth.tok;
  }catch(e){return null}
}
const num=f=>f?+(f.integerValue||f.doubleValue||0):0;
async function getDoc(path,withAuth){
  try{const h={};if(withAuth){const t=await token();if(!t)return null;h.Authorization="Bearer "+t}
    const r=await fetch(`${DB}/${path}`,{headers:h});if(r.status===404)return {};if(!r.ok)return null;const j=await r.json();return j.fields||{}}catch(e){return null}
}
async function commit(writes){
  const t=await token();if(!t)return false;
  try{const r=await fetch(`${DB}:commit`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({writes})});return r.ok}catch(e){return false}
}
const NAME=p=>`projects/${PID}/databases/(default)/documents/${p}`;
const inc=(path,fields,extra)=>({update:{name:NAME(path),fields:extra||{}},updateMask:{fieldPaths:Object.keys(extra||{})},updateTransforms:Object.entries(fields).map(([f,v])=>({fieldPath:f,increment:{integerValue:String(v)}}))});

/* ---------- العدّادات ---------- */
const MKEY=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const monthly=f=>commit([inc("monthly/"+MKEY(),f)]); /* منفصل: لو فشل ما يأثر على العداد الكلي */
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
async function countHub(){
  const f={};
  if(!SS.g("visit")){f.visits=1}
  if(!LS.g("device",false)){f.devices=1}
  if(standalone()&&!LS.g("installed",false)){f.installs=1}
  if(!Object.keys(f).length)return;
  if(await commit([inc("stats/global",f)])){monthly(f);SS.s("visit");LS.s("device",true);if(f.installs)LS.s("installed",true)}
}
addEventListener("appinstalled",async()=>{if(LS.g("installed",false))return;if(await commit([inc("stats/global",{installs:1})])){monthly({installs:1});LS.s("installed",true)}});
async function countPlay(){
  if(SS.g("p:"+GID))return;
  const t=(document.title||GID).slice(0,60);
  if(await commit([inc("games/"+GID,{plays:1},{t:{stringValue:t}})])){monthly({plays:1});SS.s("p:"+GID)}
}

/* ---------- زر الإعجاب ---------- */
const css=`.dzl-btn{display:inline-flex;align-items:center;gap:8px;border:2px solid #f3b4c6;background:#fff5f8;color:#b4235a;border-radius:999px;padding:8px 16px;font:700 15px "Readex Pro",Tahoma,sans-serif;cursor:pointer;direction:rtl;transition:transform .15s}
.dzl-btn:hover{transform:scale(1.05)}.dzl-btn:focus-visible{outline:3px solid #2f6fe0;outline-offset:2px}
.dzl-btn .dzl-h{font-size:20px;line-height:1;display:inline-block}
.dzl-btn[aria-pressed=true]{background:#e11d63;border-color:#e11d63;color:#fff}
.dzl-btn.dzl-pop .dzl-h{animation:dzlPop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes dzlPop{40%{transform:scale(1.7) rotate(-12deg)}}
.dzl-wrap{display:flex;justify-content:center;margin:10px 0 4px}
.dzl-float{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(76px + var(--dzaLift,0px) + env(safe-area-inset-bottom,0px));z-index:2147482990;box-shadow:0 6px 16px #0003}
.dzl-heart{position:fixed;pointer-events:none;z-index:2147482995;font-size:22px;animation:dzlFly 1s ease-out forwards}
@keyframes dzlFly{to{transform:translate(var(--x),-120px) scale(1.4);opacity:0}}
.dzx-link{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0 4px}
.dzx-ov{position:fixed;inset:0;z-index:2147483001;background:#0d142680;display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl;font-family:"Readex Pro",Tahoma,sans-serif}
.dzx-ov[hidden]{display:none!important}
.dzx-box{background:#fffaf2;color:#2a1f14;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:20px;box-shadow:0 20px 50px #0005}
.dzx-hd{display:flex;align-items:center;gap:10px}.dzx-hd h2{margin:0;flex:1;font-size:22px}
.dzx-x{width:40px;height:40px;border-radius:50%;border:0;background:#f1e6d4;font-size:18px;cursor:pointer;color:#2a1f14}
.dzx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.dzx-k{background:#fff;border:2px solid #efdfc6;border-radius:18px;padding:12px 14px}
.dzx-k b{display:block;font-size:30px;color:#a8641b;font-variant-numeric:tabular-nums}.dzx-k span{font-size:13px;color:#7a6650}
.dzx-tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.dzx-tabs button{border:0;border-radius:999px;padding:8px 14px;background:#f1e6d4;font:inherit;font-weight:700;cursor:pointer;color:#2a1f14}
.dzx-tabs button[aria-pressed=true]{background:#c98a2e;color:#fff}
.dzx-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #efdfc6}
.dzx-row i{font-style:normal;color:#a8641b;font-weight:700;text-align:center}
.dzx-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#f2b84b,#c98a2e);margin-top:4px}
.dzx-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dzx-h3{margin:18px 2px 4px;font-size:17px}
.dzx-chart{display:flex;align-items:flex-end;gap:6px;height:200px;padding:8px 4px 0;border-bottom:2px solid #efdfc6;overflow-x:auto}
.dzx-col{flex:1;min-width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.dzx-col b{font-size:13px;color:#a8641b;font-variant-numeric:tabular-nums;min-height:18px}
.dzx-cb{flex:1;width:70%;max-width:44px;display:flex;align-items:flex-end}
.dzx-cb i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(#f2b84b,#c98a2e);transition:height .5s}
.dzx-col.now .dzx-cb i{background:linear-gradient(#ffcf6b,#e08a1e);box-shadow:0 0 0 2px #fff,0 0 0 4px #f2b84b}
.dzx-col small{font-size:11px;color:#7a6650;text-align:center;line-height:1.3;padding-bottom:4px}
.dzx-note{font-size:12.5px;color:#7a6650;margin-top:12px;line-height:1.7}`;
const st=document.createElement("style");st.textContent=css;document.head.appendChild(st);

let liked=LS.g("liked",{}),btn=null,count=0,busy=false;
function drawBtn(){if(!btn)return;const on=!!liked[GID];btn.setAttribute("aria-pressed",on);
  btn.innerHTML=`<span class="dzl-h" aria-hidden="true">${on?"❤️":"🤍"}</span><span>${on?"أعجبتني":"أعجبتني؟"}</span><span class="dzl-n">${count?AR(count):""}</span>`;
  btn.setAttribute("aria-label",(on?"إلغاء الإعجاب":"أعجبتني اللعبة")+(count?` (${count})`:""))}
function hearts(){const r=btn.getBoundingClientRect();for(let i=0;i<6;i++){const h=document.createElement("span");h.className="dzl-heart";h.textContent="❤️";h.style.left=(r.left+r.width/2-10)+"px";h.style.top=(r.top)+"px";h.style.setProperty("--x",((Math.random()-.5)*90)+"px");h.style.animationDelay=(i*.06)+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),1400)}}
async function toggleLike(){
  if(busy)return;busy=true;
  const on=!liked[GID];const t=await token();if(!t||!auth){busy=false;return}
  const likeDoc=`likes/${auth.uid}_${GID}`;
  const w=on?[{update:{name:NAME(likeDoc),fields:{u:{stringValue:auth.uid}}},currentDocument:{exists:false}},inc("games/"+GID,{likes:1})]
            :[{delete:NAME(likeDoc),currentDocument:{exists:true}},inc("games/"+GID,{likes:-1})];
  /* تحديث فوري على الشاشة */
  liked[GID]=on?1:0;if(!on)delete liked[GID];count=Math.max(0,count+(on?1:-1));drawBtn();
  if(on){btn.classList.remove("dzl-pop");void btn.offsetWidth;btn.classList.add("dzl-pop");hearts();try{window.DZA&&DZA.sig("label",{i:"❤️",t:"تم تسجيل إعجابك",c:"#e11d63"})}catch(e){}}
  const ok=await commit(w);
  if(!ok){ /* ربما مسجّل من قبل: نقرأ الحالة الحقيقية */
    const d=await getDoc(likeDoc,true);if(d){if(Object.keys(d).length)liked[GID]=1;else delete liked[GID]}
    const g=await getDoc("games/"+GID);if(g)count=num(g.likes);drawBtn();
  }
  LS.s("liked",liked);busy=false;
}
async function mountLike(){
  btn=document.createElement("button");btn.type="button";btn.className="dzl-btn";btn.onclick=toggleLike;
  const ft=document.querySelector("footer");
  if(ft){let w=document.querySelector(".dzl-wrap");if(!w){w=document.createElement("div");w.className="dzl-wrap";ft.parentNode.insertBefore(w,ft)}w.prepend(btn)}
  else{btn.classList.add("dzl-float");document.body.appendChild(btn)}
  drawBtn();
  const g=await getDoc("games/"+GID);if(g){count=num(g.likes);drawBtn()}
}

/* ---------- لوحة الأرقام (في المنصة) ---------- */
async function listGames(){
  const out=[];let pt="";
  try{for(let i=0;i<5;i++){const r=await fetch(`${DB}/games?pageSize=300${pt?"&pageToken="+encodeURIComponent(pt):""}`);if(!r.ok)break;const j=await r.json();
    (j.documents||[]).forEach(d=>{const f=d.fields||{};out.push({id:d.name.split("/").pop(),t:f.t?f.t.stringValue:"",plays:num(f.plays),likes:num(f.likes)})});
    if(!j.nextPageToken)break;pt=j.nextPageToken}}catch(e){}
  return out;
}
async function listMonths(){try{const r=await fetch(`${DB}/monthly?pageSize=60`);if(!r.ok)return {};const j=await r.json();const o={};
  (j.documents||[]).forEach(d=>{const f=d.fields||{};o[d.name.split("/").pop()]={visits:num(f.visits),devices:num(f.devices),installs:num(f.installs),plays:num(f.plays)}});return o}catch(e){return {}}}
const MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
let mview="visits";
function chart(M){
  const d=new Date(),keys=[];for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);keys.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"))}
  const first=keys.findIndex(k=>M[k]);const ks=first<0?keys.slice(-1):keys.slice(Math.max(0,Math.min(first,keys.length-3)));
  const vals=ks.map(k=>(M[k]||{})[mview]||0),mx=Math.max(1,...vals);
  const L={visits:"👀 الزيارات",plays:"🎮 مرات اللعب",devices:"📱 أجهزة جديدة",installs:"⬇️ التنزيلات"};
  return `<h3 class="dzx-h3">📈 النمو شهرًا بشهر</h3>
  <div class="dzx-tabs" role="group" aria-label="نوع الرسم">${Object.keys(L).map(k=>`<button type="button" data-m="${k}" aria-pressed="${mview===k}">${L[k]}</button>`).join("")}</div>
  <div class="dzx-chart" role="img" aria-label="${L[mview]} لكل شهر: ${ks.map((k,i)=>MN[+k.slice(5)-1]+" "+vals[i]).join("، ")}">
  ${ks.map((k,i)=>`<div class="dzx-col${k===MKEY()?" now":""}"><b>${vals[i]?AR(vals[i]):""}</b><span class="dzx-cb"><i style="height:${vals[i]?Math.max(4,vals[i]/mx*100):0}%"></i></span><small>${MN[+k.slice(5)-1]}<br>${AR(k.slice(2,4))}</small></div>`).join("")}
  </div>${Object.keys(M).length?"":'<p class="dzx-note">الرسم يبدأ من هذا الشهر، وكل شهر جديد ينضاف عمود.</p>'}`;
}
let ov=null,view="plays";
async function openDash(){
  if(!ov){ov=document.createElement("div");ov.className="dzx-ov";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");ov.setAttribute("aria-labelledby","dzx-h");ov.onclick=e=>{if(e.target===ov)ov.hidden=true};document.body.appendChild(ov);addEventListener("keydown",e=>{if(e.key==="Escape"&&ov)ov.hidden=true})}
  ov.hidden=false;ov.innerHTML=`<div class="dzx-box"><div class="dzx-hd"><h2 id="dzx-h">📊 أرقام دروازة</h2><button class="dzx-x" type="button" aria-label="إغلاق">✕</button></div><p>جاري التحميل…</p></div>`;
  ov.querySelector(".dzx-x").onclick=()=>ov.hidden=true;
  const [s,games,M]=await Promise.all([getDoc("stats/global"),listGames(),listMonths()]);
  if(s===null){ov.querySelector("p").textContent="ما قدرنا نوصل للأرقام الحين. تأكد من الإنترنت وحاول مرة ثانية.";return}
  const tot=k=>games.reduce((a,g)=>a+g[k],0);
  const draw=()=>{
    const list=games.slice().sort((a,b)=>b[view]-a[view]).filter(g=>g[view]>0).slice(0,40);const mx=list[0]?list[0][view]:1;
    ov.querySelector(".dzx-box").innerHTML=`<div class="dzx-hd"><h2 id="dzx-h">📊 أرقام دروازة</h2><button class="dzx-x" type="button" aria-label="إغلاق">✕</button></div>
    <div class="dzx-kpis">
      <div class="dzx-k"><b>${AR(num(s.visits))}</b><span>👀 زيارة للمنصة</span></div>
      <div class="dzx-k"><b>${AR(num(s.devices))}</b><span>📱 جهاز مختلف دخل المنصة</span></div>
      <div class="dzx-k"><b>${AR(num(s.installs))}</b><span>⬇️ تنزيل للتطبيق</span></div>
      <div class="dzx-k"><b>${AR(tot("plays"))}</b><span>🎮 مرة فتح فيها لعبة</span></div>
      <div class="dzx-k"><b>${AR(tot("likes"))}</b><span>❤️ إعجاب</span></div>
    </div>
    ${chart(M)}
    <h3 class="dzx-h3">🏆 ترتيب الألعاب</h3>
    <div class="dzx-tabs" role="group" aria-label="ترتيب الألعاب"><button type="button" data-v="plays" aria-pressed="${view==="plays"}">🎮 الأكثر لعبًا</button><button type="button" data-v="likes" aria-pressed="${view==="likes"}">❤️ الأكثر إعجابًا</button></div>
    ${list.length?list.map((g,i)=>`<div class="dzx-row"><i>${AR(i+1)}</i><div><div>${(g.t||g.id).replace(/[<>&]/g,"")}</div><div class="dzx-bar" style="width:${Math.max(4,g[view]/mx*100)}%"></div></div><b>${view==="likes"?"❤️ ":"🎮 "}${AR(g[view])}</b></div>`).join(""):'<p class="dzx-note">ما في أرقام بعد. أول ما يفتح أحد الألعاب بتظهر هنا.</p>'}
    <p class="dzx-note">💡 «الزيارة» تنحسب مرة لكل جلسة، و«الجهاز» مرة واحدة لكل جهاز، و«التنزيل» لما يُفتح التطبيق المثبّت أول مرة. الأرقام بدون أي معلومات شخصية عن الزوار.</p>`;
    ov.querySelector(".dzx-x").onclick=()=>ov.hidden=true;
    ov.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});ov.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mview=b.dataset.m;draw()});
  };draw();
}
function mountDashLink(){
  const ft=document.querySelector("footer");if(!ft)return;
  const b=document.createElement("button");b.type="button";b.className="dzx-link";b.textContent="📊 أرقام المنصة";b.onclick=openDash;
  ft.append(" · ",b);
}

function init(){
  if(IS_HUB){countHub();mountDashLink()}
  else{countPlay();mountLike()}
}
if(document.readyState==="loading")addEventListener("DOMContentLoaded",init);else init();
window.DZS={openDash};
})();

</script><!--/dza-->
