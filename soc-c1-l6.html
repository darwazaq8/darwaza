<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حقيبة الباحث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;700&display=swap">
<style>/* Philosophy games kit — light "parchment & ink" look, one accent per game (--ac). Single committed light theme for projector use. */
:root{
  --bg:#f7f2ff; --bg2:#fff7ea; --ink:#271f3d; --soft:#6a6182; --card:#ffffff; --line:#e4dcf3;
  --good:#1fa97c; --bad:#e8574a; --sun:#ffc23d; --ac:#8b7cf6; --ac2:#5b46d6;
  --t1:#8b7cf6; --t2:#2fbf9b; --t3:#ff7a6b; --t4:#2f9fe0; --t5:#f06aa6; --t6:#e0a100; --t7:#16a3a3; --t8:#b45fd6;
  --display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,var(--bg),var(--bg2));background-color:var(--bg);color:var(--ink);font-family:var(--body);direction:rtl;overflow-x:hidden}
button{font-family:var(--body);color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ac2);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) 30px;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{flex:1 1 220px;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.15;text-align:center;color:var(--ac2)}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.pill:hover{border-color:var(--ac)}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tag{background:color-mix(in srgb,var(--ac) 14%,var(--card));border:2px solid color-mix(in srgb,var(--ac) 40%,transparent);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}

/* teams strip */
.teams{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tm{display:flex;align-items:center;gap:8px;border-radius:999px;padding:5px 6px 5px 14px;background:var(--card);border:2px solid color-mix(in srgb,var(--tc) 55%,transparent);font-weight:700;font-size:15px;transition:transform .25s,box-shadow .25s}
.tm b{font-family:var(--display);font-weight:400;font-size:22px;min-width:1.6ch;text-align:center;font-variant-numeric:tabular-nums;color:var(--tc)}
.tm.on{background:var(--tc);color:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--tc) 30%,transparent);transform:scale(1.06)}
.tm.on b{color:#fff}
.tm .mn{width:26px;height:26px;border-radius:50%;border:none;background:color-mix(in srgb,var(--tc) 18%,transparent);cursor:pointer;font-weight:700}
.tm.on .mn{background:rgba(255,255,255,.25);color:#fff}

/* panels */
.stage{background:var(--card);border:2px solid var(--line);border-radius:30px;padding:clamp(16px,3vw,30px);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;box-shadow:0 18px 40px -30px rgba(40,20,90,.5)}
.hero svg{width:min(360px,100%);height:auto;display:block}
.intro h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,60px);margin:0;line-height:1.1;color:var(--ac2)}
.intro p{margin:0;color:var(--soft);font-size:clamp(16px,2vw,19px);line-height:1.8;max-width:52ch}
.how{display:flex;flex-direction:column;gap:6px;text-align:start;background:color-mix(in srgb,var(--sun) 16%,var(--card));border:2px dashed var(--sun);border-radius:18px;padding:12px 16px;max-width:560px;width:100%}
.how b{font-size:15px}
.how span{font-size:15px;line-height:1.7}
.btn{border:none;border-radius:16px;padding:13px 24px;font-weight:700;font-size:18px;cursor:pointer;color:#fff;background:var(--ac2);box-shadow:0 6px 0 color-mix(in srgb,var(--ac2) 60%,#000);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ac2) 60%,#000)}
.btn.alt{background:var(--good);box-shadow:0 6px 0 #127a58}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.count{font-weight:700;color:var(--soft);font-size:14px;font-variant-numeric:tabular-nums}
.turn{font-weight:700;font-size:clamp(16px,2vw,20px);padding:7px 18px;border-radius:999px;background:color-mix(in srgb,var(--tc) 20%,var(--card));border:2px solid var(--tc)}
.q{font-weight:700;font-size:clamp(20px,3.2vw,32px);line-height:1.6;max-width:36ch;text-wrap:balance}
.msg{font-weight:700;font-size:clamp(16px,2.2vw,21px);min-height:1.5em;line-height:1.6}
.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.ex{background:color-mix(in srgb,var(--ac) 10%,var(--card));border-inline-start:6px solid var(--ac);border-radius:14px;padding:10px 16px;text-align:start;font-size:clamp(15px,1.9vw,18px);line-height:1.8;max-width:60ch}
.ex small{display:block;color:var(--soft);font-weight:700;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:900px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px 16px;font-size:clamp(16px,2.1vw,21px);font-weight:700;line-height:1.5;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;min-width:0}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--ac)}
.opt .k{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--ac2);font-family:var(--display);font-size:22px}
.opt .av{flex:none;width:52px;height:52px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--card))}
.opt.ok .k{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.no .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.prog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.prog i{width:22px;height:22px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.prog i.ok{background:var(--good)}.prog i.no{background:color-mix(in srgb,var(--bad) 55%,var(--line))}.prog i.now{transform:scale(1.35);box-shadow:0 0 0 3px var(--ac)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pop .45s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* results */
.podium{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.pd{min-width:130px;flex:0 1 180px;border-radius:22px;padding:14px;background:color-mix(in srgb,var(--tc) 14%,var(--card));border:3px solid var(--tc);display:flex;flex-direction:column;gap:4px;align-items:center}
.pd b{font-family:var(--display);font-weight:400;font-size:42px;line-height:1;color:var(--tc)}
.pd.win{transform:scale(1.08);box-shadow:0 14px 30px -14px var(--tc)}

/* game controls */
.pill.ctl{background:color-mix(in srgb,var(--ac) 12%,var(--card));border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.pov{position:fixed;inset:0;z-index:45;background:rgba(30,20,60,.55);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.pbox{background:var(--card);border-radius:30px;padding:28px 34px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pbox b{font-size:64px;line-height:1}.pbox h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px}
.stage{position:relative}
.ready{position:absolute;inset:clamp(70px,9vw,82px) 0 0 0;z-index:5;border-radius:28px;background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.ready b{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,40px);color:var(--ac2)}
.ready .btn{font-size:24px;padding:16px 34px}

/* settings */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,20,60,.45);display:grid;place-items:center;padding:16px}
.sheet[hidden]{display:none!important}
.sbox{background:var(--card);border-radius:26px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sbox h3{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.rnd{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:22px;font-weight:700;cursor:pointer}
.big{font-family:var(--display);font-size:32px;min-width:1.4ch;text-align:center}
.tin{display:flex;align-items:center;gap:8px;border:2px solid color-mix(in srgb,var(--tc) 60%,transparent);border-radius:14px;padding:4px 10px}
.tin i{width:14px;height:14px;border-radius:50%;background:var(--tc);flex:none}
.tin input{flex:1;min-width:0;border:none;background:transparent;font:700 17px var(--body);padding:8px 2px;color:var(--ink)}

/* celebration */
.party{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.garland{position:absolute;top:calc(-10px + env(safe-area-inset-top,0px));left:-2%;width:104%;height:110px;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.garland.g2{top:calc(40px + env(safe-area-inset-top,0px));animation-delay:.12s;opacity:.9}
@keyframes drop{from{transform:translateY(-130px)}to{transform:none}}
.party.out .garland{transition:transform .5s ease-in,opacity .5s;transform:translateY(-140px);opacity:0}
.cheer{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(40px,8vw,96px);color:#fff;text-shadow:0 5px 0 var(--ac2),0 10px 30px rgba(0,0,0,.25);white-space:nowrap;animation:cheer 1.6s cubic-bezier(.3,1.6,.5,1) both}
.cheer.small{font-size:clamp(30px,5.5vw,60px);top:28%}
@keyframes cheer{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1) rotate(3deg);opacity:1}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px}
.balloon{position:absolute;bottom:-120px;width:56px;height:70px;border-radius:50% 50% 48% 48%}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:50px;background:rgba(0,0,0,.3)}
.burst{position:fixed;pointer-events:none;z-index:60;width:10px;height:10px;border-radius:50%}
footer{text-align:center;color:var(--soft);font-size:14px;padding-top:10px;border-top:2px dashed var(--line)}
footer b{color:var(--ink)}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* engine pieces */
.loot{font-weight:700;font-size:15px;color:var(--soft);min-height:1.6em;letter-spacing:2px}
.talk{display:flex;flex-direction:column;gap:10px;width:100%;max-width:720px}
.say{display:flex;flex-direction:column;gap:2px;max-width:85%;padding:12px 16px;border-radius:20px;text-align:start;font-size:clamp(16px,2.1vw,21px);line-height:1.6}
.say b{font-size:13px;opacity:.8}
.say.r{align-self:flex-start;background:color-mix(in srgb,var(--ac) 16%,var(--card));border-bottom-right-radius:4px}
.say.l{align-self:flex-end;background:color-mix(in srgb,var(--sun) 26%,var(--card));border-bottom-left-radius:4px}
.opts.fixed{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.opts.fixed .opt{flex-direction:column;text-align:center;justify-content:center;padding:16px 10px}
.opts.fixed .opt .k{width:54px;height:54px;font-size:30px;font-family:var(--body)}

.card{background:linear-gradient(180deg,#fffdf6,#fff4dc);border:3px solid var(--sun);border-radius:22px;padding:22px 26px;font-weight:700;font-size:clamp(19px,2.8vw,28px);line-height:1.65;max-width:34ch;box-shadow:0 10px 0 -4px color-mix(in srgb,var(--sun) 60%,#000),0 20px 30px -20px rgba(0,0,0,.4);transform:rotate(-1deg)}
.bins{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;width:100%;max-width:980px}
.bin{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid color-mix(in srgb,var(--bc) 60%,transparent);background:color-mix(in srgb,var(--bc) 12%,var(--card));border-radius:22px;padding:14px 10px;cursor:pointer;transition:transform .15s,box-shadow .15s;min-width:0}
.bin:hover{transform:translateY(-4px);box-shadow:0 12px 22px -14px var(--bc)}
.bin .bi{font-size:36px;line-height:1}
.bin b{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.6vw,28px);line-height:1.2}
.bin small{color:var(--soft);font-weight:700;font-size:13px}
.bin em{font-style:normal;font-family:var(--display);font-size:24px;background:var(--bc);color:#fff;border-radius:999px;min-width:44px;padding:2px 10px}
.bin.ok{background:color-mix(in srgb,var(--good) 18%,var(--card));border-color:var(--good)}
.bin.no{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad)}
.scalev{width:min(420px,100%);height:auto}
.roof{width:100%;max-width:980px;height:70px;background:linear-gradient(180deg,var(--ac2),var(--ac));clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;place-items:end center;padding-bottom:10px;margin-bottom:-10px}
.roof span{color:#fff;font-family:var(--display);font-size:24px}
.bins.halls .bin{border-radius:90px 90px 16px 16px;padding-top:26px;min-height:190px;justify-content:center}
.bins.line{position:relative}
.bins.line::before{content:"";position:absolute;top:44px;right:8%;left:8%;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--soft) 0 14px,transparent 14px 24px);z-index:0;opacity:.5}
.bins.line .bin{position:relative;z-index:1;border-radius:26px}

.bridge{display:flex;align-items:flex-end;width:100%;max-width:900px;gap:0;margin-block:6px 0}
.bank{flex:0 0 18%;height:110px;background:linear-gradient(180deg,#9ed36a,#6aa84f 30%,#a47148 30%,#7a5230);border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:36px;color:#fff;min-width:0}
.bank b{font-family:var(--display);font-weight:400;font-size:clamp(16px,2.4vw,26px);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.planks{flex:1;display:flex;gap:3px;align-items:flex-start;height:110px;padding-top:30px;background:linear-gradient(180deg,transparent 55%,#8fd3f4 55%,#4aa8d8);border-bottom:0;min-width:0}
.planks i{flex:1;height:20px;border-radius:3px;background:transparent;border:2px dashed rgba(39,31,61,.25);transition:background .4s,transform .4s}
.planks i.ok{background:linear-gradient(180deg,#c98b4b,#8a5a2b);border:2px solid #6e4520;animation:pop .4s ease}
.planks i.no{background:repeating-linear-gradient(45deg,#cfc6bd 0 5px,#b3a89c 5px 10px);border:2px solid #9a8f84;transform:translateY(14px) rotate(8deg)}
.planks i.now{border-color:var(--ac2);border-style:solid}
.tf{gap:16px}
.tfb{border:none;border-radius:22px;padding:18px 34px;font-weight:700;font-size:clamp(22px,3vw,30px);cursor:pointer;color:#fff;min-width:160px;transition:transform .1s}
.tfb.yes{background:var(--good);box-shadow:0 7px 0 #127a58}
.tfb.nope{background:var(--bad);box-shadow:0 7px 0 #b33a30}
.tfb:active{transform:translateY(4px)}
.tfb.ok{outline:5px solid var(--sun)}
.tfb.no{opacity:.6}
.tfb:disabled{cursor:default}

.towers{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;width:100%;align-items:end}
.tower{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.th{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bc);color:#fff;border-radius:18px 18px 8px 8px;padding:10px 4px;min-height:86px;justify-content:center}
.th span{font-size:28px;line-height:1}
.th b{font-family:var(--display);font-weight:400;font-size:clamp(15px,2vw,22px);line-height:1.15;text-align:center}
.lvl{border:3px solid color-mix(in srgb,var(--bc) 60%,transparent);background:color-mix(in srgb,var(--bc) 12%,var(--card));border-radius:14px;padding:14px 4px;font-family:var(--display);font-size:clamp(24px,3.4vw,36px);cursor:pointer;color:var(--ink);transition:transform .15s}
.lvl:hover:not(:disabled){transform:scale(1.06);background:var(--bc);color:#fff}
.lvl:disabled{opacity:.35;cursor:default;font-family:var(--body);font-size:22px}
@media (max-width:760px){.bins{grid-template-columns:repeat(2,minmax(0,1fr))}.towers{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:460px){.bins{grid-template-columns:1fr}.bins.halls .bin{min-height:120px}.towers{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* order */
.bigemo{font-size:clamp(70px,12vw,120px);line-height:1.1}
.oslots{display:flex;flex-direction:column;gap:8px;width:100%;max-width:760px;align-items:center}
.oslots.pyramid{flex-direction:column-reverse;gap:6px}
.os{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:3px dashed var(--line);border-radius:16px;padding:8px 12px;background:var(--card);font-weight:700;font-size:clamp(15px,2vw,19px);line-height:1.5;text-align:start;transition:background .3s,border-color .3s}
.oslots.pyramid .os{justify-content:center;text-align:center;border-radius:10px;min-height:46px}
.os em{font-style:normal;flex:none;width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.os span{min-width:0}
.os.full{border-style:solid;border-color:var(--oc);background:color-mix(in srgb,var(--oc) 22%,var(--card))}
.os.full em{background:var(--oc);color:#fff}
.os.next{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
.otray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:900px}
.ocard{border:3px solid var(--ac);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;font-size:clamp(14px,1.9vw,18px);line-height:1.5;cursor:pointer;max-width:360px;box-shadow:0 4px 0 color-mix(in srgb,var(--ac2) 45%,#000);transition:transform .12s}
.ocard:hover{transform:translateY(-3px)}

/* route map (order engine) */
.rwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start;width:100%}
.rwrap .oslots{margin:0}
.rmap{border-radius:18px;overflow:hidden;border:4px solid #c9a86a;background:#9fd3e8;box-shadow:0 14px 30px -18px rgba(0,0,0,.5)}
.rmap svg{display:block;width:100%;height:auto}
.rsea{fill:#9fd3e8}.rl{fill:#efe2c2;stroke:#b9a57c;stroke-width:1}.rl.kw{fill:#f6d77a;stroke:#b0802a}
.rlab{font-family:var(--body);font-weight:700;font-size:15px;fill:#6b5a3a;text-anchor:middle;opacity:.85;pointer-events:none}
.rlab.big{font-size:22px}.rlab.sea{fill:#1d6fa8;font-size:17px}.rlab.s{font-size:12px}
.rseg{fill:none;stroke:#d64545;stroke-width:4.5;stroke-linecap:round;opacity:0}.rseg.on{opacity:1}.rseg.sea{stroke:#1d4fa8}
.rst{opacity:0;transition:opacity .3s;cursor:pointer;outline:none}.rst.on{opacity:1}
.rst circle{fill:#d64545;stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.rst:focus-visible circle{stroke:#271f3d}
.rst.new{animation:mkpop .6s cubic-bezier(.2,1.6,.4,1);transform-box:fill-box;transform-origin:center}

.kpsea{position:relative;height:110px}
.kpboat{position:absolute;top:-6px;right:16%;font-size:44px}.kprope{position:absolute;top:30px;right:calc(16% + 22px);width:2px;height:40px;background:#f3e2c0}
.kpdiver{position:absolute;top:56px;right:calc(16% + 8px);width:34px}.kpdiver svg{width:100%;height:auto}
.kpdiver.dive{animation:kpdive 1.2s ease-in-out}.kpdiver.bump{animation:shake .45s}

.kpfish{position:absolute;font-size:22px}.kpfish.f1{top:40px;left:10%}.kpfish.f2{top:76px;left:44%}

.kpq{padding:0 16px}.kpq .q{background:rgba(255,255,255,.95);border-radius:16px;padding:14px 18px}
.kpbed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:6px 16px 0}

.kpshell{flex:none;position:relative;width:46px;height:38px}
.kpshell i{position:absolute;left:0;right:0}.kpshell .bot{bottom:0;height:20px;border-radius:0 0 50% 50%;background:linear-gradient(180deg,#9a8a7a,#5a4a3a)}
.kpshell .top{bottom:14px;height:20px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#b8a898,#7a6a5a);transform-origin:bottom;transition:transform .5s}

.kpoy:hover:not(:disabled) .top{transform:rotateX(40deg)}
.kpoy.ok{background:rgba(31,138,91,.6);box-shadow:inset 0 0 0 3px #b8ffd0}.kpoy.ok .top{transform:rotateX(70deg) translateY(-6px)}.kpoy.ok .pearl{opacity:1}
.kpoy.no{background:rgba(168,50,50,.55)}
@media (prefers-reduced-motion:no-preference){.kpfish.f1{animation:kpswim 7s linear infinite alternate}.kpfish.f2{animation:kpswim 9s linear infinite alternate-reverse}.kpbub{animation:fsrise 4s ease-in infinite}.kpbub.b2{animation-delay:1.8s}.kpboat{animation:fsrock 2.4s ease-in-out infinite alternate}}
@keyframes kpswim{to{transform:translateX(160px)}}
@keyframes fsrise{from{transform:translateY(0);opacity:1}to{transform:translateY(-120px);opacity:0}}@keyframes fsrock{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

.kpdir.pn{grid-column:2;grid-row:2}.kpdir.ps{grid-column:2;grid-row:4}.kpdir.pe{grid-column:3;grid-row:3}.kpdir.pw{grid-column:1;grid-row:3}

<script>
const G={"home": "psychology", "homeName": "بوابة علم النفس وعلم الاجتماع", "engine": "fixedpick", "skin": "bag", "title": "حقيبة الباحث", "unit": "علم الاجتماع · الفصل الأول: مقدمة في نشأة علم الاجتماع", "lesson": "أدوات جمع البيانات", "pages": "٧٥", "fixed": [{"t": "الملاحظة البسيطة", "icon": "👁️"}, {"t": "الملاحظة المنظمة", "icon": "🔍"}, {"t": "الاستبيان", "icon": "📋"}, {"t": "المقابلة", "icon": "🎙️"}, {"t": "تحليل المضمون", "icon": "📰"}], "intro": "في حقيبة الباحث الاجتماعي خمس أدوات لجمع البيانات. اقرؤوا موقف الباحث، واختاروا الأداة التي يستخدمها.", "how": ["في حقيبة الباحث خمس أدوات لجمع البيانات.", "يظهر موقف لباحث، والفريق صاحب الدور يُخرج الأداة المناسبة من الحقيبة.", "الأداة الصحيحة تقفز من الحقيبة وتمنح نقطة."], "loot": {"icon": "🧰", "label": "أدوات"}, "questions": [{"q": "ملاحظة الظواهر كما تحدث تلقائيًا", "ans": "الملاحظة البسيطة", "ex": "الملاحظة البسيطة: وهي ملاحظة الظواهر كما تحدث تلقائيًا.", "p": 75}, {"q": "ملاحظة تخضع للضبط العلمي (الملاحظة العلمية الدقيقة)", "ans": "الملاحظة المنظمة", "ex": "الملاحظة المنظمة: وهي التي تخضع للضبط العلمي (الملاحظة العلمية الدقيقة).", "p": 75}, {"q": "مجموعة من الأسئلة قد تكون مغلقة ذات بدائل متعددة أو مفتوحة", "ans": "الاستبيان", "ex": "الاستبيان: وهو عبارة عن مجموعة من الأسئلة قد تكون أسئلة مغلقة ذات بدائل متعددة، أو تكون مفتوحة، أو تكون شاملة للنوعين.", "p": 75}, {"q": "يلتقي الباحث بالمبحوثين ويوجه إليهم الأسئلة ويدون الإجابات بنفسه", "ans": "المقابلة", "ex": "المقابلة: وتتم بمقابلة الباحث للمبحوثين وتوجيه الأسئلة إليهم، وتدوين الإجابات بنفسه.", "p": 75}, {"q": "أداة تُستخدم في الأبحاث الصحفية والأدبية", "ans": "تحليل المضمون", "ex": "تحليل المضمون أو المحتوى: والذي يستخدم في الأبحاث الصحفية والأدبية، وفي كثير من المجالات العلمية.", "p": 75}, {"q": "باحث يجلس في ساحة المدرسة ويراقب لعب الطلبة في الفسحة كما يحدث دون ترتيب مسبق", "ans": "الملاحظة البسيطة", "ex": "هذه ملاحظة للظاهرة كما تحدث تلقائيًا، فهي ملاحظة بسيطة.", "p": 75}, {"q": "باحث يراقب سلوك الطلبة وفق جدول محدد للأوقات والسلوكيات التي يسجلها بدقة", "ans": "الملاحظة المنظمة", "ex": "الملاحظة التي تخضع للضبط العلمي هي الملاحظة المنظمة.", "p": 75}, {"q": "باحث يوزع ورقة أسئلة على ٢٠٠ طالب ليختاروا من بدائل متعددة", "ans": "الاستبيان", "ex": "الأسئلة المغلقة ذات البدائل المتعددة من صور الاستبيان.", "p": 75}, {"q": "باحث يجلس مع ولي أمر طالب ويسأله ويكتب إجاباته بنفسه", "ans": "المقابلة", "ex": "في المقابلة يقابل الباحث المبحوث ويوجه إليه الأسئلة ويدوّن الإجابات بنفسه.", "p": 75}, {"q": "باحث يدرس مقالات الصحف الكويتية عن قضية الشباب ويحلل ما فيها", "ans": "تحليل المضمون", "ex": "دراسة محتوى الصحف والمقالات من تحليل المضمون أو المحتوى.", "p": 75}], "hero": "<svg viewBox=\"0 0 360 220\" role=\"img\" aria-label=\"أدوات الباحث\"><path d=\"M30 200h300\" stroke=\"#e4dcf3\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"90\" cy=\"110\" r=\"58\" fill=\"#e9e2fb\"/><text x=\"90\" y=\"130.88\" text-anchor=\"middle\" font-size=\"60\">👁️</text><circle cx=\"200\" cy=\"92\" r=\"70\" fill=\"#d8f3ea\"/><text x=\"200\" y=\"117.2\" text-anchor=\"middle\" font-size=\"73\">📋</text><circle cx=\"300\" cy=\"124\" r=\"52\" fill=\"#fde4e1\"/><text x=\"300\" y=\"142.72\" text-anchor=\"middle\" font-size=\"54\">🎙️</text><path d=\"M330 30l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z\" fill=\"#ffc23d\"/></svg>"};
/* Philosophy games kit: teams (shared with دروازة), sound, celebration, header */
const $=s=>document.querySelector(s);
const TCOL=["var(--t1)","var(--t2)","var(--t3)","var(--t4)","var(--t5)","var(--t6)","var(--t7)","var(--t8)"];
const GCOL=["#ff7a6b","#ffc23d","#2fbf9b","#8b7cf6","#2f9fe0","#f06aa6"];
const DEFNAMES=["فريق النجوم","فريق السكينة","فريق الأمل","فريق التوافق","فريق الإبداع","فريق الثقة","فريق النور","فريق الحكمة"];
const store={get(k,d){try{const v=localStorage.getItem("darwaza:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("darwaza:"+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const reduce=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);

/* sound */
let sound=true,ac;
function actx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function tone(f,d=.1,v=.08,type="sine",t0=0){if(!sound)return;const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
  const t=c.currentTime+t0;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
const chord=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,.07,"triangle",i*.07));
const buzz=()=>{tone(220,.25,.08,"sawtooth");tone(180,.3,.05,"sawtooth",.08)};
const tick=()=>tone(1200,.03,.04,"square");
function fanfare(big){const n=big?[523,659,784,1047,784,1047,1319]:[659,784,1047];
  n.forEach((f,i)=>{tone(f,.22,.08,"triangle",i*.11);tone(f/2,.22,.04,"sine",i*.11)});
  if(big)setTimeout(()=>[1047,1319,1568].forEach((f,i)=>tone(f,.5,.06,"triangle",i*.02)),n.length*110)}

/* celebration */
function garland(){let p="",n=18;for(let i=0;i<n;i++){const x=i*(1000/n),w=1000/n;p+=`<path d="M${x+4} ${20+Math.sin(i/(n-1)*Math.PI)*30} L${x+w-4} ${20+Math.sin((i+1)/(n-1)*Math.PI)*30} L${x+w/2} ${80+Math.sin((i+.5)/(n-1)*Math.PI)*30}Z" fill="${GCOL[i%6]}"/>`}
  return `<svg class="garland" viewBox="0 0 1000 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20 Q500 80 1000 20" stroke="#271f3d" stroke-width="3" fill="none"/>${p}</svg>`}
let partyT=0;
function celebrate(text="أحسنتم! 🎉",big=false){
  fanfare(big);document.querySelector(".party")?.remove();clearTimeout(partyT);
  const p=document.createElement("div");p.className="party";
  p.innerHTML=garland()+(big?garland().replace('class="garland"','class="garland g2"'):"")+`<div class="cheer${big?"":" small"}">${esc(text)}</div>`;
  document.body.appendChild(p);
  if(!reduce()){const N=big?110:55;for(let i=0;i<N;i++){const c=document.createElement("span");c.className="conf";c.style.left=Math.random()*100+"%";c.style.background=GCOL[i%6];if(i%3===0)c.style.borderRadius="50%";p.appendChild(c);
      c.animate([{transform:"translate(0,0) rotate(0)"},{transform:`translate(${(Math.random()-.5)*200}px,${innerHeight+60}px) rotate(${Math.random()*900}deg)`}],{duration:1800+Math.random()*1600,delay:Math.random()*500,easing:"cubic-bezier(.25,.5,.5,1)",fill:"forwards"})}
    if(big)for(let i=0;i<9;i++){const b=document.createElement("span");b.className="balloon";b.style.left=(5+i*11)+"%";b.style.background=GCOL[i%6];p.appendChild(b);
      b.animate([{transform:"translateY(0)"},{transform:`translateY(-${innerHeight+260}px) translateX(${(Math.random()-.5)*80}px)`}],{duration:3200+Math.random()*1400,delay:i*120,easing:"ease-in",fill:"forwards"})}}
  partyT=setTimeout(()=>{p.classList.add("out");setTimeout(()=>p.remove(),600)},big?3600:2000);
}
function burstAt(el,count=20){if(reduce()||!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<count;i++){const d=document.createElement("span");d.className="burst";d.style.background=GCOL[i%6];d.style.left=x+"px";d.style.top=y+"px";document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,rr=60+Math.random()*110;
    d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*rr}px,${Math.sin(a)*rr+40}px) scale(.3)`,opacity:0}],{duration:850,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>d.remove()}}
function shakeEl(el){if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}

/* teams — the same list دروازة uses, so names and scores follow the class between games */
let teams=store.get("teams",null);
if(!Array.isArray(teams)||teams.length<2)teams=DEFNAMES.slice(0,4).map(name=>({name,score:0}));
let turn=0;
const tname=i=>teams[i]?.name||("فريق "+(i+1));
const saveTeams=()=>store.set("teams",teams);
function drawTeams(){const h=$("#teams");if(!h)return;h.innerHTML="";
  teams.forEach((t,i)=>{const d=document.createElement("div");d.className="tm"+(i===turn&&!window.NO_TURN?" on":"");d.style.setProperty("--tc",TCOL[i%8]);
    d.innerHTML=`<span>${esc(tname(i))}</span><b>${t.score}</b><button class="mn" type="button" aria-label="إنقاص نقطة من ${esc(tname(i))}">−</button>`;
    d.querySelector(".mn").onclick=()=>{if(t.score>0){t.score--;saveTeams();tone(330,.08);drawTeams()}};h.appendChild(d)});
  window.onTeams&&window.onTeams()}
function award(i,pts=1){if(!teams[i])return;teams[i].score+=pts;saveTeams();drawTeams()}
function nextTurn(){turn=(turn+1)%teams.length;drawTeams()}
const turnChip=()=>`<span class="turn" style="--tc:${TCOL[turn%8]}">الدور الآن: ${esc(tname(turn))}</span>`;

/* settings sheet: team count, names, reset */
function openSettings(){const s=$("#sheet");s.hidden=false;drawSettings();$("#scl").focus()}
function drawSettings(){$("#tcount").textContent=teams.length;const h=$("#tnames");h.innerHTML="";
  teams.forEach((t,i)=>{const l=document.createElement("label");l.className="tin";l.style.setProperty("--tc",TCOL[i%8]);
    l.innerHTML=`<i></i><input id="tn-${i}" maxlength="24" aria-label="اسم الفريق ${i+1}">`;const inp=l.querySelector("input");inp.value=t.name;
    inp.oninput=()=>{t.name=inp.value;saveTeams();drawTeams()};h.appendChild(l)})}
let gPaused=false;
function setPause(on){gPaused=on;$("#pov").hidden=!on;const b=$("#pz");if(b)b.textContent=on?"▶ متابعة":"⏸ إيقاف مؤقت";tone(on?400:700,.08);if(!on)$("#pgo").blur()}
function kitInit(){
  $("#pz")&&($("#pz").onclick=()=>setPause(!gPaused));$("#pgo").onclick=()=>setPause(false);
  $("#rs").onclick=e=>{const b=e.currentTarget;if(!b.dataset.c){b.dataset.c=1;b.textContent="اضغط مرة ثانية للإعادة";setTimeout(()=>{delete b.dataset.c;b.textContent="↺ إعادة اللعبة"},3000);return}location.reload()};
  $("#snd").onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?"🔊":"🔇";e.currentTarget.setAttribute("aria-label",sound?"إيقاف الصوت":"تشغيل الصوت");if(sound)tone(700,.1)};
  $("#fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
  $("#back").onclick=e=>{e.preventDefault();if(history.length>1)history.back();else location.href="./#"+(G.home||"philosophy")};
  $("#set").onclick=openSettings;
  $("#scl").onclick=()=>{$("#sheet").hidden=true};
  $("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").hidden=true};
  $("#tplus").onclick=()=>{if(teams.length<8){teams.push({name:DEFNAMES[teams.length],score:0});saveTeams();drawTeams();drawSettings();tone(660,.06)}};
  $("#tminus").onclick=()=>{if(teams.length>2){teams.pop();if(turn>=teams.length)turn=0;saveTeams();drawTeams();drawSettings();tone(440,.06)}};
  $("#treset").onclick=e=>{const b=e.currentTarget;if(!b.dataset.c){b.dataset.c=1;b.textContent="اضغط مرة ثانية للتأكيد";setTimeout(()=>{delete b.dataset.c;b.textContent="تصفير النقاط"},3000);return}
    delete b.dataset.c;b.textContent="تصفير النقاط";teams.forEach(t=>t.score=0);saveTeams();drawTeams();tone(500,.1)};
  addEventListener("keydown",e=>{if(e.key==="Escape")$("#sheet").hidden=true;if(e.key===" "&&e.target===document.body&&$("#pz")){e.preventDefault();setPause(!gPaused)}});
  addEventListener("storage",e=>{if(e.key==="darwaza:teams"){const t=store.get("teams",null);if(Array.isArray(t)&&t.length>=2){teams=t;if(turn>=teams.length)turn=0;drawTeams()}}});
  drawTeams();
}
function pickN(a){const s=(typeof G!=="undefined"&&G.pickQ&&a===G.questions)?G.pickQ():shuffle(a);return (typeof G!=="undefined"&&G.limit)?s.slice(0,G.limit):s}
/* Lesson game engines: mcq · sort · tf (bridge) · board */
const PRAISE=["إجابة صحيحة! 🎉","أحسنتم! ✨","رائع! 🌟",(G.home||"philosophy")==="philosophy"?"فكر فلسفي! 🦉":"تفكير عميق! 💡","ممتاز! 👏"];
const praise=()=>PRAISE[Math.random()*PRAISE.length|0];
const ST=()=>$("#stage");
function scrollStage(){ST().scrollIntoView({behavior:reduce()?"auto":"smooth",block:"start"})}

function intro(G,start){
  ST().innerHTML=`<div class="intro hero float">${G.hero||""}</div>
    <div class="intro"><h2>${esc(G.title)}</h2></div>
    <div class="intro"><p>${esc(G.intro)}</p></div>
    <div class="how"><b>🎯 طريقة اللعب</b>${G.how.map(h=>`<span>• ${esc(h)}</span>`).join("")}</div>
    <div class="row"><button class="btn" id="go" type="button">ابدأ اللعب ←</button><button class="btn ghost" id="go2" type="button">⚙ الفرق</button></div>`;
  $("#go").onclick=()=>{chord();start()};$("#go2").onclick=openSettings;
}
function results(G,ok,total,replay){
  const best=Math.max(...teams.map(t=>t.score));
  ST().innerHTML=`<div class="intro"><h2>🏆 انتهت الجولة</h2></div>
    <p class="msg good">أجبتم إجابة صحيحة عن ${ok} من ${total}</p>
    <div class="podium">${teams.map((t,i)=>({t,i})).sort((a,b)=>b.t.score-a.t.score).map(({t,i})=>`<div class="pd${t.score===best&&best>0?" win":""}" style="--tc:${TCOL[i%8]}">${t.score===best&&best>0?"👑":""}<b>${t.score}</b><span>${esc(tname(i))}</span></div>`).join("")}</div>
    <p class="count">النقاط مجموعة من كل ألعاب دروازة. لتصفيرها اضغط ⚙ الفرق.</p>
    <div class="row"><button class="btn" id="again" type="button">↺ العب مرة أخرى</button><a class="btn ghost" href="./#${G.home||"philosophy"}" id="home">→ ${G.homeName||"بوابة الفلسفة"}</a></div>`;
  $("#again").onclick=()=>{tone(660,.06);replay()};
  $("#home").onclick=e=>{e.preventDefault();$("#back").click()};
  const win=teams.filter(t=>t.score===best&&best>0).map(t=>t.name).join(" و ");
  celebrate(win?`الفائز: ${win} 🏆`:"أحسنتم جميعًا! 🏆",true);
}

/* ---------- MCQ ---------- */
function runMCQ(G){
  let Q,i,res;
  function start(){Q=G.order===false?G.questions.slice():pickN(G.questions);i=0;res=[];show()}
  function show(){
    const it=Q[i],opts=G.fixed?G.fixed.slice():shuffle(it.o.map((t,k)=>({t,ok:k===it.a})));
    if(G.fixed)opts.forEach(o=>o.ok=o.t===it.ans);
    ST().innerHTML=`<div class="row"><span class="count">السؤال ${i+1} من ${Q.length}</span>${turnChip()}</div>
      <div class="prog">${Q.map((_,k)=>`<i class="${res[k]||""}${k===i?" now":""}"></i>`).join("")}</div>
      ${G.loot?`<div class="loot" aria-label="${esc(G.loot.label)}">${G.loot.label}: ${res.filter(r=>r==="ok").length?G.loot.icon.repeat(res.filter(r=>r==="ok").length):"—"}</div>`:""}
      ${it.d?`<div class="talk">${it.d.map(([w,s],k)=>`<div class="say ${k%2?"l":"r"}"><b>${esc(w)}</b><span>${esc(s)}</span></div>`).join("")}</div>`:""}
      ${it.e?`<div class="bigemo" aria-hidden="true">${it.e}</div>`:""}<div class="q" id="qq">${esc(it.q)}</div>
      <div class="opts${G.fixed?" fixed":""}" id="opts"></div>
      <div class="msg" id="msg" aria-live="polite"></div><div class="ex" id="ex" hidden></div>

const OCOL=["#2fbf9b","#2f9fe0","#8b7cf6","#f06aa6","#ff7a6b","#e0a100","#16a3a3","#5b46d6"];
/* route map: stops appear and the path is drawn as each step is placed */
function routeCtl(R){
  const svg=$("#rmap svg"),run=svg.querySelector("#rrun"),cap=$("#rcap");let q=Promise.resolve(),shown=-1;
  const st=i=>svg.querySelector(`.rst[data-s="${i}"]`),sg=i=>svg.querySelector(`.rseg[data-s="${i}"]`);
  svg.querySelectorAll(".rseg").forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p._L=L});
  function info(i){cap.innerHTML=`<b>${AR(i+1)}. ${esc(R.stops[i].name)}</b> ${esc(R.stops[i].info)}`;svg.querySelectorAll(".rst").forEach(g=>g.classList.toggle("sel",+g.dataset.s===i))}
  svg.querySelectorAll(".rst").forEach(g=>{const f=()=>{if(g.classList.contains("on")){info(+g.dataset.s);tone(620,.06)}};g.onclick=f;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  function place(i){const c=st(i).querySelector("circle");run.setAttribute("transform",`translate(${c.getAttribute("cx")} ${c.getAttribute("cy")})`);run.classList.add("on")}
  function move(i){return new Promise(res=>{const p=sg(i);if(!p){res();return}const L=p._L,T=reduce()?1:Math.max(900,L*6),t0=performance.now();p.classList.add("on");
    (function f(now){const k=Math.min(1,(now-t0)/T),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;p.style.strokeDashoffset=L*(1-e);const pt=p.getPointAtLength(L*e);run.setAttribute("transform",`translate(${pt.x} ${pt.y})`);
      run.querySelector("text").textContent=p.classList.contains("sea")?"⛵":"🐪";if(k<1)requestAnimationFrame(f);else res()})(t0)})}
  function show(i){const g=st(i);g.classList.add("on","new");setTimeout(()=>g.classList.remove("new"),700);info(i);tone(700+i*80,.12,.08,"triangle")}
  return{reach(i){if(i<=shown)return;const k=i;shown=i;q=q.then(()=>k===0?(place(0),show(0)):move(k).then(()=>show(k)))},
    play(){q=q.then(async()=>{svg.querySelectorAll(".rseg").forEach(p=>{p.style.strokeDashoffset=p._L;p.classList.remove("on")});svg.querySelectorAll(".rst").forEach(g=>g.classList.remove("on"));
      place(0);show(0);for(let i=1;i<R.stops.length;i++){await new Promise(r=>setTimeout(r,450));await move(i);show(i)}})}}
}

      else{$("#msg").className="msg";$("#msg").textContent="هذا هو الترتيب الصحيح"}

const exBox=it=>{if(it.ex){$("#ex").hidden=false;$("#ex").innerHTML=`<small>💡 من الكتاب${it.p?` · ص ${AR(it.p)}`:""}</small>${esc(it.ex)}`}};

/* ===== BALANCE: each right answer puts a weight on «النظام», each wrong one on «الفوضى» ===== */
function runBalance(G){
  let Q,i,res,ord,cha;
  const L=G.left||{n:"النظام والاستقرار",i:"🏛️",c:"#2f9fe0"},Rr=G.right||{n:"الفوضى",i:"🌪️",c:"#ff7a6b"};
  const ang=()=>Math.max(-16,Math.min(16,(ord-cha)*3));
  function weights(n,x,col){let s="";for(let k=0;k<n;k++){const row=Math.floor(k/4),c=k%4;s+=`<g transform="translate(${x-42+c*21+(row%2)*10} ${-14-row*15})"><path d="M2 14h16l-3-12h-10z" fill="${col}" stroke="#1d1b2e" stroke-width="1.5"/><circle cx="10" cy="1" r="3" fill="none" stroke="#1d1b2e" stroke-width="1.5"/></g>`}return s}
  function svg(a){return `<svg viewBox="0 0 600 262" class="bsvg" aria-hidden="true">
    <path d="M300 248V70" stroke="#5a4a7a" stroke-width="12" stroke-linecap="round"/><path d="M220 252h160" stroke="#5a4a7a" stroke-width="14" stroke-linecap="round"/>
    <g id="beam" transform="rotate(${a} 300 69)"><rect x="70" y="62" width="460" height="14" rx="7" fill="#ffc23d" stroke="#a87400" stroke-width="2"/>
      <g transform="translate(110 76)"><path d="M0 0L-50 90M0 0L50 90" stroke="#5a4a7a" stroke-width="2.5"/><g class="pan" transform="rotate(${-a})"><path d="M-70 90h140a70 22 0 0 1-140 0z" fill="${Rr.c}" opacity=".9"/><g transform="translate(0 90)">${weights(cha,0,"#ffd6cf")}</g><text y="134" class="bl">${Rr.i} ${esc(Rr.n)} · ${AR(cha)}</text></g></g>
      <g transform="translate(490 76)"><path d="M0 0L-50 90M0 0L50 90" stroke="#5a4a7a" stroke-width="2.5"/><g class="pan" transform="rotate(${-a})"><path d="M-70 90h140a70 22 0 0 1-140 0z" fill="${L.c}" opacity=".9"/><g transform="translate(0 90)">${weights(ord,0,"#d6ecff")}</g><text y="134" class="bl">${L.i} ${esc(L.n)} · ${AR(ord)}</text></g></g></g>
    <circle cx="300" cy="69" r="16" fill="#ffc23d" stroke="#a87400" stroke-width="3"/><text x="300" y="76" class="bc">⚖️</text></svg>`}
  function start(){Q=pickN(G.questions);i=0;res=[];ord=0;cha=0;show()}
  function show(){

    ST().innerHTML=`<div class="row"><span class="count">السؤال ${AR(i+1)} من ${AR(Q.length)}</span>${turnChip()}</div>
      <div class="bpanel"><div class="bscale" id="bscale">${svg(a0)}</div></div>
      <div class="q" id="qq">${esc(it.q)}</div>
      <div class="bopts" id="opts">${opts.map((o,k)=>`<button class="bw" type="button" data-k="${k}"><span class="bt">${esc(o.t)}</span></button>`).join("")}</div>
      <div class="msg" id="msg" aria-live="polite">⚖️ ضعوا الثقل الصحيح ليميل الميزان نحو النظام</div><div class="ex" id="ex" hidden></div>
      <div class="row"><button class="btn" id="nx" type="button" hidden>${i+1<Q.length?"السؤال التالي ←":"النتيجة 🏆"}</button></div>`;
    ST().querySelectorAll(".bw").forEach(b=>b.onclick=()=>{if(res[i])return;const o=opts[+b.dataset.k];ST().querySelectorAll(".bw").forEach(x=>x.disabled=true);
      if(o.ok){res[i]="ok";ord++;b.classList.add("ok","drop");award(turn,G.pts||1);goodMsg();celebrate(praise())}
      else{res[i]="no";cha++;b.classList.add("no","drop");buzz();ST().querySelectorAll(".bw").forEach((x,k)=>{if(opts[k].ok)x.classList.add("ok")});$("#msg").className="msg bad";$("#msg").textContent="ثقل في كفة الفوضى! الإجابة الصحيحة باللون الأخضر"}
      tone(140,.25,.12,"sine",.25);
      setTimeout(()=>{const bx=$("#bscale");if(!bx)return;bx.innerHTML=svg(a0);const a1=ang(),t0=performance.now(),T=reduce()?1:1100,bm=$("#beam");
        (function f(now){const k=Math.min(1,(now-t0)/T),e=1-Math.pow(1-k,3)*Math.cos(k*Math.PI*1.5),a=a0+(a1-a0)*e;bm.setAttribute("transform",`rotate(${a.toFixed(2)} 300 69)`);bm.querySelectorAll(".pan").forEach(p=>p.setAttribute("transform",`rotate(${(-a).toFixed(2)})`));if(k<1)requestAnimationFrame(f)})(t0)},350);

/* ===== THREADS: each right answer weaves a thread between two people ===== */
function runThreads(G){
  let Q,i,res;
  const P=G.people||["🧑‍🏫","👨‍⚕️","👩‍🎓","👷","👵","🧒","👮","👩‍🍳","🧕","👨‍💼"],NP=P.length,CX=210,CY=200,R=160;
  const pos=k=>{const a=-Math.PI/2+k*2*Math.PI/NP;return [CX+R*Math.cos(a),CY+R*Math.sin(a)]};
  const YC=["#ff7a6b","#ffc23d","#2fbf9b","#8b7cf6","#2f9fe0","#f06aa6","#e0892f","#43b05c"];
  let pairs=[];
  function mkPairs(n){const out=[],seen=new Set();let s=1;while(out.length<n){for(let k=0;k<NP&&out.length<n;k++){const a=k,b=(k+s*2+1)%NP,key=[a,b].sort().join("-");if(!seen.has(key)&&a!==b){seen.add(key);out.push([a,b])}}s++;if(s>NP)break}while(out.length<n)out.push([out.length%NP,(out.length+3)%NP]);return shuffle(out)}
  function web(newk){
    const th=res.map((r,k)=>{if(!r)return"";const [a,b]=pairs[k],[x1,y1]=pos(a),[x2,y2]=pos(b),mx=(x1+x2)/2+(CY-(y1+y2)/2)*.18,my=(y1+y2)/2+((x1+x2)/2-CX)*.18;
      return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" class="thr ${r}${k===newk?" new":""}" style="--yc:${YC[k%YC.length]}" pathLength="100"/>`}).join("");
    const lit=new Set();res.forEach((r,k)=>{if(r==="ok"){lit.add(pairs[k][0]);lit.add(pairs[k][1])}});
    return `<svg viewBox="0 0 420 400" class="tsvg" aria-label="شبكة التفاعل"><circle cx="${CX}" cy="${CY}" r="${R+26}" class="tring"/>${th}
      ${P.map((e,k)=>{const [x,y]=pos(k);return `<g class="tp${lit.has(k)?" lit":""}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="25"/><text x="${x.toFixed(1)}" y="${(y+9).toFixed(1)}">${e}</text></g>`}).join("")}
      <text x="${CX}" y="${CY+8}" class="tcount">${AR(res.filter(r=>r==="ok").length)} 🧶</text></svg>`}
  function start(){Q=pickN(G.questions);i=0;res=[];pairs=mkPairs(Q.length);show()}
  function show(){
    const it=Q[i],opts=shuffle(it.o.map((t,k)=>({t,ok:k===it.a})));
    ST().innerHTML=`<div class="row"><span class="count">الخيط ${AR(i+1)} من ${AR(Q.length)}</span>${turnChip()}</div>
      <div class="twrap"><div class="tweb" id="tweb">${web(-1)}</div>
      <div class="tside"><div class="q" id="qq">${esc(it.q)}</div>
        <div class="topts" id="opts">${opts.map((o,k)=>`<button class="ty" type="button" data-k="${k}" style="--yc:${YC[(i+k)%YC.length]}"><span class="ball"></span><span class="bt">${esc(o.t)}</span></button>`).join("")}</div>
        <div class="msg" id="msg" aria-live="polite">🧶 اختاروا كرة الخيط الصحيحة لتربطوا شخصين في شبكة المجتمع</div><div class="ex" id="ex" hidden></div>
        <div class="row"><button class="btn" id="nx" type="button" hidden>${i+1<Q.length?"الخيط التالي ←":"النتيجة 🏆"}</button></div></div></div>`;
    ST().querySelectorAll(".ty").forEach(b=>b.onclick=()=>{if(res[i])return;const o=opts[+b.dataset.k];ST().querySelectorAll(".ty").forEach(x=>x.disabled=true);
      if(o.ok){res[i]="ok";b.classList.add("ok","pop");award(turn,G.pts||1);goodMsg();celebrate(praise());[440,554,659].forEach((f,k)=>tone(f,.15,.07,"triangle",k*.08))}
      else{res[i]="no";b.classList.add("no");shakeEl(b);buzz();ST().querySelectorAll(".ty").forEach((x,k)=>{if(opts[k].ok)x.classList.add("ok")});$("#msg").className="msg bad";$("#msg").textContent="تشابك الخيط! الإجابة الصحيحة هي الكرة المضيئة"}
      $("#tweb").innerHTML=web(i);exBox(it);$("#nx").hidden=false;$("#nx").focus({preventScroll:true})});
    $("#nx").onclick=()=>{nextTurn();i++;tone(660,.05);if(i<Q.length){show();scrollStage()}else{const ok=res.filter(r=>r==="ok").length;results(G,ok,Q.length,start);
      ST().insertAdjacentHTML("afterbegin",`<div class="tweb fin">${web(-1)}</div><p class="msg good">🕸️ نسجتم ${AR(ok)} ${ok===1?"خيطًا":"خيوط"} في شبكة التفاعل الاجتماعي!</p>`)}};
  }
  intro(G,start);
}

      exBox(it);$("#nx").hidden=false;$("#nx").focus({preventScroll:true})});

/* ===== DESERT (mcq): every right answer lights a star over Ibn Khaldun's tent ===== */
function runDesert(G){
  let Q,i,res;
  const ST8=[[70,40],[130,70],[190,34],[250,62],[310,30],[370,58],[430,36],[490,66],[550,40],[100,110],[220,100],[340,96],[460,104],[560,96],[40,84],[280,120]];
  function sky(newk){const ok=res.filter(r=>r==="ok").length,lit=ST8.slice(0,ok);
    const lines=lit.slice(1).map((p,k)=>`<path d="M${lit[k][0]} ${lit[k][1]}L${p[0]} ${p[1]}" class="dline"/>`).join("");
    const f=Math.min(1.6,.6+ok*.08);
    return `<svg viewBox="0 0 600 270" class="dsvg" aria-hidden="true"><defs><linearGradient id="dsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1440"/><stop offset=".7" stop-color="#3a2a6b"/><stop offset="1" stop-color="#b8607a"/></linearGradient>
      <radialGradient id="dfire"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffb703"/><stop offset="1" stop-color="#ff5d3d" stop-opacity="0"/></radialGradient></defs>
      <rect width="600" height="270" fill="url(#dsk)"/><circle cx="530" cy="40" r="20" fill="#fff3c4"/><circle cx="539" cy="34" r="17" fill="#0c1440"/>
      ${ST8.map(([x,y],k)=>`<circle cx="${x}" cy="${y}" r="1.6" fill="#fff" opacity=".35"/>`).join("")}${lines}
      ${lit.map(([x,y],k)=>`<g class="dstar${k===ok-1&&newk?" new":""}" transform="translate(${x} ${y})"><path d="M0 -9L2.6 -2.8 9 -2.8 3.8 1.2 5.6 8 0 4 -5.6 8 -3.8 1.2 -9 -2.8 -2.6 -2.8Z"/></g>`).join("")}
      <path d="M0 210 Q120 170 260 200 T600 190 V270 H0Z" fill="#c98a4e"/><path d="M0 235 Q160 205 330 232 T600 226 V270 H0Z" fill="#a8693a"/>
      <g transform="translate(150 150)"><path d="M0 70 L80 0 L160 70Z" fill="#f0e1c0" stroke="#7a5536" stroke-width="3"/><path d="M80 0 L60 70 H100Z" fill="#3a2218"/><path d="M-6 70h172" stroke="#7a5536" stroke-width="4"/><path d="M80 0v-12" stroke="#7a5536" stroke-width="3"/></g>
      <g transform="translate(400 222)"><ellipse rx="${40*f}" ry="${30*f}" cy="-10" fill="url(#dfire)" class="dglow"/><path d="M-16 6l32-8M-16 -2l32 8" stroke="#5e3b24" stroke-width="5" stroke-linecap="round"/>
        <path class="dflame" d="M0 ${-34*f} C${12*f} ${-18*f} ${14*f} -4 0 2 C${-14*f} -4 ${-12*f} ${-18*f} 0 ${-34*f}Z" fill="#ffb703"/></g>
      <text x="300" y="262" class="dcount">${AR(ok)} ⭐</text></svg>`}
  function start(){Q=pickN(G.questions);i=0;res=[];show()}
  function show(){
    const it=Q[i],opts=shuffle(it.o.map((t,k)=>({t,ok:k===it.a})));
    ST().innerHTML=`<div class="row"><span class="count">الليلة ${AR(i+1)} من ${AR(Q.length)}</span>${turnChip()}</div>
      <div class="dbox" id="dbox">${sky(false)}</div><div class="q" id="qq">${esc(it.q)}</div>
      <div class="drugs">${opts.map((o,k)=>`<button class="drug" type="button" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
      <div class="msg" id="msg" aria-live="polite">⭐ كل إجابة صحيحة تضيء نجمة في سماء البادية</div><div class="ex" id="ex" hidden></div>${nxBtn(i,Q.length,"الليلة التالية ←","النتيجة 🏆")}`;
    ST().querySelectorAll(".drug").forEach(b=>b.onclick=()=>{if(res[i])return;const o=opts[+b.dataset.k];ST().querySelectorAll(".drug").forEach(x=>x.disabled=true);
      if(o.ok){res[i]="ok";b.classList.add("ok","pop");award(turn,G.pts||1);goodMsg();celebrate(praise());[784,988,1175].forEach((f,k)=>tone(f,.25,.05,"sine",k*.1))}
      else{res[i]="no";b.classList.add("no");shakeEl(b);buzz();ST().querySelectorAll(".drug").forEach((x,k)=>{if(opts[k].ok)x.classList.add("ok")});badMsg("انطفأت النجمة! الإجابة الصحيحة باللون الأخضر")}
      $("#dbox").innerHTML=sky(o.ok);exBox(it);showNx()});
    $("#nx").onclick=()=>{nextTurn();i++;tone(660,.05);if(i<Q.length){show();scrollStage()}else{const ok=res.filter(r=>r==="ok").length;results(G,ok,Q.length,start);ST().insertAdjacentHTML("afterbegin",`<div class="dbox">${sky(false)}</div><p class="msg good">🌌 أضأتم ${AR(ok)} ${ok===1?"نجمة":ok===2?"نجمتين":ok>=3&&ok<=10?"نجوم":"نجمة"} في سماء خيمة ابن خلدون</p>`)}};
  }
  intro(G,start);
}

/* ===== FIXEDPICK (mcq with fixed choices): skins majlis / bag / motors ===== */
function runFixedPick(G){
  let Q,i,res,won;const skin=G.skin||"majlis",F=G.fixed;
  function head(){
    if(skin==="motors"){const ok=res.filter(r=>r==="ok").length,n=Q.length,x=k=>40+k*(520/n);
      return `<svg viewBox="0 0 600 120" class="mtrack" aria-hidden="true"><rect width="600" height="120" rx="18" fill="#1f2a44"/><path d="M30 92H570" stroke="#8a95b8" stroke-width="6"/>
        ${Array.from({length:n+1},(_,k)=>`<path d="M${x(k)} 84v16" stroke="#8a95b8" stroke-width="4"/><circle cx="${x(k)}" cy="92" r="${k<=ok?7:5}" fill="${k<=ok?"#ffc23d":"#4a5578"}"/>`).join("")}
        <text x="${x(0)}" y="40" class="mtl">🏚️</text><text x="${x(n)}" y="40" class="mtl">🏙️</text><g class="mtrain" style="transform:translateX(${x(ok)-30}px)"><text x="-30" y="80" class="mtl big" transform="scale(-1 1)">🚂</text></g></svg>`}
    return ""}
  function card(f,k){
    if(skin==="majlis")return `<button class="mj" type="button" data-k="${k}"><span class="mjav">${f.icon}</span><b>${esc(f.t)}</b><span class="mjm">${won[k]?"🏅".repeat(Math.min(won[k],5)):"&nbsp;"}</span><span class="mjchair"></span></button>`;
    if(skin==="radar")return `<button class="rd" type="button" data-k="${k}"><span class="rdl"></span><span class="rdi">${f.icon}</span><b>${esc(f.t)}</b><em>${won[k]?AR(won[k]):""}</em></button>`;
    if(skin==="court")return `<button class="ct" type="button" data-k="${k}"><span class="cti">${f.icon}</span><b>${esc(f.t)}</b><em>${won[k]?"⚖️".repeat(Math.min(won[k],4)):""}</em><span class="stampg">مُدانة!</span></button>`;
    if(skin==="bag")return `<button class="bg" type="button" data-k="${k}"><span class="bgi">${f.icon}</span><b>${esc(f.t)}</b><em>${won[k]?AR(won[k]):""}</em></button>`;
    return `<button class="mo" type="button" data-k="${k}"><svg viewBox="0 0 100 100" class="gear" aria-hidden="true"><path d="${gearPath()}"/><circle cx="50" cy="50" r="22" class="gin"/></svg><span class="moi">${f.icon}</span><b>${esc(f.t)}</b><em>${won[k]?AR(won[k]):""}</em></button>`}
  function gearPath(){let d="";for(let k=0;k<10;k++){const a0=k*36,a1=a0+18,p=(a,r)=>`${(50+r*Math.cos(a*Math.PI/180)).toFixed(1)} ${(50+r*Math.sin(a*Math.PI/180)).toFixed(1)}`;d+=(k?"L":"M")+p(a0-4,46)+"L"+p(a0+4,46)+"L"+p(a1-3,38)+"L"+p(a1+21,38)}return d+"Z"}
  function start(){Q=pickN(G.questions);i=0;res=[];won=F.map(()=>0);show()}
  function show(){
    const it=Q[i];
    ST().innerHTML=`<div class="row"><span class="count">${skin==="majlis"?"المجلس":skin==="bag"?"المهمة":skin==="court"?"القضية":skin==="radar"?"الرصد":"المحطة"} ${AR(i+1)} من ${AR(Q.length)}</span>${turnChip()}</div>
      <div class="fp ${skin}">${skin==="court"?`<div class="bench"><span class="judge">🧑‍⚖️</span><span class="gavel">🔨</span><span class="scales">⚖️</span></div>`:""}${head()}${skin==="radar"?`<div class="radar"><div class="rscreen"><span class="sweep"></span><span class="blip b1"></span><span class="blip b2"></span><span class="blip b3"></span><span class="rlabel">🏛️ مجلس الأمة يراقب</span></div></div>`:""}${(skin==="court"||skin==="radar")&&it.d?`<div class="witness"><div class="wlabel">${skin==="radar"?"📡 ما رصده الرادار":"📂 أقوال القضية"}</div>${it.d.map(([w,t],k)=>{const sp=[...new Set(it.d.map(x=>x[0]))].indexOf(w);return `<div class="wsay ${sp%2?"l":"r"}"><span class="wav">${skin==="radar"?"📋":["🧔","🧑","👩","👨‍🦳"][sp%4]}</span><div><b>${esc(w)}</b><p>${esc(t)}</p></div></div>`}).join("")}</div>`:""}<div class="fpq ${skin}">${skin==="majlis"?"📜":skin==="bag"?"🧳":skin==="court"?"🧑‍⚖️":skin==="radar"?"📡":"⚙️"} <span class="q" id="qq">${esc(it.q)}</span></div>
        <div class="fpopts ${skin}" style="--n:${F.length}">${F.map(card).join("")}</div></div>
      <div class="msg" id="msg" aria-live="polite">${esc(G.ask||(skin==="majlis"?"من صاحب هذه الفكرة؟ اختاروا الرائد من المجلس":skin==="bag"?"أي أداة تخرجونها من حقيبة الباحث؟":skin==="court"?"🔨 أي مغالطة ارتكبها المتهم؟ أصدروا الحكم":skin==="radar"?"📡 أي أداة رقابية يصفها الموقف؟":"أي محرك يدفع هذا التغير؟"))}</div><div class="ex" id="ex" hidden></div>
      ${nxBtn(i,Q.length,"التالي ←","النتيجة 🏆")}`;
    const bs=[...ST().querySelectorAll(".fpopts button")];
    bs.forEach(b=>b.onclick=()=>{if(res[i])return;const k=+b.dataset.k,right=F.findIndex(f=>f.t===it.ans);bs.forEach(x=>x.disabled=true);
      if(k===right){res[i]="ok";won[k]++;b.classList.add("ok","go");award(turn,G.pts||1);goodMsg();celebrate(praise());burstAt(b,26)}
      else{res[i]="no";b.classList.add("no");shakeEl(b);buzz();bs[right].classList.add("ok","go");badMsg(`الإجابة الصحيحة: ${it.ans}`)}
      if(skin==="motors"){const h=ST().querySelector(".mtrack");if(h)h.outerHTML=head();if(k===right){tone(110,.3,.08,"sawtooth");tone(165,.3,.06,"sawtooth",.15)}}
      if(skin==="majlis"&&k===right)tone(523,.3,.06,"triangle");
      if(skin==="court"){if(k===right){tone(523,.15,.06,"triangle");tone(784,.2,.06,"triangle",.12)}const gv=ST().querySelector(".gavel");if(gv){gv.classList.remove("hit");void gv.offsetWidth;gv.classList.add("hit")}}
      exBox(it);showNx()});
    $("#nx").onclick=()=>{nextTurn();i++;tone(660,.05);if(i<Q.length){show();scrollStage()}else{results(G,res.filter(r=>r==="ok").length,Q.length,start);
      const top=F.map((f,k)=>`<span class="fpw">${f.icon} ${esc(f.t)}: <b>${AR(won[k])}</b></span>`).join("");ST().insertAdjacentHTML("afterbegin",`<div class="fpsum">${top}</div>`)}};
  }
  intro(G,start);
}

/* ===== TREE (sort): every card becomes a leaf on its branch ===== */
function runTree(G){
  let C,i,okN,leaves;const n=G.bins.length;
  const BR=[[300,250,120,150],[300,215,480,140],[300,180,150,70],[300,160,455,62],[300,140,300,40]].slice(0,n);
  function tree(newk){
    return `<svg viewBox="0 0 600 380" class="tsv" aria-label="شجرة الفروع"><rect width="600" height="380" rx="20" fill="#e8f7ff"/><circle cx="520" cy="60" r="34" fill="#ffe28a"/>
      <path d="M0 340 Q300 310 600 340 V380 H0Z" fill="#8fd18f"/>
      <path d="M280 345 C285 280 290 220 300 120 C310 220 315 280 320 345Z" fill="#8a5a3b"/>
      ${BR.map(([x0,y0,x1,y1],k)=>{const b=G.bins[k],mx=(x0+x1)/2,my=Math.min(y0,y1)-30;
        const lv=leaves.filter(l=>l.k===k).map((l,j)=>{const t=.35+(j%6)*.11,u=1-t,lx=u*u*x0+2*u*t*mx+t*t*x1,ly=u*u*y0+2*u*t*my+t*t*y1,off=(j%2?1:-1)*(10+Math.floor(j/6)*12);
          return `<g class="leaf${l.ok?"":" dry"}${l.new?" new":""}" transform="translate(${lx.toFixed(1)} ${(ly+off).toFixed(1)}) rotate(${(j*47)%360})"><path d="M0 0C6 -10 18 -10 22 0C18 10 6 10 0 0Z"/></g>`}).join("");
        return `<g class="tbr" data-k="${k}" role="button" tabindex="0" aria-label="${esc(b.name)}" style="--bc:${b.color}"><path d="M${x0} ${y0}Q${mx} ${my} ${x1} ${y1}" class="bline"/>${lv}
          <g transform="translate(${x1} ${y1+(y1<100?-6:28)})"><rect x="-62" y="-20" width="124" height="34" rx="17" class="btag"/><text y="4" class="btxt">${b.icon} ${esc(b.name)}</text></g></g>`}).join("")}
      <text x="300" y="368" class="troot">${esc(G.rootLabel||"علم الاجتماع")}</text></svg>`}
  function start(){C=pickN(G.cards);i=0;okN=0;leaves=[];show()}
  function show(){
    const it=C[i];let done=false;leaves.forEach(l=>l.new=false);
    ST().innerHTML=`<div class="row"><span class="count">الورقة ${AR(i+1)} من ${AR(C.length)}</span>${turnChip()}</div>
      <div class="tleaf"><span>🍃</span><div class="q">${esc(it.t)}</div></div>
      <div class="msg" id="msg" aria-live="polite">${esc(G.ask||"علّقوا الورقة على الفرع الصحيح")}</div>
      <div class="tbox" id="tbox">${tree()}</div>
      <div class="tchips">${G.bins.map((b,k)=>`<button class="tchip" type="button" data-k="${k}" style="--bc:${b.color}">${b.icon} ${esc(b.name)}</button>`).join("")}</div>
      <div class="ex" id="ex" hidden></div>${nxBtn(i,C.length,"الورقة التالية ←","النتيجة 🏆")}`;
    const pick=k=>{if(done)return;done=true;const right=G.bins.findIndex(b=>b.id===it.bin),ok=k===right;leaves.push({k:right,ok,new:true});
      $("#tbox").innerHTML=tree();ST().querySelectorAll(".tchip").forEach(x=>x.disabled=true);ST().querySelector(`.tchip[data-k="${right}"]`).classList.add("ok");
      if(ok){okN++;award(turn,G.pts||1);goodMsg();celebrate(praise());tone(880,.12,.06,"sine");tone(1175,.15,.05,"sine",.1)}
      else{ST().querySelector(`.tchip[data-k="${k}"]`).classList.add("no");buzz();badMsg(`مكانها الصحيح: فرع ${G.bins[right].name} (ورقة ذابلة 🍂)`)}
      exBox(it);showNx()};
    ST().querySelectorAll(".tchip").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    const bindT=()=>ST().querySelectorAll(".tbr").forEach(g=>{g.onclick=()=>pick(+g.dataset.k);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(+g.dataset.k)}}});bindT();
    $("#nx").onclick=()=>{nextTurn();i++;tone(660,.05);if(i<C.length){show();scrollStage()}else{results(G,okN,C.length,start);ST().insertAdjacentHTML("afterbegin",`<div class="tbox">${tree()}</div><p class="msg good">🌳 أثمرت شجرة الفروع: ${AR(okN)} ورقة خضراء</p>`)}};
  }
  intro(G,start);
}

/* ===== STONES (tf): hop across the river on stepping stones ===== */
function runStones(G){
  let S,i,res;
  function river(hop){const n=S.length,x=k=>470-k*(340/(n-1||1)),done=res.length,pos=done===0?540:x(done-1);
    return `<svg viewBox="0 0 600 200" class="rsv" aria-hidden="true"><rect width="600" height="200" fill="#bfe6ff"/>
      <path d="M100 0 C130 60 90 130 115 200 H485 C510 130 470 60 500 0Z" fill="#3fa9e0"/><g class="waves" stroke="#fff" stroke-width="2.5" fill="none" opacity=".55"><path d="M140 40q10 -6 20 0t20 0"/><path d="M300 150q10 -6 20 0t20 0"/><path d="M400 60q10 -6 20 0t20 0"/><path d="M220 100q10 -6 20 0t20 0"/></g>
      <path d="M0 0H105C80 70 125 140 100 200H0Z" fill="#8fd18f"/><path d="M600 0H495C520 70 475 140 500 200H600Z" fill="#8fd18f"/>
      <text x="550" y="40" class="rbank">${esc(G.banks?G.banks[0]:"البداية")}</text><text x="50" y="40" class="rbank">${esc(G.banks?G.banks[1]:"النهاية")}</text><text x="50" y="120" class="remo">🏁</text>
      ${S.map((_,k)=>{const r=res[k];return `<ellipse cx="${x(k).toFixed(1)}" cy="${120+(k%2?-14:14)}" rx="15" ry="9" class="stone ${r||"todo"}${k===done-1&&hop?" new":""}"/>`}).join("")}
      <g class="walker${hop?" hop":""}" style="transform:translate(${pos.toFixed(1)}px,${done===0?118:120+((done-1)%2?-14:14)-6}px)"><text class="remo" y="-4">🧑‍🎓</text></g>
      ${hop==="no"?`<g class="splash" transform="translate(${pos.toFixed(1)} ${120+((done-1)%2?-14:14)})"><circle r="18" fill="none" stroke="#fff" stroke-width="3"/><circle r="30" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/></g>`:""}</svg>`}
  function start(){S=pickN(G.items);i=0;res=[];show()}
  function show(){
    const it=S[i];
    ST().innerHTML=`<div class="row"><span class="count">الحجر ${AR(i+1)} من ${AR(S.length)}</span>${turnChip()}</div>
      <div class="rbox" id="rbox">${river(false)}</div><div class="q" id="qq">${esc(it.t)}</div>
      <div class="row tf"><button class="tfb yes" id="ty" type="button">✔ صح</button><button class="tfb nope" id="tn" type="button">✘ خطأ</button></div>
      <div class="msg" id="msg" aria-live="polite">🪨 كل حكم صحيح يضع حجرًا ثابتًا في النهر</div><div class="ex" id="ex" hidden></div>${nxBtn(i,S.length,"الحجر التالي ←","النتيجة 🏆")}`;
    const pick=(v,b)=>{if(res[i])return;$("#ty").disabled=$("#tn").disabled=true;const ok=v===it.v;res[i]=ok?"ok":"no";
      if(ok){award(turn,G.pts||1);b.classList.add("ok","pop");goodMsg();celebrate(praise());tone(500,.08,.08,"triangle");tone(750,.1,.08,"triangle",.12)}
      else{b.classList.add("no");shakeEl(b);buzz();tone(300,.4,.05,"sine",.1);badMsg(`العبارة ${it.v?"صحيحة":"خاطئة"}، فاهتز الحجر وتبلل الباحث 💦`)}
      $("#rbox").innerHTML=river(ok?"ok":"no");
      const ex=it.v?it.ex:(it.fix?`التصحيح: ${it.fix}`:it.ex);if(ex){$("#ex").hidden=false;$("#ex").innerHTML=`<small>💡 من الكتاب${it.p?` · ص ${AR(it.p)}`:""}</small>${esc(ex)}`}showNx()};
    $("#ty").onclick=e=>pick(true,e.currentTarget);$("#tn").onclick=e=>pick(false,e.currentTarget);
    $("#nx").onclick=()=>{nextTurn();i++;tone(660,.05);if(i<S.length){show();scrollStage()}else{const ok=res.filter(r=>r==="ok").length;results(G,ok,S.length,start);ST().insertAdjacentHTML("afterbegin",`<p class="msg good">🌉 عبرتم النهر من ${esc(G.banks?G.banks[0]:"")} إلى ${esc(G.banks?G.banks[1]:"")}: ${AR(ok)} حجرًا ثابتًا</p>`)}};
  }
  intro(G,start);
}

/* ===== STAIRS (order): place the steps and the researcher climbs to the results flag ===== */
function runStairs(G){
  let ri,okN;
  function stairs(r,filled,hop){const n=r.steps.length,W=560/n,H=170/n;
    return `<svg viewBox="0 0 600 230" class="ssv" aria-hidden="true"><rect width="600" height="230" rx="18" fill="#fff4ec"/>
      ${r.steps.map((_,k)=>{const x=580-(k+1)*W,y=210-(k+1)*H;return `<g class="sst${k<filled?" on":""}${k===filled-1&&hop?" new":""}" style="--sc:${GCOL[k%6]}"><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(W+1).toFixed(1)}" height="${(210-y).toFixed(1)}" rx="4"/><text x="${(x+W/2).toFixed(1)}" y="${(y+24).toFixed(1)}" class="snum">${AR(k+1)}</text></g>`}).join("")}
      <text x="${(580-n*W+14).toFixed(1)}" y="${(210-n*H-8).toFixed(1)}" class="sflag">🚩</text>
      <g class="sclimb" style="transform:translate(${(filled?580-filled*W+W/2:592).toFixed(1)}px,${(filled?210-filled*H:206).toFixed(1)}px)"><text class="semo" y="-2">🧑‍🔬</text></g></svg>`}
  function start(){ri=0;okN=0;show()}
  function show(){
    const r=G.rounds[ri],n=r.steps.length;let step=0,mist=0,done=false;const cards=shuffle(r.steps.map((t,i)=>({t,i})));
    ST().innerHTML=`<div class="row"><span class="count">الصعود ${AR(ri+1)} من ${AR(G.rounds.length)}</span>${turnChip()}</div>
      <div class="hint">${esc(r.title)}</div><div class="sbox" id="sbox">${stairs(r,0)}</div>
      <div class="slist" id="os">${r.steps.map((_,k)=>`<div class="sl" style="--sc:${GCOL[k%6]}"><em>${AR(k+1)}</em><span>…</span></div>`).join("")}</div>
      <div class="otray" id="ot">${cards.map(c=>`<button class="ocard" type="button" data-i="${c.i}">${esc(c.t)}</button>`).join("")}</div>
      <div class="msg" id="msg" aria-live="polite">اضغطوا على الخطوات بالترتيب ليصعد الباحث درجة درجة</div><div class="ex" id="ex" hidden></div>

/* ===== RINGS (sort): circles of socialization around the child ===== */

        <text x="210" y="${(210-r+RW*.62).toFixed(1)}" class="rgt">${b.icon} ${esc(b.name)}</text></g>`}).join("")}
      ${dots.map((d,j)=>{const r=R0+(d.k+.5)*RW,a=d.a,x=210+r*Math.cos(a),y=210+r*Math.sin(a);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" class="rgd${d.ok?"":" no"}${d.new?" new":""}" style="--bc:${G.bins[d.k].color}"/>`}).join("")}
      <circle cx="210" cy="210" r="${R0-4}" class="rgcore"/><text x="210" y="224" class="rgchild">🧒</text></svg>`}

      <div class="rgwrap"><div class="rgbox" id="rgbox">${rings()}</div>
        <div class="rgside"><div class="rgcard"><small>🌀 أي دائرة من دوائر التنشئة؟</small><div class="q">${esc(it.t)}</div></div>
          <div class="rgchips">${G.bins.map((b,k)=>`<button class="rgchip" type="button" data-k="${k}" style="--bc:${b.color}">${b.icon} ${esc(b.name)}</button>`).join("")}</div>
          <div class="msg" id="msg" aria-live="polite">اضغطوا على الدائرة الصحيحة حول الطفل</div><div class="ex" id="ex" hidden></div>${nxBtn(i,C.length,"البطاقة التالية ←","النتيجة 🏆")}</div></div>`;
    const pick=k=>{if(done)return;done=true;const right=G.bins.findIndex(b=>b.id===it.bin),ok=k===right;dots.push({k:right,ok,a:Math.random()*Math.PI*2,new:true});
      $("#rgbox").innerHTML=rings();bind();ST().querySelectorAll(".rgchip").forEach(x=>x.disabled=true);ST().querySelector(`.rgchip[data-k="${right}"]`).classList.add("ok");
      const ring=ST().querySelector(`.rg[data-k="${right}"]`);ring.classList.add("pulse");
      if(ok){okN++;award(turn,G.pts||1);goodMsg();celebrate(praise());tone(523,.3,.06,"sine");tone(784,.3,.05,"sine",.12)}
      else{ST().querySelector(`.rgchip[data-k="${k}"]`).classList.add("no");buzz();badMsg(`الدائرة الصحيحة: ${G.bins[right].name}`)}
      exBox(it);showNx()};
    function bind(){ST().querySelectorAll(".rg").forEach(g=>{g.onclick=()=>pick(+g.dataset.k);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(+g.dataset.k)}}})}
    bind();ST().querySelectorAll(".rgchip").forEach(b=>b.onclick=()=>pick(+b.dataset.k));

/* ---------- creative engines 3 (philosophy): temple, pans, arch, doors, fog, chalk, glasses, workshop, lens ---------- */
const optsOf=(it,G)=>{if(G&&G.fixed&&!it.o){const F=G.fixed.map(f=>f.t),pool=F.length<=4?F:[it.ans,...shuffle(F.filter(t=>t!==it.ans)).slice(0,3)];return shuffle(pool.map(t=>({t,ok:t===it.ans})))}return shuffle(it.o.map((t,k)=>({t,ok:k===it.a})))};

      ${Array.from({length:Math.round(f*10)},(_,k)=>`<text x="${60+k*52}" y="${70+(k%3)*40}" class="fgq">؟</text>`).join("")}
      <text x="300" y="30" class="fgl">${ok===n?"اليقين ☀️":"الشك يتبدد: "+AR(Math.round((1-f)*100))+"٪"}</text></svg>`};
  tfLoop(G,"الخطوة",(res,S,i,it)=>`<div class="fgbox" id="fgbox">${fog(res,S)}</div><div class="q" id="qq">${esc(it.t)}</div>`,

/* CHALK: write each idea in chalk on John Locke's blank slate */

/* WORKSHOP: a crate rolls on Dewey's conveyor; send it to the right machine */

/* LENS: a magnifying lens follows the pointer over the answer words */
function runLens(G){

/* ATOMS: Russell's analysis — every right answer adds a glowing atom to the molecule seen through the lens */
function atomsSVG(res,n,newk){
  const pos=k=>{const a=k*2.4,r=18+Math.sqrt(k)*24;return [300+r*Math.cos(a),140+r*Math.sin(a)*.82]};
  const AC=["#ff5d8f","#ffc23d","#2fd3e8","#7df0b0","#b58bff","#ff9a3d"];
  let bonds="",atoms="";
  for(let k=0;k<res.length;k++){const [x,y]=pos(k);
    if(k>0){const [px,py]=pos(k-1);bonds+=`<path d="M${px.toFixed(1)} ${py.toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}" class="abond${res[k]==="ok"?"":" no"}"/>`}
    if(k>2&&res[k]==="ok"){const [qx,qy]=pos(k-3);bonds+=`<path d="M${qx.toFixed(1)} ${qy.toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}" class="abond thin"/>`}
    const c=AC[k%AC.length];
    atoms+=`<g class="atom${res[k]==="ok"?"":" no"}${k===newk?" new":""}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="${res[k]==="ok"?13:8}" fill="${res[k]==="ok"?c:"#4a5578"}"/>${res[k]==="ok"?`<circle r="13" fill="none" stroke="${c}" class="orb"/><circle r="3.5" cx="-4" cy="-4" fill="#fff" opacity=".7"/>`:""}</g>`}
  const ok=res.filter(r=>r==="ok").length;
  return `<svg viewBox="0 0 600 290" class="atsv" aria-hidden="true"><defs><radialGradient id="atbg" cx="50%" cy="45%"><stop offset="0" stop-color="#2b3a73"/><stop offset="1" stop-color="#0b1226"/></radialGradient>
    <radialGradient id="atgl" cx="38%" cy="32%"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".5" stop-color="#9fd3ff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <clipPath id="atclip"><circle cx="300" cy="140" r="122"/></clipPath></defs>
    <rect width="600" height="290" rx="22" fill="#0b1226"/>
    ${Array.from({length:40},(_,k)=>`<circle cx="${(k*137)%600}" cy="${(k*71)%290}" r="${k%3?1:1.6}" fill="#fff" opacity=".35"/>`).join("")}
    <path d="M388 228 L470 288" stroke="#ffc23d" stroke-width="22" stroke-linecap="round"/><path d="M388 228 L470 288" stroke="#a87400" stroke-width="6" stroke-linecap="round" opacity=".5"/>
    <circle cx="300" cy="140" r="122" fill="url(#atbg)"/><g clip-path="url(#atclip)">${bonds}${atoms}</g>
    <circle cx="300" cy="140" r="122" fill="url(#atgl)"/><circle cx="300" cy="140" r="126" fill="none" stroke="#ffc23d" stroke-width="10"/><circle cx="300" cy="140" r="119" fill="none" stroke="#fff" stroke-width="2" opacity=".4"/>
    <text x="70" y="60" class="atl">⚛️ ${AR(ok)}</text><text x="70" y="84" class="ats">ذرّة منطقية</text>
    <text x="530" y="60" class="atl">${AR(res.length)}/${AR(n)}</text><text x="530" y="84" class="ats">عبارة محللة</text></svg>`}
function runAtoms(G){
  mcqLoop(G,"التحليل",{hint:"🔬 حللوا العبارة: كل إجابة صحيحة تضيف ذرّة مضيئة إلى الجزيء تحت العدسة",
    top:(res,Q,i,it)=>`<div class="atbox" id="atbox">${atomsSVG(res,Q.length,-1)}</div><div class="atq"><span class="atqi">🔬</span><div class="q" id="qq">${esc(it.q)}</div></div><div class="hexes" id="opts"></div>`,
    opts:o=>{const HC=["#ff5d8f","#2fd3e8","#ffc23d","#b58bff"];$("#opts").innerHTML=o.map((x,k)=>`<button class="hex" type="button" data-o="${k}" style="--hc:${HC[k%4]}"><span>${esc(x.t)}</span></button>`).join("")}},
    (res,Q,i,ok)=>{$("#atbox").innerHTML=atomsSVG(res,Q.length,i);if(ok)[660,880,1320].forEach((f,k)=>tone(f,.12,.06,"sine",k*.07));else tone(160,.3,.06,"sine")},
    (res,Q,ok)=>`<div class="atbox">${atomsSVG(res,Q.length,-1)}</div><p class="msg good">⚛️ اكتمل جزيء التحليل: ${AR(ok)} ذرّة مضيئة من ${AR(Q.length)}</p>`)}
/* ---------- creative engines 4 (philosophy unit 2): chain, timemachine, haunt, crypt, space, mine, court ---------- */

/* CHAIN: forge the missing link */
function chainSVG(res,n,newk){const W=540/n;
  return `<svg viewBox="0 0 600 150" class="chsv" aria-hidden="true"><rect width="600" height="150" rx="20" fill="#1c1630"/>

    ${Array.from({length:n},(_,k)=>{const x=570-k*W-W/2,r=res[k],v=k%2;return `<g class="lnk ${r||"todo"}${k===newk?" new":""}" transform="translate(${x.toFixed(1)} 75)"><rect x="${(-W*.62).toFixed(1)}" y="${v?-14:-24}" width="${(W*1.24).toFixed(1)}" height="${v?28:48}" rx="${v?14:24}"/></g>`}).join("")}
    ${res.length<n?`<g transform="translate(${(570-res.length*W-W/2).toFixed(1)} 75)" class="lgap"><circle r="22"/><text y="8">؟</text></g>`:""}</svg>`}
function runChain(G){mcqLoop(G,"الحلقة",{hint:"⛓️ اختاروا الحلقة الصحيحة لتكملوا سلسلة التفكير",
  top:(res,Q,i,it)=>`<div class="chbox" id="chbox">${chainSVG(res,Q.length,-1)}</div><div class="q" id="qq">${esc(it.q)}</div><div class="chopts" id="opts"></div>`,

  (res,Q,ok)=>`<div class="chbox">${chainSVG(res,Q.length,-1)}</div><p class="msg good">⛓️ صنعتم ${AR(ok)} حلقة ذهبية في سلسلة التفكير</p>`)}

/* TIME MACHINE: send each capsule to its era */
function runTimeMachine(G){
  sortLoop(G,"الكبسولة",(it,log)=>`<div class="tmach"><div class="portal" id="portal"><i></i><i></i><i></i><span class="cap">🧪</span></div>

    (it,log,k,right,ok)=>{const es=ST().querySelectorAll(".era");$("#portal").classList.add("warp");es[right].classList.add("ok","land");es[right].querySelector("em").textContent=AR(log.filter(l=>l.k===right).length);if(!ok)es[k].classList.add("no");
      for(let j=0;j<12;j++)tone(300+j*90,.06,.05,"sawtooth",j*.05)},
    (log,ok)=>`<p class="msg good">⏳ عادت آلة الزمن: ${AR(ok)} كبسولة وصلت إلى عصرها الصحيح</p>`)}

/* HAUNT: abandoned house — each right answer chases a ghost of superstition away */

function pyrSVG(res,n,last){const ok=res.filter(r=>r==="ok").length,rows=5;let bricks="",k=0;

/* ---------- creative engines 5 (constitution): drag & drop, word order, voyage, ballot, pyramid, columns ---------- */
/* generic pointer drag: el follows the finger; drop on an element matching sel */
function dragify(el,sel,onDrop,onTap){
  let sx=0,sy=0,moved=false,on=false,hot=null;
  el.style.touchAction="none";
  el.addEventListener("pointerdown",e=>{if(el.disabled||el.dataset.lock)return;on=true;moved=false;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add("drag")});
  el.addEventListener("pointermove",e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-8,Math.min(8,dx/20))}deg) scale(1.05)`;
    el.style.pointerEvents="none";const t=document.elementFromPoint(e.clientX,e.clientY)?.closest(sel);el.style.pointerEvents="";
    if(hot!==t){hot&&hot.classList.remove("hover");hot=t;hot&&hot.classList.add("hover")}});
  const end=e=>{if(!on)return;on=false;el.classList.remove("drag");hot&&hot.classList.remove("hover");
    const t=hot;hot=null;
    if(moved&&t){onDrop(t,el)}else{el.style.transition="transform .35s cubic-bezier(.3,1.5,.5,1)";el.style.transform="";setTimeout(()=>el.style.transition="",360);if(!moved&&onTap)onTap(el)}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}

/* WORD ORDER: rebuild a definition by dragging (or tapping) its pieces in order */
function chunkify(t){const w=t.split(/\s+/),out=[];let cur=[];w.forEach(x=>{cur.push(x);if(cur.length>=3){out.push(cur.join(" "));cur=[]}});if(cur.length){if(cur.length===1&&out.length)out[out.length-1]+=" "+cur[0];else out.push(cur.join(" "))}return out}
function runWordOrder(G,go){
  const D=G.defs;let di=0,okN=0;
  function show(){const d=D[di],parts=chunkify(d.text),order=shuffle(parts.map((t,i)=>({t,i})));let step=0,mist=0,done=false;
    ST().innerHTML=`<div class="row"><span class="count">التعريف ${AR(di+1)} من ${AR(D.length)}</span>${turnChip()}</div>
      <div class="wotitle"><span>🧩</span> رتّبوا تعريف: <b>${esc(d.term)}</b></div>
      <div class="woline" id="wol">${parts.map((_,k)=>`<span class="woslot${k===0?" next":""}" data-k="${k}"></span>`).join("")}</div>
      <div class="wotray" id="wot">${order.map((c,k)=>`<button class="wochip" type="button" data-i="${c.i}" style="--d:${(k*.13).toFixed(2)}s;--c:${GCOL[c.i%6]}">${esc(c.t)}</button>`).join("")}</div>
      <div class="msg" id="msg" aria-live="polite">✋ اسحبوا القطع إلى السطر بالترتيب الصحيح، أو اضغطوا عليها واحدة واحدة</div><div class="ex" id="ex" hidden></div>
      <div class="row"><button class="pill" id="wosol" type="button">👁 الحل</button><button class="btn" id="nx" type="button" hidden>${di+1<D.length?"التعريف التالي ←":"▶ ابدأ اللعبة"}</button></div>`;
    const slots=[...ST().querySelectorAll(".woslot")];
    const place=(el)=>{const i=+el.dataset.i;if(done)return;
      if(i===step){const s=slots[step];s.textContent=parts[i];s.classList.add("full","pop");s.style.setProperty("--c",GCOL[i%6]);s.classList.remove("next");el.remove();step++;tone(500+step*60,.08,.07,"triangle");
        if(slots[step])slots[step].classList.add("next");
        if(step===parts.length){done=true;const pts=mist===0?2:1;okN++;award(turn,pts);$("#msg").className="msg good";$("#msg").textContent=`🎉 اكتمل التعريف! ${pts===2?"نقطتان":"نقطة"} لـ ${tname(turn)}`;celebrate(mist?praise():"ترتيب مثالي! 🏆",!mist);$("#wol").classList.add("done");fin()}
        else{$("#msg").className="msg good";$("#msg").textContent="صحيح! القطعة التالية"}}
      else{mist++;buzz();shakeEl(el);el.style.transition="transform .35s";el.style.transform="";$("#msg").className="msg bad";$("#msg").textContent="ليست هذه القطعة التالية، حاولوا مرة ثانية"}};
    ST().querySelectorAll(".wochip").forEach(el=>dragify(el,".woline",()=>place(el),()=>place(el)));
    function fin(){$("#wosol").disabled=true;$("#ex").hidden=false;$("#ex").innerHTML=`<small>💡 من الكتاب${d.p?` · ص ${AR(d.p)}`:""}</small><b>${esc(d.term)}:</b> ${esc(d.text)}`;showNx()}
    $("#wosol").onclick=()=>{if(done)return;done=true;for(let k=step;k<parts.length;k++){slots[k].textContent=parts[k];slots[k].classList.add("full");slots[k].style.setProperty("--c",GCOL[k%6])}$("#wot").innerHTML="";$("#msg").className="msg";$("#msg").textContent="هذا هو التعريف الصحيح";fin()};
    $("#nx").onclick=()=>{nextTurn();di++;tone(660,.05);if(di<D.length){show();scrollStage()}else go()}}
  show();
}

  return `<svg viewBox="0 0 600 230" class="rpsv${st?" "+st:""}" aria-label="حبل الاتزان"><defs><linearGradient id="rpsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb37a"/><stop offset=".6" stop-color="#ffe0b0"/><stop offset="1" stop-color="#fff4dc"/></linearGradient></defs>

  return `<div class="klico">${b.icon||"📍"}</div>`}

/* SCALES: two population balances — factors (natural / human) and density (high / low) */

/* CALENDAR: the season wheel of Kuwait — the wheel turns, the sky changes */
function runKCal(G){
  const B=G.bins,n=B.length,cnt=(log,k)=>log.filter(l=>l.k===k&&l.ok).length,SK=k=>/صيف/.test(B[k].name)&&!/ربيع/.test(B[k].name)?"sum":/شتاء/.test(B[k].name)?"win":/ربيع/.test(B[k].name)?"spr":"sum";

/* GEO: the geographer's lens — sweep the lens over the map to read the landmarks, then pick the right one */

    <path d="M0 120H400M200 0V240" stroke="#fff" stroke-opacity=".45" stroke-dasharray="6 6"/></svg>`;
  let last=null;
  mcqLoop(G,"الاكتشاف",{hint:"🔍 حرّكوا العدسة فوق الخريطة لتقرؤوا المعالم، ثم اضغطوا على المعلم الصحيح",
    top:(res,Q,i,it)=>`<div class="kgwrap">${SADU}<div class="kghead"><span class="kgglobe">🌍</span><b>عدسة الجغرافي</b>${stamps(res,Q.length)}</div>
